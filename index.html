  /* Every place the menu offers, in the order it was registered. */
  function menuItems() {
    var out = [];
    var seen = {};
    var i, id;
    // The chosen order first, then anything else the registry offers, so a new
    // menu place still appears without being put on this list.
    for (i = 0; i < MENU_ORDER.length; i++) {
      id = MENU_ORDER[i];
      var d = PLACES[id];
      if (!d || d.from !== 'menu') continue;
      seen[id] = 1;
      out.push({ id: id, label: d.menuLabel || d.label, sub: menuSubFor(id) });
    }
    for (id in PLACES) {
      if (!PLACES.hasOwnProperty(id) || seen[id]) continue;
      if (PLACES[id].from !== 'menu') continue;
      out.push({
        id: id,
        label: PLACES[id].menuLabel || PLACES[id].label,
        sub: menuSubFor(id)
      });
    }
    return out;
  }

      var p = k.split(',');
      var cx = Number(p[0]), cy = Number(p[1]);
      if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
      if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
    }
    return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
  }

  /* The map, as a page. Tapping a tile she has been to travels there. */
  function drawMap(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);
    ctx.fillStyle = C.plaster;
    ctx.fillRect(0, 0, 390, 844);

    ctx.textAlign = 'center';
    ctx.fillStyle = C.ink;
    ctx.font = 'italic 34px ' + FONT_SERIF;
    ctx.fillText('The island', 195, 70);

    // Where she is, named, above the grid.
    ctx.fillStyle = C.terracotta;
    ctx.font = '600 11px ' + FONT_UI;
    spacedText((sectionDef() ? sectionDef().name : 'the island').toUpperCase(), 195, 96, 1.6);

    var b = mapBounds();
    var cols = b.maxX - b.minX + 1, rows = b.maxY - b.minY + 1;
    // The grid, as large as fits between the title and the foot.
    var top = 118, bottom = 736;
    var availW = 390 - 44, availH = bottom - top;
    var cell = Math.floor(Math.min(availW / cols, availH / rows));
    var gw = cell * cols, gh = cell * rows;
    var gx = 195 - gw / 2, gy = top + (availH - gh) / 2 + gh / 2 - gh / 2;

    var here = section.cx + ',' + section.cy;
    var seenCount = 0;
    for (var key in SECTIONS) {
      if (!SECTIONS.hasOwnProperty(key)) continue;
      var sp = key.split(',');
      var cx = Number(sp[0]), cy = Number(sp[1]);
      var x = gx + (cx - b.minX) * cell;
      var y = gy + (cy - b.minY) * cell;
      var def = SECTIONS[key];
      var seen = !!visited[key];
      var isHere = key === here;
      if (seen) seenCount++;

      // A tile she has not been to is faint and unnamed: the island is found.
      ctx.fillStyle = seen ? (MAP_TONE[def.kind] || '#9BAA7C') : 'rgba(174,174,152,0.30)';
      roundRect(x + 1.5, y + 1.5, cell - 3, cell - 3, 3);
      ctx.fill();

      // A shade inside each seen tile, so the grid has depth rather than being flat.
      if (seen) {
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        roundRect(x + 1.5, y + 1.5, cell - 3, (cell - 3) * 0.5, 3);
        ctx.fill();
      }

      if (isHere) {
        ctx.strokeStyle = C.terracotta;
        ctx.lineWidth = 2.5;
        roundRect(x + 1.5, y + 1.5, cell - 3, cell - 3, 3);
        ctx.stroke();
        ctx.fillStyle = C.terracotta;
        ctx.beginPath();
        ctx.arc(x + cell / 2, y + cell / 2, Math.max(2.4, cell * 0.12), 0, TAU);
        ctx.fill();
      } else if (seen) {
        addHit(x + 1.5, y + 1.5, cell - 3, cell - 3, 'travel', key);
      }

      // The name, inside the tile, in tiny caps - only where there is room for it.
      if (seen && cell >= 40) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(250,247,238,0.92)';
        ctx.font = '600 7px ' + FONT_UI;
        var nm = def.name.replace(/^the /, '');
        // Two lines if the name has two words.
        var words = nm.split(' ');
        if (words.length > 1 && cell >= 46) {
          ctx.fillText(words[0].toUpperCase(), x + cell / 2, y + cell - 15);
          ctx.fillText(words.slice(1).join(' ').toUpperCase(), x + cell / 2, y + cell - 7);
        } else {
          ctx.fillText(nm.toUpperCase(), x + cell / 2, y + cell - 10);
        }
        ctx.restore();
      }
    }

    // The instruction, in the space the grid left.
    ctx.textAlign = 'center';
    ctx.fillStyle = C.inkSoft;
    ctx.font = 'italic 14px ' + FONT_SERIF;
    ctx.fillText(seenCount > 1 ? 'tap a place you have walked to' : 'walk further, and the map fills in', 195, 764);

    // The way back at the foot.
    var bw = 190, bh = 42, bx = 195 - bw / 2, by = 786;
    ctx.fillStyle = C.terracotta;
    roundRect(bx, by, bw, bh, bh / 2);
    ctx.fill();
    ctx.fillStyle = C.paper;
    ctx.font = '600 15px ' + FONT_UI;
    ctx.fillText('back to the island', 195, by + bh / 2 + 0.5);
    addHit(bx, by, bw, bh, 'mapclose');

    ctx.textAlign = 'left';
    pageEnd();
  }

  /* Travel: stand her in the middle of the chosen section. The middle is the
     open stage every design keeps, so she never lands inside something. */
  function travelTo(key) {
    var def = SECTIONS[key];
    if (!def || !visited[key]) return false;
    var sp = key.split(',');
    section.cx = Number(sp[0]);
    section.cy = Number(sp[1]);
    interior = null;
    boatRide.riding = false;
    boatRide.wake.length = 0;
    hero.x = world.w * 0.5;
    hero.y = world.h * 0.56;
    hero.vx = 0; hero.vy = 0;
    walkTarget = null;
    islandVerb = null;
    propCache = {};
    scene = 'island';
    buildScenery();
    visitSection(section.cx, section.cy);
    return true;
  }
  /* The island chart: nine places on one page, the yard at the centre. */
  var CHART = ['forest', 'alpine', 'desert', 'beach', 'sea', 'lake', 'river', 'steppe'];

  function drawChart() {
    var cx = 195, cy = 492, rx = 128, ry = 106;
    var i, n, id;

    // The water the island sits in, then the island itself.
    ctx.fillStyle = 'rgba(150,190,196,0.22)';
    roundRect(24, 336, 342, 320, 26);
    ctx.fill();

    ctx.fillStyle = 'rgba(206,196,158,0.85)';
    ctx.beginPath();
    ctx.moveTo(cx - rx - 6, cy - 10);
    ctx.bezierCurveTo(cx - rx, cy - ry - 16, cx - 40, cy - ry - 10, cx, cy - ry - 4);
    ctx.bezierCurveTo(cx + 54, cy - ry - 6, cx + rx + 2, cy - ry + 6, cx + rx + 4, cy + 4);
    ctx.bezierCurveTo(cx + rx - 2, cy + ry - 6, cx + 60, cy + ry + 10, cx + 4, cy + ry + 6);
    ctx.bezierCurveTo(cx - 60, cy + ry + 10, cx - rx + 2, cy + ry - 2, cx - rx - 6, cy - 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,140,110,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    for (i = 0; i < CHART.length; i++) {
      id = CHART[i];
      n = { id: id, a: -Math.PI / 2 + i * TAU / CHART.length };
      var nx = cx + Math.cos(n.a) * rx;
      var ny = cy + Math.sin(n.a) * ry;
      var r = regionOf(id);
      ctx.fillStyle = r ? r.ground : '#8FA37D';
      ctx.beginPath();
      ctx.arc(nx, ny, 26, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(247,244,238,0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(nx, ny);
      ctx.scale(0.62, 0.62);
      drawRegionGlyph(id);
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = C.inkSoft;
      ctx.font = '600 9.5px ' + FONT_UI;
      ctx.fillText(id, nx, ny + 37);
      addHit(nx - 28, ny - 28, 56, 56, 'place', id);

      if (storyDone[id]) {
        ctx.strokeStyle = C.turquoise;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(nx + 13, ny - 21);
        ctx.lineTo(nx + 18, ny - 16);
        ctx.lineTo(nx + 25, ny - 26);
        ctx.stroke();
      }
    }

    // The yard, at the centre of everything.
    ctx.fillStyle = C.paper;
    ctx.beginPath();
    ctx.arc(cx, cy, 42, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(216,204,184,0.95)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // A small hive on the disc, drawn here so it fits.
    ctx.fillStyle = '#4E3219';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 12, 10, 5, 0, 0, TAU);
    ctx.fill();
    var bands = [
      { y: 6, w: 19 }, { y: -1, w: 21 }, { y: -8, w: 19 },
      { y: -14, w: 15 }, { y: -19, w: 9 }
    ];
    for (i = 0; i < bands.length; i++) {
      ctx.fillStyle = i % 2 ? '#E1BC79' : '#EDD294';
      ctx.beginPath();
      ctx.ellipse(cx, cy + bands[i].y, bands[i].w, 5.5, 0, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = '#4E3219';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 18, 6, 3.4, 0, 0, TAU);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.font = '600 10px ' + FONT_UI;
    ctx.fillText('the yard', cx, cy + 31);
    addHit(cx - 42, cy - 42, 84, 84, 'place', 'yard');
    ctx.textAlign = 'left';
  }

  function hexagon(cx, cy, r) {
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = Math.PI / 6 + i * Math.PI / 3;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.92;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

    ctx.beginPath();

      { y: 34, rx: 58, c: '#D9B06A' },
      { y: 18, rx: 64, c: '#E1BC79' },

      { y: -18, rx: 54, c: '#EDD294' },
      { y: -34, rx: 41, c: '#F0D9A2' },

    ];
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];

    ctx.fillStyle = '#4E3219';
    ctx.beginPath();
    ctx.ellipse(0, 34, 16, 10, 0, 0, TAU);
    ctx.fill();

    // A bee on her way out.
    drawBee(54, -72, 1.35);

  function drawPaperCard(cssW, cssH, title, subtitle, lines, cta, page) {
    var s = clamp(Math.min(cssW, cssH) / 520, 0.82, 1.5);
    ctx.fillStyle = 'rgba(30,26,22,0.42)';
    ctx.fillRect(0, 0, cssW, cssH);

    var w = Math.min(cssW - 48 * s, 330 * s);
    var h = (page ? 372 : 300) * s;
    var x = cssW / 2 - w / 2, y = cssH / 2 - h / 2;

    ctx.fillStyle = 'rgba(30,26,22,0.22)';
    roundRect(x + 4 * s, y + 8 * s, w, h, 16 * s);
    ctx.fill();
    ctx.fillStyle = C.paper;
    roundRect(x, y, w, h, 16 * s);
    ctx.fill();
    ctx.strokeStyle = C.rule;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = C.ink;
    fitFont(ctx, title, 30 * s, w - 48 * s, '600', FONT_SERIF, 'italic ');
    ctx.fillText(title, cssW / 2, y + 54 * s);

    ctx.fillStyle = C.turquoise;
    ctx.fillRect(cssW / 2 - 20 * s, y + 82 * s, 40 * s, 2 * s);

    ctx.fillStyle = C.inkSoft;
    ctx.font = '400 ' + Math.round(14 * s) + 'px ' + FONT_UI;
    ctx.fillText(subtitle, cssW / 2, y + 108 * s);

    ctx.fillStyle = C.ink;
    ctx.font = '500 ' + Math.round(16 * s) + 'px ' + FONT_UI;
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], cssW / 2, y + 148 * s + i * 26 * s);
    }

    if (page) {
      var rule = y + h - 122 * s;
      ctx.strokeStyle = 'rgba(42,35,32,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 30 * s, rule);
      ctx.lineTo(x + w - 30 * s, rule);
      ctx.stroke();

      ctx.fillStyle = C.ink;
      ctx.font = 'italic 500 ' + Math.round(13 * s) + 'px ' + FONT_SERIF;
      var pdfont = 'italic 500 ' + Math.round(13 * s) + 'px ' + FONT_SERIF;
      var pageLines = wrapText(page.line, w - 56 * s, pdfont);
      for (var pl = 0; pl < Math.min(2, pageLines.length); pl++) {
        ctx.fillText(pageLines[pl], cssW / 2, y + h - (92 - pl * 17) * s);
      }

      var word = storyWord(page.w);
      ctx.font = 'italic 600 ' + Math.round(15 * s) + 'px ' + FONT_SERIF;
      var wordW = ctx.measureText(word.f).width;
      ctx.font = '400 ' + Math.round(13 * s) + 'px ' + FONT_UI;
      var meanW = word.p ? ctx.measureText(word.p).width : 0;
      var rowX = cssW / 2 - (wordW + (word.p ? 10 * s + meanW : 0)) / 2;
      ctx.textAlign = 'left';
      ctx.fillStyle = C.turquoiseDeep;
      ctx.font = 'italic 600 ' + Math.round(15 * s) + 'px ' + FONT_SERIF;
      ctx.fillText(word.f, rowX, y + h - 48 * s);
      if (word.p) {
        ctx.fillStyle = C.inkSoft;
        ctx.font = '400 ' + Math.round(13 * s) + 'px ' + FONT_UI;
        ctx.fillText(word.p, rowX + wordW + 10 * s, y + h - 48 * s);
      }
      ctx.textAlign = 'center';
    }

    if (cta) {
      ctx.fillStyle = C.inkFaint;
      ctx.font = '500 ' + Math.round(12 * s) + 'px ' + FONT_UI;
      ctx.fillText(cta, cssW / 2, y + h - (page ? 14 : 34) * s);
    }
    ctx.textAlign = 'left';
  }

  function fitFont(c, text, size, maxWidth, weight, family, style) {
    var sz = size;
    c.font = (style || '') + (weight || 'normal') + ' ' + Math.round(sz) + 'px ' + (family || FONT_UI);
    while (sz > 9 && c.measureText(text).width > maxWidth) {
      sz -= 1;
      c.font = (style || '') + (weight || 'normal') + ' ' + Math.round(sz) + 'px ' + (family || FONT_UI);
    }
  }

  function spacedText(text, cx, y, gap) {
    var total = 0, i;
    for (i = 0; i < text.length; i++) total += ctx.measureText(text[i]).width + gap;
    total -= gap;
    var x = cx - total / 2;
    var align = ctx.textAlign;
    ctx.textAlign = 'left';
    for (i = 0; i < text.length; i++) {
      ctx.fillText(text[i], x, y);
      x += ctx.measureText(text[i]).width + gap;
    }
    ctx.textAlign = align;
  }

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  function fmtTime(t) {
    var total = Math.max(0, Math.ceil(t));
    var m = Math.floor(total / 60);
    var sec = total - m * 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  /* 10. CHARACTERS - one place draws each; the studio's close-ups reuse it. */
  function drawCharacter(g, key, size) {
    if (customArt(key) && images[key]) {
      var img = images[key];
      var iw = img.naturalWidth || img.width || size;
      var ih = img.naturalHeight || img.height || size;
      var ar = iw / ih;
      var dw, dh;
      if (ar >= 1) { dw = size; dh = size / ar; }
      else { dh = size; dw = size * ar; }
      g.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      return;
    }
    if (key === 'hero') drawDarya(g, size, hero.moving > 0.15);
    else if (key === 'enemy') drawDustDevil(g, size);
    else if (key === 'pickup') drawNectar(g, size);
    else if (key === 'hive') drawSkep(g, size);
  }

      kitchen: function () { return kitchen; }, wagon: function () { return wagon; },
      stream: function () { return stream; }, lanterns: function () { return lanterns; },
      beeline: function () { return beeline; }, removal: function () { return removal; },

      kitchen: "done", wagon: "done", stream: "done", lanterns: "done",

  /* 13. THREE MORE PLACES ------------------------------------------------
   * The meadow day is one place. These three are pages of their own, each with
   * a different verb: read the stone, time the strike, join the stars. All
   * three share the paper chrome, the 390x844 page and the word card.
   */
  function pageBegin(cssW, cssH) {
    pageK = Math.min(cssW / 390, cssH / 844);
    pageTX = (cssW - 390 * pageK) / 2;
    pageTY = (cssH - 844 * pageK) / 2;
    ctx.save();
    ctx.translate(pageTX, pageTY);
    ctx.scale(pageK, pageK);
  }
  function pageEnd() { ctx.restore(); }

  function pagePoint(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left - pageTX) / pageK,
      y: (e.clientY - rect.top - pageTY) / pageK
    };
  }

  /* The island draws in CSS pixels, not on the 390x844 page, so its taps must
     be read in CSS pixels too. Mixing the two put the chip a few pixels off. */
  function cssPoint(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function addHit(x, y, w, h, act, arg) { hits.push({ x: x, y: y, w: w, h: h, act: act, arg: arg }); }
  function hitAt(p) {
    for (var i = hits.length - 1; i >= 0; i--) {
      var h = hits[i];
      if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h;
    }
    return null;
  }
  function wrapText(text, maxWidth, font) {
    ctx.font = font;
    var words = text.split(' ');
    var lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  /* The chrome every place shares: a way home, and the place's name. */
  function placeHeader(title) {

    ctx.fillStyle = 'rgba(247,244,238,0.94)';

    ctx.stroke();
    ctx.fillStyle = C.inkSoft;

    ctx.fillText('\u2039 island', 26, 32);
    addHit(12, 14, 88, 36, 'home');

    // language switch lives inside it, so it is reachable from every screen.
    ctx.fillStyle = 'rgba(247,244,238,0.94)';
    roundRect(106, 14, 74, 36, 18);
    ctx.fill();
    ctx.strokeStyle = 'rgba(216,204,184,0.9)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = C.inkSoft;

  /* A place is a page with one verb. Every place registers here, so a new one
   * is one entry and the title, the renderer, the pointer and the autopilot
   * all find it without a new condition anywhere. */
  var PLACES = {};
  var PLACE_GROUPS = [
    { label: 'the hive', ids: ['comb', 'queen'] },
    { label: 'the yard', ids: ['glasshouse', 'hens', 'kitchen', 'wagon'] },
    { label: 'the island', ids: ['stream', 'lanterns', 'beeline', 'removal'] },
    { label: 'the old stones', ids: ['shrine', 'sky'] }
  ];
  function addPlace(id, def) { PLACES[id] = def; }
  /* The order the menu reads in. A menu is a sequence someone chose; leaving it to
     the registry's insertion order is how "the bag" came before "the words". */
  var MENU_ORDER = ['map', 'words', 'bag', 'notebook', 'sky'];

  function placeDef(id) { return PLACES[id] || null; }

  function chromeTap(p) {
    var h = hitAt(p);
    // The arrow in a place's header goes back one step: to the island. The menu is
    // one step further out, and the island's own arrow opens it.
    if (h && h.act === 'home') { backToIsland(); return true; }
    if (h && h.act === 'card') { backToIsland(); return true; }
    return false;
  }

  /* ---- THE ISLAND'S MENU -------------------------------------------------
     Everything the island holds, in one place: the errands she is on, the word
     book, the notebook, the bag, the map, the sky, and the language. Before this,
     the word book and the notebook could only be reached from the title screen,
     so a player on the island had no way to look at what she had learned. */
  var menu = { open: false, at: -9 };
  var LANG = 'en';            // 'en' or 'fa': which language leads in the word book
  try { LANG = localStorage.getItem('darya.lang') || 'en'; } catch (e) {}

  function openMenu() { menu.open = true; menu.at = clock; hits = []; }
  function closeMenu() { menu.open = false; hits = []; }

  function menuDown(p) {
    var h = hitAt(p);
    if (!h) { return; }
    if (h.act === 'menuclose') { closeMenu(); return; }
    if (h.act === 'menulang') {
      LANG = LANG === 'en' ? 'fa' : 'en';
      try { localStorage.setItem('darya.lang', LANG); } catch (e) {}
      return;
    }
    if (h.act === 'menugo') {
      var id = h.arg;
      closeMenu();
      if (id === 'resume') { return; }
      enterPlace(id);
      return;
    }
  }

  /* The gloss shown beside a Finglish word, in the chosen language. */
  function glossOf(w) {
    if (!w) return '';
    return LANG === 'fa' ? (w.p || w.e || '') : (w.e || w.p || '');
  }

  function drawMenu(cssW, cssH) {
    hits = [];
    var k = clamp(Math.min(cssW, cssH) / 520, 0.8, 1.6);
    ctx.save();
    ctx.fillStyle = 'rgba(26,22,18,0.46)';
    ctx.fillRect(0, 0, cssW, cssH);

    var w = Math.min(cssW - 40 * k, 330 * k);
    var rows = [
      { id: 'resume', label: 'back to the island', sub: '' },
      { id: 'words', label: 'the word book', sub: learned.length + ' / ' + words.length },
      { id: 'notebook', label: 'the notebook', sub: storyPages() + ' / ' + STORY.length },
      { id: 'bag', label: 'the bag', sub: String(bagCount()) },
      { id: 'map', label: 'the map', sub: mapSubFor() },
      { id: 'sky', label: 'the sky', sub: dayName() }
    ];
    var rowH = 46 * k, headH = 62 * k, footH = 52 * k;
    var h = headH + rows.length * rowH + footH + 24 * k;
    var x = cssW / 2 - w / 2, y = cssH / 2 - h / 2;

    ctx.fillStyle = 'rgba(26,22,18,0.22)';
    roundRect(x + 4 * k, y + 8 * k, w, h, 18 * k);
    ctx.fill();
    ctx.fillStyle = C.paper;
    roundRect(x, y, w, h, 18 * k);
    ctx.fill();
    ctx.strokeStyle = C.rule;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.font = 'italic 600 ' + Math.round(23 * k) + 'px ' + FONT_SERIF;
    ctx.fillText('the island', x + 22 * k, y + 34 * k);

    // The errand she is on, so the menu answers "what am I doing".
    var er = errandDone() ? null : errand();
    ctx.fillStyle = C.inkFaint;
    ctx.font = '400 ' + Math.round(11 * k) + 'px ' + FONT_UI;
    var erLine = er ? er.line : 'every errand is done';
    ctx.fillText(erLine, x + 22 * k, y + 52 * k);

    for (var i = 0; i < rows.length; i++) {
      var ry = y + headH + i * rowH;
      if (i === 0) {
        ctx.strokeStyle = 'rgba(42,35,32,0.10)';
        ctx.beginPath();
        ctx.moveTo(x + 18 * k, ry);
        ctx.lineTo(x + w - 18 * k, ry);
        ctx.stroke();
      }
      ctx.fillStyle = i === 0 ? C.turquoiseDeep : C.ink;
      ctx.font = (i === 0 ? '600 ' : '500 ') + Math.round(15 * k) + 'px ' + FONT_UI;
      ctx.fillText(rows[i].label, x + 22 * k, ry + rowH / 2);
      if (rows[i].sub) {
        ctx.fillStyle = C.inkFaint;
        ctx.font = '400 ' + Math.round(12 * k) + 'px ' + FONT_UI;
        ctx.textAlign = 'right';
        ctx.fillText(rows[i].sub, x + w - 22 * k, ry + rowH / 2);
        ctx.textAlign = 'left';
      }
      addHit(x + 12 * k, ry, w - 24 * k, rowH, 'menugo', rows[i].id);
    }

    // The language, at the foot of the sheet.
    var fy = y + headH + rows.length * rowH + 10 * k;
    ctx.strokeStyle = 'rgba(42,35,32,0.10)';
    ctx.beginPath();
    ctx.moveTo(x + 18 * k, fy);
    ctx.lineTo(x + w - 18 * k, fy);
    ctx.stroke();
    ctx.fillStyle = C.inkSoft;
    ctx.font = '500 ' + Math.round(13 * k) + 'px ' + FONT_UI;
    ctx.fillText('the words in', x + 22 * k, fy + 26 * k);
    var lw = 92 * k;
    ctx.fillStyle = 'rgba(74,147,172,0.14)';
    roundRect(x + w - 22 * k - lw, fy + 12 * k, lw, 28 * k, 14 * k);
    ctx.fill();
    ctx.fillStyle = C.turquoiseDeep;
    ctx.textAlign = 'center';
    ctx.font = '600 ' + Math.round(12 * k) + 'px ' + FONT_UI;
    ctx.fillText(LANG === 'fa' ? 'Farsi / English' : 'English / Farsi', x + w - 22 * k - lw / 2, fy + 26 * k);
    ctx.textAlign = 'left';
    addHit(x + w - 22 * k - lw, fy + 12 * k, lw, 28 * k, 'menulang');

    ctx.restore();

    // A tap outside the sheet closes it.
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, 4, 4);
    addHit(0, 0, cssW, Math.max(0, y), 'menuclose');
    addHit(0, y + h, cssW, Math.max(0, cssH - (y + h)), 'menuclose');
  }

  function mapSubFor() {
    var found = 0, all = 0;
    for (var vk in SECTIONS) {
      if (!SECTIONS.hasOwnProperty(vk)) continue;
      all++;
      if (visited[vk]) found++;
    }
    return found + ' / ' + all;
  }

  /* The card a place shows when it is finished: what it gave, and the page it wrote. */
  function placeDoneCard(title, sub, lines, marks) {
    if (marks !== false) storyMark(scene);
    drawPaperCard(390, 844, title, sub, lines, 'Tap to go back', storyPage(scene));
    hits = [];
    addHit(0, 0, 390, 844, 'card');
  }

  function backToTitle() {
    scene = 'island';
    phase = 'title';
    wordCard = null;
    notice = null;
    particles.length = 0;
    floaters.length = 0;
    hits = [];
    paused = false;
  }

  /* Leaving a place returns her to the island where she stood, not to the menu.
     The menu is one step further out, and only the island's own arrow goes there. */
  function backToIsland() {
    phase = 'playing';
    scene = 'island';
    stage = 'island';
    wordCard = null;
    notice = null;
    hits = [];
    paused = false;
  }

  function enterPlace(id) {
    var d = placeDef(id);
    if (!d) return;
    phase = 'playing';
    scene = id;
    wordCard = null;
    notice = null;
    particles.length = 0;
    floaters.length = 0;
    d.enter();
  }

  /* ---- The look page: whatever she stands at, drawn large ---------------- */
  var look = { sp: null, at: -9, kind: '', where: '' };
  var lookMemory = null;

  function enterLook(sp, kind, where) {
    if (sp) look.sp = sp;
    look.at = clock;
    look.kind = kind || '';
    look.where = where || '';
    scene = 'look';
  }

  /* What kind of thing it is, in words a person would use, from its own row. */
  function lookKindOf(sp) {
    if (!sp) return '';
    if (sp.sh === 'plant') {
      var ps = sp.ps || 'stem';
      if (ps === 'tree' || ps === 'round' || ps === 'tall' || ps === 'droop') return 'a tree';
      if (ps === 'tuft') return 'a ground plant';
      if (ps === 'reed') return 'a reed';
      return 'a flowering plant';
    }
    if (sp.sh === 'fungus') return 'a fungus';
    if (sp.sh === 'bird') return 'a bird';
    if (sp.sh === 'fish') return 'a fish';
    if (sp.sh === 'insect') return 'an insect';
    if (sp.sh === 'frog') return 'a frog';
    if (sp.sh === 'seal') return 'a seal';
    if (sp.sh === 'hen') return 'a hen';
    if (sp.sh === 'being') return 'a person of the island';
    if (sp.sh === 'find') return 'something the island left';
    if (sp.sh === 'beast' || sp.sh === 'cat' || sp.sh === 'dog') return 'an animal';
    return '';
  }

  /* The one line under the name: what it is, and where she found it. */
  function lookLines(sp) {
    var out = [];
    var kind = lookKindOf(sp);
    if (kind) out.push(kind.charAt(0).toUpperCase() + kind.slice(1) + (look.where ? ', in ' + look.where : ''));
    if (sp.sh === 'plant') {
      out.push(sp.ps === 'tree' ? 'Wood, shade and a place out of the wind.'
        : sp.ps === 'tuft' ? 'Low ground cover, walked over without noticing.'
          : 'It flowers, and the bees know it.');
    } else if (sp.sh === 'fungus') {
      out.push('It grows from what the ground has finished with.');
    } else if (sp.sh === 'bird') {
      out.push('It hops a few steps, stops, and looks at the ground.');
    } else if (sp.sh === 'fish') {
      out.push('It keeps to the cool water and the shadow of the bank.');
    } else if (sp.sh === 'insect') {
      out.push('Small enough to be missed, and the whole hive runs on them.');
    } else if (sp.sh === 'beast') {
      out.push('It gives ground when she comes close, and comes back when she goes.');
    } else if (sp.sh === 'being') {
      out.push('One of the people of the island, with a word of their own.');
    }
    return out.slice(0, 3);
  }

  function updateLook() {
    if (clock - look.at > 900) backToTitle();
  }

  function lookDown(p) {
    backToTitle();
  }

  function autoLook() {
    if (clock - look.at > 3.2) backToTitle();
  }

  function drawLook(cssW, cssH) {
    // The page's paper, in the same stock as the notebook.
    ctx.fillStyle = C.plaster;
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    var sp = look.sp;
    var s = clamp(Math.min(cssW, cssH) / 520, 0.8, 1.4);
    var pad = 18 * s;

    // The whole column - plate, name, word, lines, the way out - is measured
    // first and centred, so a tall phone does not leave a hole under it.
    var plateH = Math.min(cssH * 0.50, 340 * s);
    // The column's real height: the plate plus everything under it, measured
    // from the same numbers that draw it, so it centres on what is visible.
    var textH = (sp ? 214 : 74) * s;
    var totalH = plateH + textH;
    var top = Math.max(20 * s, (cssH - totalH) / 2);
    var plateY = top;
    var plateX = pad;
    var plateW = cssW - pad * 2;

    ctx.fillStyle = '#EFE9D8';
    roundRect(plateX, plateY, plateW, plateH, 14 * s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(42,35,32,0.10)';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (sp) {
      ctx.save();
      roundRect(plateX, plateY, plateW, plateH, 14 * s);
      ctx.clip();
      var cx = cssW / 2, cy = plateY + plateH * 0.84;
      // Each kind is drawn at the size it needs to fill the plate: a tree is
      // already 120 px tall at 1x, a beetle is 10 px.
      // How tall and how wide each kind is at 1x, so the plate can choose a
      // scale that fits the drawing inside it both ways.
      var natural = {
        plant: [70, 46], fungus: [40, 34], bird: [26, 30], fish: [22, 34],
        insect: [18, 26], beast: [86, 96], being: [150, 46], frog: [22, 30],
        seal: [60, 90], hen: [34, 30], find: [26, 26], cat: [50, 62], dog: [66, 76]
      };
      var nat = natural[sp.sh] || [60, 60];
      if (sp.ps === 'tree' || sp.ps === 'round' || sp.ps === 'tall' || sp.ps === 'droop') nat = [126, 84];
      else if (sp.ps === 'tuft') nat = [22, 30];
      var room = plateH * 0.86;
      var wide = plateW * 0.88;
      var sc = Math.min(room / nat[0], wide / nat[1]);
      if (sp.sh === 'insect') {
        // A leaf, so the insect has something to stand on.
        ctx.fillStyle = '#8FA96A';
        ctx.beginPath();
        ctx.ellipse(cx, cy - 6 * s, 66 * s, 12 * s, 0, 0, TAU);
        ctx.fill();
      }
      ctx.save();
      ctx.translate(cx, cy);
      drawSpecies(sp, 0, 0, clock, sc);
      ctx.restore();
      ctx.restore();
    }

    var y = plateY + plateH;

    // The name, in the keeper's own hand.
    var title = sp ? (sp.e || sp.f) : 'nothing here';
    ctx.fillStyle = C.ink;
    fitFont(ctx, title, 26 * s, plateW - 40 * s, '600', FONT_SERIF, 'italic ');
    ctx.fillText(title, cssW / 2, y + 38 * s);

    ctx.fillStyle = C.turquoise;
    ctx.fillRect(cssW / 2 - 18 * s, y + 58 * s, 36 * s, 2 * s);

    if (sp) {
      // The word, in both scripts, which is the pair the island teaches.
      ctx.fillStyle = C.turquoiseDeep;
      ctx.font = 'italic 600 ' + Math.round(20 * s) + 'px ' + FONT_SERIF;
      ctx.fillText(sp.f, cssW / 2, y + 84 * s);
      ctx.fillStyle = C.inkSoft;
      ctx.font = '400 ' + Math.round(17 * s) + 'px ' + FONT_UI;
      ctx.fillText(sp.p || '', cssW / 2, y + 110 * s);

      // What it is, and where it lives.
      ctx.fillStyle = C.inkSoft;
      ctx.font = '400 ' + Math.round(13 * s) + 'px ' + FONT_UI;
      var lines = lookLines(sp);
      var ly = y + 138 * s;
      for (var i = 0; i < lines.length; i++) {
        var wrapped = wrapText(lines[i], plateW - 30 * s, '400 ' + Math.round(13 * s) + 'px ' + FONT_UI);
        for (var w = 0; w < wrapped.length && w < 2; w++) {
          ctx.fillText(wrapped[w], cssW / 2, ly);
          ly += 19 * s;
        }
        ly += 4 * s;
      }
    }

    // The way out is the page itself, said plainly under everything else.
    ctx.fillStyle = 'rgba(42,35,32,0.42)';
    ctx.font = 'italic 400 ' + Math.round(12 * s) + 'px ' + FONT_SERIF;
    ctx.fillText('tap to go back', cssW / 2, y + (sp ? 214 : 74) * s);

    hits = [];
    addHit(0, 0, cssW, cssH, 'card');
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  addPlace('look', { from: 'internal',
    label: 'Close look',
    enter: function () {
      if (lookMemory) { look.sp = lookMemory.sp; look.where = lookMemory.where; }
    },
    update: updateLook, draw: drawLook, down: lookDown, auto: autoLook
  });

  /* ---- The shrine: a sentence in the stone, and three carved clues ------ */
  var SHRINE_WORDS = [
    { key: 'bagh', f: 'bagh', e: 'garden', p: '\u0628\u0627\u063A' },
    { key: 'gol', f: 'gol', e: 'flower', p: '\u06AF\u0644' },
    { key: 'ab', f: 'ab', e: 'water', p: '\u0622\u0628' },
    { key: 'kandu', f: 'kandu', e: 'hive', p: '\u06A9\u0646\u062F\u0648' },
    { key: 'qanat', f: 'qanat', e: 'channel', p: '\u0642\u0646\u0627\u062A' },
    { key: 'shab', f: 'shab', e: 'night', p: '\u0634\u0628' }
  ];
  var SHRINE_ANSWER = ['bagh', 'ab', 'qanat'];
  var SHRINE_CLUES = [
    'A place where things grow, but not a flower.',
    'What you drink, but not a hive.',
    'A channel dug by hand, but not the night.'
  ];
  var shrine = {
    blanks: [null, null, null],
    sel: 0,
    msg: '',
    msgAge: 9,
    shakeAt: -9,
    done: false,
    doneAt: 0,
    glow: 0
  };

  function enterShrine() {
    shrine.blanks = [null, null, null];
    shrine.sel = 0;
    shrine.msg = '';
    shrine.msgAge = 9;
    shrine.shakeAt = -9;
    shrine.done = false;
    shrine.glow = 0;
  }

  function shrineWord(key) {
    for (var i = 0; i < SHRINE_WORDS.length; i++) if (SHRINE_WORDS[i].key === key) return SHRINE_WORDS[i];
    return null;
  }
  function shrineUsed(key) {
    if (!key) return false;
    return shrine.blanks[0] === key || shrine.blanks[1] === key || shrine.blanks[2] === key;
  }

  function shrinePlace(idx, key) {
    if (shrine.done) return false;
    if (key !== SHRINE_ANSWER[idx]) {
      shrine.msg = 'The stone refuses it. ' + SHRINE_CLUES[idx];
      shrine.msgAge = 0;
      shrine.shakeAt = clock;
      sfx.bee();
      return false;
    }
    shrine.blanks[idx] = key;
    shrine.msg = '';
    shrine.sel = idx < 2 ? idx + 1 : idx;
    sfx.pick();
    if (shrine.blanks[0] === SHRINE_ANSWER[0] &&
        shrine.blanks[1] === SHRINE_ANSWER[1] &&
        shrine.blanks[2] === SHRINE_ANSWER[2]) {
      shrine.done = true;
      shrine.doneAt = clock;
      teachWord('qanat');
      sfx.deliver();
    }
    return true;
  }

  function shrineTap(p) {
    if (chromeTap(p)) return;
    var h = hitAt(p);
    if (!h) return;
    if (h.act === 'gap') { shrine.sel = h.arg; sfx.pick(); return; }
    if (h.act === 'word') { shrinePlace(shrine.sel, h.arg); return; }
    if (h.act === 'card') { backToTitle(); }
  }

  function updateShrine(dt) {
    if (shrine.msgAge < 4) shrine.msgAge += dt;
    if (shrine.done) shrine.glow = Math.min(1, shrine.glow + dt * 1.6);
  }

  function drawShrine(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);

    var bg = ctx.createLinearGradient(0, 0, 0, 844);
    bg.addColorStop(0, '#3E4A35');
    bg.addColorStop(1, '#28311F');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 390, 844);

    ctx.fillStyle = 'rgba(214,190,150,0.10)';
    ctx.beginPath();
    ctx.ellipse(195, 640, 240, 190, 0, 0, TAU);
    ctx.fill();

    placeHeader('The shrine');

    // The stele: a pale stone with the inscription cut into it.
    var sx = 20, sy = 66, sw = 350, sh = 262;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    roundRect(sx + 3, sy + 6, sw, sh, 14);
    ctx.fill();
    var stone = ctx.createLinearGradient(0, sy, 0, sy + sh);
    stone.addColorStop(0, '#E9E1CE');
    stone.addColorStop(1, '#D6CBB3');
    ctx.fillStyle = stone;
    roundRect(sx, sy, sw, sh, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,104,80,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (shrine.glow > 0) {
      ctx.save();
      ctx.globalAlpha = shrine.glow * 0.55;
      var gl = ctx.createRadialGradient(195, sy + sh / 2, 20, 195, sy + sh / 2, 230);
      gl.addColorStop(0, 'rgba(255,236,170,0.9)');
      gl.addColorStop(1, 'rgba(255,236,170,0)');
      ctx.fillStyle = gl;
      ctx.fillRect(sx - 40, sy - 40, sw + 80, sh + 80);
      ctx.restore();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(105,90,68,0.75)';
    ctx.font = '600 9px ' + FONT_UI;
    spacedText('INSCRIBED IN THE STONE', 195, sy + 30, 2.4);

    drawSentence([{ t: 'The ' }, { b: 0 }, { t: ' is watered' }], 195, sy + 96);
    drawSentence([{ t: 'by the ' }, { b: 1 }, { t: ' from' }], 195, sy + 152);
    drawSentence([{ t: 'the ' }, { b: 2 }, { t: '.' }], 195, sy + 208);

    // Three carved clues.
    for (var i = 0; i < 3; i++) {
      var cy = 346 + i * 66;
      var on = shrine.sel === i && !shrine.done;
      ctx.fillStyle = on ? '#E4DAC4' : '#D9D0BC';
      roundRect(20, cy, 350, 58, 10);
      ctx.fill();
      if (on) {
        ctx.strokeStyle = C.turquoise;
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(105,90,68,0.14)';
      ctx.beginPath();
      ctx.arc(44, cy + 29, 14, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#6B5B44';
      ctx.font = '600 12px ' + FONT_SERIF;
      ctx.textAlign = 'center';
      ctx.fillText(['I', 'II', 'III'][i], 44, cy + 30);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#3B3128';
      var font = '400 12.5px ' + FONT_UI;
      var lines = wrapText(SHRINE_CLUES[i], 272, font);
      ctx.font = font;
      for (var k = 0; k < lines.length; k++) {
        ctx.fillText(lines[k], 68, cy + 23 + k * 16);
      }
      addHit(20, cy, 350, 58, 'clue', i);
    }

    // The word bank.
    ctx.fillStyle = 'rgba(232,224,206,0.6)';
    ctx.font = '600 9px ' + FONT_UI;
    ctx.textAlign = 'center';
    spacedText('THE WORDS', 195, 586, 2.2);

    for (var w = 0; w < SHRINE_WORDS.length; w++) {
      var col = w % 3, row = Math.floor(w / 3);
      var wx = 20 + col * 118, wy = 604 + row * 58;
      var word = SHRINE_WORDS[w];
      var used = shrineUsed(word.key);
      ctx.fillStyle = used ? 'rgba(247,244,238,0.18)' : 'rgba(247,244,238,0.94)';
      roundRect(wx, wy, 108, 50, 9);
      ctx.fill();
      if (!used) {
        ctx.strokeStyle = 'rgba(216,204,184,0.9)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = C.ink;
        ctx.font = 'italic 600 19px ' + FONT_SERIF;
        ctx.textAlign = 'left';
        ctx.fillText(word.f, wx + 12, wy + 21);
        ctx.fillStyle = C.inkSoft;
        ctx.font = '400 10.5px ' + FONT_UI;
        ctx.fillText(word.e, wx + 12, wy + 39);
        ctx.textAlign = 'right';
        ctx.fillStyle = C.inkFaint;
        ctx.font = '400 12px ' + FONT_SERIF;
        ctx.fillText(word.p, wx + 96, wy + 36);
        addHit(wx, wy, 108, 50, 'word', word.key);
      }
    }

    // The stone's answer to a wrong word, or a quiet instruction.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (shrine.msgAge < 3.4 && shrine.msg) {
      ctx.fillStyle = C.terracotta;
      ctx.font = '500 11px ' + FONT_UI;
      var msgLines = wrapText(shrine.msg, 320, '500 11px ' + FONT_UI);
      ctx.font = '500 11px ' + FONT_UI;
      for (var m = 0; m < msgLines.length; m++) ctx.fillText(msgLines[m], 195, 740 + m * 14);
    } else if (!shrine.done) {
      ctx.fillStyle = 'rgba(232,224,206,0.55)';
      ctx.font = '400 11px ' + FONT_UI;
      ctx.fillText('tap a gap, then a word', 195, 750);
    }

    if (shrine.done && clock - shrine.doneAt > 3.3) {
      ctx.textAlign = 'left';
      drawPaperCard(390, 844, 'The stone is read', 'The garden is watered by the water from the channel.', [
        'bagh \u00b7 garden',
        'ab \u00b7 water',
        'qanat \u00b7 channel'
      ], 'Tap to go back', storyPage('shrine'));
      storyMark('shrine');
      hits = [];
      addHit(0, 0, 390, 844, 'card');
      pageEnd();
      return;
    }

    ctx.textAlign = 'left';
    pageEnd();
  }

  /* One line of the inscription, with a gap cut into it. */
  function drawSentence(parts, cx, y) {
    var font = '400 17px ' + FONT_UI;
    var gapW = 96;
    var widths = [], total = 0, i;
    ctx.font = font;
    for (i = 0; i < parts.length; i++) {
      widths[i] = parts[i].b !== undefined ? gapW : ctx.measureText(parts[i].t).width;
      total += widths[i];
    }
    var x = cx - total / 2;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (i = 0; i < parts.length; i++) {
      if (parts[i].b !== undefined) {
        drawGap(parts[i].b, x, y - 17, widths[i], 34);
      } else {
        ctx.fillStyle = '#3B3128';
        ctx.font = font;
        ctx.fillText(parts[i].t, x, y);
      }
      x += widths[i];
    }
  }

  function drawGap(idx, x, y, w, h) {
    var filled = shrine.blanks[idx];
    var on = shrine.sel === idx && !shrine.done;
    var shakeX = 0;
    if (clock - shrine.shakeAt < 0.3) shakeX = Math.sin((clock - shrine.shakeAt) * 60) * 3;

    ctx.save();
    ctx.translate(shakeX, 0);
    if (filled) {
      ctx.fillStyle = '#F7F4EE';
      roundRect(x, y, w, h, 8);
      ctx.fill();
      ctx.strokeStyle = on ? C.turquoise : 'rgba(120,104,80,0.4)';
      ctx.lineWidth = on ? 1.8 : 1;
      ctx.stroke();
      ctx.fillStyle = C.ink;
      ctx.font = 'italic 600 18px ' + FONT_SERIF;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(shrineWord(filled).f, x + w / 2, y + h / 2 + 1);
    } else {
      ctx.fillStyle = on ? 'rgba(47,167,155,0.14)' : 'rgba(120,104,80,0.10)';
      roundRect(x, y, w, h, 8);
      ctx.fill();
      ctx.strokeStyle = on ? C.turquoise : 'rgba(120,104,80,0.45)';
      ctx.lineWidth = on ? 1.8 : 1;
      ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
    addHit(x, y, w, h, 'gap', idx);
  }

  /* ---- The lake: read the rise, strike in the window -------------------- */
  var lake = {
    state: 'idle',      // idle | fly | wait | rise | hooked | landed | done
    fx: 96, fy: 470, tx: 96, ty: 470,
    flyT: 0,
    timer: 0,
    win: 0,
    reels: 0,
    weight: 0,
    caught: 0,
    best: 0,
    weights: [],
    rings: [],
    msg: '',
    msgAge: 9,
    landedAt: 0,
    doneAt: 0,
    line: 0
  };

  function enterLake() {
    lake.state = 'idle';
    var psc = pondShape(390, 844);
    lake.fx = psc.cx - 40; lake.fy = psc.cy - 20;
    lake.tx = lake.fx; lake.ty = lake.fy;
    lake.flyT = 0; lake.timer = 0; lake.win = 0; lake.reels = 0;
    lake.weight = 0; lake.caught = 0; lake.best = 0; lake.weights = [];
    lake.rings = []; lake.msg = ''; lake.msgAge = 9;
    lake.landedAt = 0; lake.doneAt = 0;
  }

  function lakeWeightFor(y) {
    var depth = clamp((600 - y) / 320, 0, 1);
    return 1 + Math.round(depth * 3);
  }

  function lakeCast(p) {
    lake.tx = clamp(p.x, 36, 354);
    lake.ty = clamp(p.y, 268, 596);
    lake.weight = lakeWeightFor(lake.ty);
    lake.state = 'fly';
    lake.flyT = 0;
    lake.msg = '';
    lake.msgAge = 9;
    sfx.pick();
  }

  function lakeStrike() {
    lake.state = 'hooked';
    lake.reels = 0;
    lake.msg = 'a fish is on';
    lake.msgAge = 0;
    sfx.pick();
  }

  function lakeReel() {
    lake.reels++;
    sfx.pick();
    if (lake.reels >= 3) {
      lake.caught++;
      lake.weights.push(lake.weight);
      if (lake.weight > lake.best) lake.best = lake.weight;
      lake.state = 'landed';
      lake.landedAt = clock;
      lake.msg = ['a small fish', 'a fair fish', 'a good fish', 'a big fish'][lake.weight - 1];
      lake.msgAge = 0;
      sfx.deliver();
    }
  }

  function lakeTap(p) {
    if (chromeTap(p)) return;
    if (lake.state === 'done') { backToTitle(); return; }
    if (lake.state === 'rise') { lakeStrike(); return; }
    if (lake.state === 'hooked') { lakeReel(); return; }
    if (lake.state === 'idle' && p.y > 250) { lakeCast(p); }
  }

  function updateLake(dt) {
    if (lake.msgAge < 4) lake.msgAge += dt;
    for (var i = lake.rings.length - 1; i >= 0; i--) {
      lake.rings[i].age += dt;
      if (lake.rings[i].age > 1.1) lake.rings.splice(i, 1);
    }

    if (lake.state === 'fly') {
      lake.flyT += dt * 3.2;
      var t = Math.min(1, lake.flyT);
      lake.fx = 96 + (lake.tx - 96) * t;
      lake.fy = 470 + (lake.ty - 470) * t - Math.sin(t * Math.PI) * 46;
      if (t >= 1) {
        lake.state = 'wait';
        lake.timer = rand(1.0, 2.0);
        lake.rings.push({ x: lake.fx, y: lake.fy, age: 0 });
      }
    } else if (lake.state === 'wait') {
      lake.timer -= dt;
      if (lake.timer <= 0) {
        lake.state = 'rise';
        lake.win = 0.62;
        lake.rings.push({ x: lake.fx, y: lake.fy, age: 0 });
      }
    } else if (lake.state === 'rise') {
      lake.win -= dt;
      if (lake.win <= 0) {
        lake.state = 'idle';
        lake.fx = 96; lake.fy = 470;
        lake.msg = 'It slipped away.';
        lake.msgAge = 0;
      }
    } else if (lake.state === 'landed') {
      if (clock - lake.landedAt > 1.0) {
        lake.fx = 96; lake.fy = 470;
        if (lake.caught >= 3) {
          lake.state = 'done';
          lake.doneAt = clock;
          teachWord('mahi');
          sfx.win();
        } else {
          lake.state = 'idle';
        }
      }
    }
    lake.line = lerp(lake.line, lake.state === 'hooked' ? 1 : 0, 1 - Math.exp(-dt * 8));
  }

  /* ---- The lake ----------------------------------------------------------- */
  /* Evening on the water. Four depths, each a band of its own colour, so the
     far water reads cold and deep and the shallows warm; the sun's path broken
     into dashes by the swell; reeds at both shores, a heron standing in the
     shallows, and the jetty with its boards. The float, the line, the rings and
     the fish under them are drawn where the state says they are. */
  var LAKE_SKY = ['#FBE6BC', '#F6D093', '#EFB877', '#E29F68'];
  var LAKE_DEPTH = ['#16323C', '#204C57', '#2E6B74', '#458A8C', '#68A8A2'];

  function lakeWave(y, t, k) {
    return Math.sin(y * 0.021 + t * 0.8 + k) * 4 + Math.sin(y * 0.07 - t * 1.3 + k) * 1.6;
  }

  function drawLakeSky() {
    var sky = ctx.createLinearGradient(0, 0, 0, 268);
    sky.addColorStop(0, LAKE_SKY[0]);
    sky.addColorStop(0.5, LAKE_SKY[1]);
    sky.addColorStop(0.82, LAKE_SKY[2]);
    sky.addColorStop(1, LAKE_SKY[3]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 390, 268);

    // Thin cloud bands, each a little warmer than the sky behind it.
    ctx.save();
    for (var c = 0; c < 3; c++) {
      var cy = 74 + c * 44;
      var drift = Math.sin(clock * 0.12 + c) * 14;
      ctx.fillStyle = 'rgba(255,244,222,' + (0.30 - c * 0.06).toFixed(2) + ')';
      ctx.beginPath();
      ctx.ellipse(120 + drift + c * 40, cy, 92 - c * 12, 9 - c * 2, 0, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(250 + drift * 0.6, cy + 16, 64, 6, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // The sun, low and wide, with its halo.
    var sun = ctx.createRadialGradient(288, 168, 4, 288, 168, 96);
    sun.addColorStop(0, 'rgba(255,248,214,0.95)');
    sun.addColorStop(0.3, 'rgba(255,226,150,0.45)');
    sun.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = sun;
    ctx.fillRect(150, 60, 240, 220);
    ctx.fillStyle = '#FFF6D8';
    ctx.beginPath();
    ctx.arc(288, 168, 17, 0, TAU);
    ctx.fill();
  }

  function drawLakeShore() {
    // Three ridges, each lighter behind, so the far shore has depth of its own.
    var ridges = [
      { y: 232, a: 0.28, h: 22, c: '#7C8770' },
      { y: 246, a: 0.42, h: 18, c: '#68745E' },
      { y: 258, a: 0.55, h: 13, c: '#55624E' }
    ];
    for (var r = 0; r < ridges.length; r++) {
      var g = ridges[r];
      ctx.fillStyle = g.c;
      ctx.globalAlpha = g.a + 0.35;
      ctx.beginPath();
      ctx.moveTo(-10, 280);
      var x = -10, up = 0;
      while (x < 400) {
        var w = 46 + ((x * 7 + r * 13) % 40);
        up = g.h * (0.5 + ((x * 3 + r * 11) % 17) / 22);
        ctx.quadraticCurveTo(x + w * 0.5, g.y - up, x + w, g.y - up * 0.2);
        x += w;
      }
      ctx.lineTo(400, 280);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // A line of far reeds on the water's edge.
    ctx.strokeStyle = 'rgba(70,84,58,0.5)';
    ctx.lineWidth = 1.6;
    for (var i = 0; i < 26; i++) {
      var rx = 6 + i * 15.4 + ((i * 13) % 7);
      var sway = Math.sin(clock * 0.9 + i) * 3;
      ctx.beginPath();
      ctx.moveTo(rx, 266);
      ctx.quadraticCurveTo(rx + sway * 0.5, 252, rx + sway, 240 - ((i * 7) % 8));
      ctx.stroke();
    }
  }

  function drawLakeWater() {
    var top = 264;
    var water = ctx.createLinearGradient(0, top, 0, 844);
    water.addColorStop(0, LAKE_DEPTH[0]);
    water.addColorStop(0.30, LAKE_DEPTH[1]);
    water.addColorStop(0.58, LAKE_DEPTH[2]);
    water.addColorStop(0.80, LAKE_DEPTH[3]);
    water.addColorStop(1, LAKE_DEPTH[4]);
    ctx.fillStyle = water;
    ctx.fillRect(0, top, 390, 844 - top);

    // The sun's path: broken dashes on the swell, widest near the horizon and
    // narrowing toward the jetty, which is how a low sun lies on still water.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var d = 0; d < 30; d++) {
      var yy = top + 8 + d * 18;
      var spread = 6 + d * 2.6;
      var wob = Math.sin(clock * 0.7 + d * 0.5) * (1.5 + d * 0.12);
      ctx.fillStyle = 'rgba(255,226,158,' + (0.30 - d * 0.008).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(288 + wob, yy, spread, 1.7, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // Long swells: two crossing sets, so the surface is a surface and not
    // wallpaper. Each line follows the depth, so it widens as it comes near.
    ctx.lineWidth = 1.1;
    for (var w = 0; w < 22; w++) {
      var wy = top + 10 + w * 27 + w * w * 0.28;
      var amp = 3 + w * 0.24;
      ctx.strokeStyle = 'rgba(206,240,236,' + (0.05 + w * 0.008).toFixed(3) + ')';
      ctx.beginPath();
      for (var x = -20; x <= 410; x += 26) {
        var y2 = wy + Math.sin(x * 0.017 + clock * 0.6 + w * 0.8) * amp + lakeWave(wy, clock, w) * 0.35;
        if (x === -20) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
      }
      ctx.stroke();
    }

    // A few glints, each blinking on its own beat.
    for (var g2 = 0; g2 < 34; g2++) {
      var gx = (g2 * 97) % 390;
      var gy = top + 30 + ((g2 * 61) % 540);
      var blink = Math.sin(clock * 1.7 + g2 * 2.1);
      if (blink < 0.55) continue;
      ctx.fillStyle = 'rgba(230,252,248,' + ((blink - 0.55) * 0.5).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(gx, gy, 3.2, 1.1, 0, 0, TAU);
      ctx.fill();
    }
  }

  function drawLakeReeds() {
    // A stand of reeds in each near corner, so the frame closes in on the water.
    var stands = [
      { x: 14, dir: 1, n: 9 },
      { x: 376, dir: -1, n: 8 }
    ];
    for (var s = 0; s < stands.length; s++) {
      var st = stands[s];
      for (var i = 0; i < st.n; i++) {
        var bx = st.x + st.dir * (i * 7 + (i % 3) * 3);
        var baseY = 700 + (i % 4) * 34;
        var h = 120 + ((i * 37) % 60);
        var sway = Math.sin(clock * 0.8 + i * 0.7) * 6;
        ctx.strokeStyle = i % 3 === 0 ? '#5E7A46' : '#6C8A4E';
        ctx.lineWidth = 2.2 - (i % 3) * 0.3;
        ctx.beginPath();
        ctx.moveTo(bx, baseY);
        ctx.quadraticCurveTo(bx + sway * 0.4, baseY - h * 0.6, bx + sway, baseY - h);
        ctx.stroke();
        // A seed head on every other reed.
        if (i % 2 === 0) {
          ctx.fillStyle = '#8A6A3E';
          ctx.beginPath();
          ctx.ellipse(bx + sway, baseY - h - 4, 2.6, 9, sway * 0.01, 0, TAU);
          ctx.fill();
        }
      }
    }
  }

  function drawLakeHeron() {
    // A heron stands in the shallows on the left, perfectly still, then strikes.
    var hx = 306, hy = 656;
    var strike = Math.max(0, Math.sin(clock * 0.55) - 0.9) * 6;
    var lean = strike * 6;
    ctx.save();
    ctx.translate(hx, hy);
    // Its shadow on the water, then the bird.
    ctx.fillStyle = 'rgba(10,34,40,0.20)';
    ctx.beginPath();
    ctx.ellipse(0, 2, 22, 6, 0, 0, TAU);
    ctx.fill();
    // The body, the neck, the head and the bill.
    ctx.fillStyle = '#C9CFD2';
    ctx.beginPath();
    ctx.ellipse(0, -18, 13, 9, -0.2, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#C9CFD2';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(6, -24);
    ctx.quadraticCurveTo(14 + lean, -46, 20 + lean, -60);
    ctx.stroke();
    ctx.fillStyle = '#C9CFD2';
    ctx.beginPath();
    ctx.ellipse(21 + lean, -64, 6.5, 5, 0.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#D9A24A';
    ctx.beginPath();
    ctx.moveTo(26 + lean, -65);
    ctx.lineTo(40 + lean, -60);
    ctx.lineTo(26 + lean, -60);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2E2A26';
    ctx.beginPath();
    ctx.arc(23 + lean, -66, 1.3, 0, TAU);
    ctx.fill();
    // Legs: thin, one lifted a little.
    ctx.strokeStyle = '#B0B8BB';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, -12); ctx.lineTo(-2, 0);
    ctx.moveTo(4, -12); ctx.lineTo(5, -2);
    ctx.stroke();
    ctx.restore();
  }

  function drawLakeJetty() {
    var topW = 138, botW = 194, topY = 690, botY = 844;
    // Its shadow on the water, wider than the wood.
    ctx.fillStyle = 'rgba(12,32,36,0.22)';
    ctx.beginPath();
    ctx.moveTo(195 - topW / 2 - 8, topY + 6);
    ctx.lineTo(195 + topW / 2 + 8, topY + 6);
    ctx.lineTo(195 + botW / 2 + 16, botY);
    ctx.lineTo(195 - botW / 2 - 16, botY);
    ctx.closePath();
    ctx.fill();

    // The boards, each its own tone, with a dark seam between.
    var planks = 9;
    for (var i = 0; i < planks; i++) {
      var t0 = i / planks, t1 = (i + 1) / planks;
      var y0 = topY + (botY - topY) * t0 * t0 * 0.55 + (botY - topY) * t0 * 0.45;
      var y1 = topY + (botY - topY) * t1 * t1 * 0.55 + (botY - topY) * t1 * 0.45;
      var w0 = topW + (botW - topW) * t0;
      var w1 = topW + (botW - topW) * t1;
      var shade = i % 2 ? '#7A5A3C' : '#856244';
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.moveTo(195 - w0 / 2, y0);
      ctx.lineTo(195 + w0 / 2, y0);
      ctx.lineTo(195 + w1 / 2, y1);
      ctx.lineTo(195 - w1 / 2, y1);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(48,32,20,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(195 - w1 / 2, y1);
      ctx.lineTo(195 + w1 / 2, y1);
      ctx.stroke();
    }

    // Two posts at the jetty's head, with their reflections.
    for (var p = -1; p <= 1; p += 2) {
      var px = 195 + p * (topW / 2 - 6);
      ctx.fillStyle = '#5E4227';
      ctx.fillRect(px - 3, topY - 22, 6, 26);
      ctx.fillStyle = 'rgba(12,32,36,0.18)';
      ctx.fillRect(px - 3, topY + 4, 6, 18);
    }
  }

  function drawLakeSplash(x, y, strength) {
    // A splash is a crown of drops and one bright ring, gone in a moment.
    var a = clamp(strength, 0, 1);
    for (var i = 0; i < 7; i++) {
      var ang = -Math.PI / 2 + (i - 3) * 0.32;
      var d = 6 + i * 2.6;
      ctx.fillStyle = 'rgba(232,250,246,' + (0.55 * a).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(ang) * d, y + Math.sin(ang) * d * 0.7, 1.8, 2.6, 0, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(224,248,244,' + (0.5 * a).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(x, y, 10 + (1 - a) * 18, (10 + (1 - a) * 18) * 0.34, 0, 0, TAU);
    ctx.stroke();
  }

  function drawLake(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);

    // ---- The pond, seen from above and close, in the colours it has on the
    // island. Not a horizon and a sunset: the same bank, the same water, the same
    // reeds. A place that changes its projection when you walk into it is two
    // places, and the pond is one.
    var W = 390, H = 844;
    var ps = pondShape(W, H);
    if (lakeFrom === 'sea') {
      // A lake is the same water as a pond, half again as wide and as deep.
      ps = { cx: W * 0.5, cy: H * 0.42, rx: W * 0.60, ry: H * 0.27 };
    }

    // The bank: mown grass, with a few tufts, all the way to the page's edges.
    var bank = ctx.createLinearGradient(0, 0, 0, H);
    bank.addColorStop(0, '#A9B986');
    bank.addColorStop(0.5, '#9CAE78');
    bank.addColorStop(1, '#93A66F');
    ctx.fillStyle = bank;
    ctx.fillRect(0, 0, W, H);
    var trnd = seeded(5150);
    ctx.strokeStyle = 'rgba(88,120,58,0.45)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    for (var tg = 0; tg < 40; tg++) {
      var tx = trnd() * W, ty = trnd() * H;
      // Keep the tufts out of the water.
      var ddx = (tx - ps.cx) / (ps.rx + 26), ddy = (ty - ps.cy) / (ps.ry + 26);
      if (ddx * ddx + ddy * ddy < 1) continue;
      for (var tt = -1; tt <= 1; tt++) {
        ctx.beginPath();
        ctx.moveTo(tx + tt * 4, ty);
        ctx.quadraticCurveTo(tx + tt * 6, ty - 9, tx + tt * 8, ty - 18);
        ctx.stroke();
      }
    }

    // The wet margin, then the water: the same ellipse the island draws.
    ctx.fillStyle = 'rgba(146,140,106,0.55)';
    ctx.beginPath();
    ctx.ellipse(ps.cx, ps.cy, ps.rx + 14, ps.ry + 10, 0, 0, TAU);
    ctx.fill();
    var water = ctx.createLinearGradient(ps.cx, ps.cy - ps.ry, ps.cx, ps.cy + ps.ry);
    water.addColorStop(0, '#8FB0B0');
    water.addColorStop(0.55, POND_WATER);
    water.addColorStop(1, '#6B9396');
    ctx.fillStyle = water;
    ctx.beginPath();
    ctx.ellipse(ps.cx, ps.cy, ps.rx, ps.ry, 0, 0, TAU);
    ctx.fill();

    // Everything on the water is clipped to it, so no ripple or fish ever lies on
    // the grass.
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(ps.cx, ps.cy, ps.rx, ps.ry, 0, 0, TAU);
    ctx.clip();

    // The ripples the island draws, larger because we are closer.
    ctx.strokeStyle = 'rgba(230,246,246,0.42)';
    ctx.lineWidth = 2;
    for (var rp = 0; rp < 7; rp++) {
      var drift = Math.sin(clock * 0.7 + rp) * 9;
      var ry0 = ps.cy - ps.ry * 0.74 + rp * ps.ry * 0.24;
      ctx.beginPath();
      ctx.moveTo(ps.cx - ps.rx * 0.88, ry0);
      ctx.quadraticCurveTo(ps.cx - ps.rx * 0.32 + drift, ry0 - 12, ps.cx, ry0);
      ctx.quadraticCurveTo(ps.cx + ps.rx * 0.38 + drift, ry0 + 12, ps.cx + ps.rx * 0.88, ry0 - 5);
      ctx.stroke();
    }
    // A few glints, each blinking on its own beat.
    for (var g2 = 0; g2 < 22; g2++) {
      var gx = ps.cx - ps.rx * 0.8 + ((g2 * 97) % 100) / 100 * ps.rx * 1.6;
      var gy = ps.cy - ps.ry * 0.75 + ((g2 * 61) % 100) / 100 * ps.ry * 1.5;
      var blink = Math.sin(clock * 1.7 + g2 * 2.1);
      if (blink < 0.55) continue;
      ctx.fillStyle = 'rgba(236,252,248,' + ((blink - 0.55) * 0.55).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(gx, gy, 4.5, 1.6, 0, 0, TAU);
      ctx.fill();
    }

    // Lily pads, the same ones the island has, and one open flower.
    var lrnd = seeded(3311);
    for (var lp = 0; lp < 7; lp++) {
      var lx = ps.cx + (lrnd() - 0.5) * ps.rx * 1.5;
      var ly = ps.cy + (lrnd() - 0.5) * ps.ry * 1.4;
      var lr = 12 + lrnd() * 9;
      ctx.fillStyle = lp % 3 === 0 ? 'rgba(140,176,110,0.90)' : 'rgba(118,156,94,0.90)';
      ctx.beginPath();
      ctx.ellipse(lx, ly, lr, lr * 0.64, lrnd() * 3, 0.5, TAU + 0.5);
      ctx.fill();
      ctx.strokeStyle = 'rgba(86,118,68,0.40)';
      ctx.lineWidth = 1;
      ctx.stroke();
      if (lp === 2) {
        ctx.fillStyle = '#F3E3EE';
        ctx.beginPath();
        ctx.ellipse(lx + 2, ly - 2, 5, 4, 0.3, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#E4C24E';
        ctx.beginPath();
        ctx.arc(lx + 2, ly - 2, 2, 0, TAU);
        ctx.fill();
      }
    }

    // ---- The float, the rings it makes, and the fish under it: all in the water.
    var dip = lake.state === 'rise' ? Math.sin(clock * 26) * 2.6 : lake.line * 6;
    var fx = lake.fx, fy = lake.fy + dip;

    for (var r = 0; r < lake.rings.length; r++) {
      var ring = lake.rings[r];
      var a = 1 - ring.age / 1.1;
      var rad = 10 + ring.age * 52;
      ctx.strokeStyle = 'rgba(226,246,242,' + (0.46 * a).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(ring.x, ring.y, rad, rad * 0.42, 0, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(226,246,242,' + (0.20 * a).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(ring.x, ring.y, rad * 1.5, rad * 0.62, 0, 0, TAU);
      ctx.stroke();
    }

    if (lake.state === 'hooked' || lake.state === 'landed') {
      var swim = Math.sin(clock * 6.2) * 14;
      ctx.strokeStyle = 'rgba(255,255,255,0.40)';
      ctx.lineWidth = 1;

      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(lake.fx + swim + 15, lake.fy + 34);

    ctx.strokeStyle = 'rgba(226,246,242,0.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(fx, fy + 2, 17 + Math.sin(clock * 3) * 1.6, 7, 0, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = '#F7F4EE';
    ctx.beginPath();
    ctx.ellipse(fx, fy, 6.4, 6.4, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#C8452F';
    ctx.beginPath();
    ctx.arc(fx, fy, 3.4, 0, TAU);

    if (lake.state === 'wait' && lake.timer < 0.55) {

      ctx.lineWidth = 1.4;

    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    for (var rd = 0; rd < 34; rd++) {
      var ang = (rd / 34) * TAU + 0.12;
      var ex = ps.cx + Math.cos(ang) * (ps.rx + 10);
      var ey = ps.cy + Math.sin(ang) * (ps.ry + 12);
      var hgt = 20 + ((rd * 13) % 14);
      var sway2 = Math.sin(clock * 0.9 + rd) * 4;
      for (var rt = -1; rt <= 1; rt++) {

        ctx.moveTo(ex + rt * 3, ey);

    // to sit that is IN this pond and not in front of a different one.
    // The head of the jetty, out in the water; its foot, on the bank below.
    var jettyTop = ps.cy + ps.ry * 0.30;
    var jettyFoot = ps.cy + ps.ry + 96;
    var jettyW = 92;
    ctx.fillStyle = 'rgba(12,32,36,0.20)';
    ctx.fillRect(195 - jettyW / 2 + 8, jettyTop - 6, jettyW, jettyFoot - jettyTop + 10);
    var planks = 8;
    for (var pl = 0; pl < planks; pl++) {
      var py0 = jettyTop + (jettyFoot - jettyTop) * (pl / planks);
      var py1 = jettyTop + (jettyFoot - jettyTop) * ((pl + 1) / planks);
      ctx.fillStyle = pl % 2 ? '#7A5A3C' : '#856244';
      ctx.fillRect(195 - jettyW / 2, py0, jettyW, py1 - py0 - 2);
      ctx.strokeStyle = 'rgba(48,32,20,0.30)';
      ctx.lineWidth = 1;

      ctx.moveTo(195 - jettyW / 2, py1 - 1);

      ctx.fillRect(195 + pp * (jettyW / 2 - 6) - 3, jettyTop - 10, 6, 14);

    // ---- She sits on the jetty's head with the rod in her hands, and the line
    // falls from the rod's tip to the float. Sitting, because a fisher sits.
    var seatY = jettyTop + 18;
    ctx.save();
    ctx.translate(178, seatY);
    ctx.fillStyle = 'rgba(20,30,34,0.22)';
    ctx.beginPath();
    ctx.ellipse(0, 6, 22, 6, 0, 0, TAU);
    ctx.fill();
    paintKeeper(ctx, 72, 'side', 'sit', false, OUTFITS[outfit] || OUTFITS[0], true);
    ctx.restore();

    var bend = lake.state === 'hooked' ? 12 : lake.state === 'rise' ? 4 : 0;
    var tipX = 96 - bend * 0.6, tipY = seatY - 74 - bend * 0.4;
    ctx.strokeStyle = '#5E4227';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    ctx.quadraticCurveTo((tipX + lake.fx) / 2, Math.max(tipY, lake.fy) + sag2, lake.fx, lake.fy);

    placeHeader(pondName());
    countChip(lake.caught + ' / 3', 270, 58, 108);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (lake.msgAge < 2.6 && lake.msg) {
      ctx.fillStyle = lake.state === 'hooked' || lake.state === 'landed' ? C.turquoiseDeep : C.terracotta;

      ctx.font = '600 12px ' + FONT_UI;

      for (var q = 0; q < lake.weights.length; q++) {

      }

      storyMark('lake');
      hits = [];

    pageEnd();

  var lakeFrom = 'pond';

  /* ---- The night sky: join the stars of the Plough  /* ---- The night sky: join the stars of the Plough ---------------------- */
  var SKY_FIGURE = {
    name: 'Dob-e Akbar',
    en: 'the Great Bear',
    p: '\u062F\u0628 \u0627\u06A9\u0628\u0631',
    word: 'setare',
    stars: [
      { ra: 12.2571, dec: 57.0326, n: 'Bikh-e Dom' },
      { ra: 11.0621, dec: 61.7510, n: 'Khers' },
      { ra: 11.0307, dec: 56.3824, n: 'Pahlu-ye Khers' },
      { ra: 11.8972, dec: 53.6948, n: 'Run-e Khers' },
      { ra: 12.9005, dec: 55.9598, n: 'Asb-e Siah' },
      { ra: 13.3988, dec: 54.9254, n: 'Long' },
      { ra: 13.7923, dec: 49.3133, n: 'Rahnama' }
    ],
    lines: [[0, 1], [1, 2], [2, 3], [3, 0], [0, 4], [4, 5], [5, 6]]
  };

  var sky = {
    stars: [],
    drawn: [],
    bg: [],
    drag: null,
    wrong: 0,
    falls: [],
    hintAt: -9,
    nameCard: null,
    done: false,
    doneAt: 0,
    glow: 0
  };

  /* Day: the sun's arc over the island seen from above, with the light it is
     casting named. Night hands over to the constellation page below. */
  /* Which face of the sky is showing. The hour decides which face a visit OPENS
     on; the stars link switches it, and it stays switched until she leaves. */
  var skyMode = null;
  function skyIsNight() {
    if (skyMode === 'night') return true;
    if (skyMode === 'day') return false;
    return dayLight().night;
  }

  function drawDaySky(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);
    var L = dayLight();
    // The sky as it is at this hour: warm at the ends, high and pale at noon.
    var g = ctx.createLinearGradient(0, 0, 0, 844);
    if (L.warm > 0.35) {
      g.addColorStop(0, '#F7C98C');
      g.addColorStop(0.45, '#F3D9A8');
      g.addColorStop(0.8, '#D8D9B8');
      g.addColorStop(1, '#A9B47C');
    } else {
      g.addColorStop(0, '#BFD6E4');
      g.addColorStop(0.45, '#D8E4E4');
      g.addColorStop(0.8, '#DCE4D2');
      g.addColorStop(1, '#A9B47C');
    }

    ctx.fillRect(0, 0, 390, 844);

    // Two thin cloud bands.
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.beginPath();
    ctx.ellipse(120, 232, 84, 16, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(280, 296, 64, 12, 0, 0, TAU);
    ctx.fill();

    // The sun on its arc across the sky, between the header and the horizon.
    // On its own page the sun is the subject: a wide arc, and a disc worth looking
    // at. It still keeps the hour, because its place IS the hour.
    drawSun(390, 844, 0.30, 0.68, 2.1);

    ctx.moveTo(0, 660);
    ctx.quadraticCurveTo(96, 634, 190, 656);
    ctx.quadraticCurveTo(292, 680, 390, 648);
    ctx.lineTo(390, 844);
    ctx.lineTo(0, 844);

    ctx.fill();
    ctx.fillStyle = 'rgba(110,127,86,0.55)';
    ctx.beginPath();
    ctx.ellipse(300, 700, 92, 24, 0, 0, TAU);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.font = 'italic 600 26px ' + FONT_SERIF;
    ctx.fillText(dayName(), 195, 540);
    ctx.fillStyle = C.inkSoft;
    ctx.font = '400 12px ' + FONT_UI;
    ctx.fillText(dayClock() + '  ·  the sun is ' + sunWords(L), 195, 568);
    ctx.fillStyle = C.inkFaint;
    ctx.font = 'italic 400 11px ' + FONT_SERIF;

  /* Where the sun stands, in words. */
  function sunWords(L) {
    if (!L || L.night) return 'down';
    if (L.u < 0.16) return 'just up';
    if (L.u < 0.42) return 'rising';
    if (L.u < 0.58) return 'high';
    if (L.u < 0.86) return 'sinking';
    return 'going down';
  }

  var daySkyAt = -9;
  function enterDaySky() {
    daySkyAt = clock;
    sky.doneAt = clock;
    skyMode = 'day';
  }
  function updateDaySky() { /* the hour changes by itself */ }
  function daySkyDown(p) {
    if (chromeTap(p)) return;
    var h = hitAt(p);
    if (h && h.act === 'skystars') {
      // On to the stars: the night page, without waiting for night.
      enterSkyNight();
    }
  }

  function enterSky() {
    // A fresh visit: the hour decides which face it opens on.
    skyMode = null;
    if (!skyIsNight()) { enterDaySky(); return; }
    enterSkyNight();
  }

  function enterSkyNight() {
    skyMode = 'night';
    sky.drawn = [];
    for (var i = 0; i < SKY_FIGURE.lines.length; i++) sky.drawn.push(false);
    sky.drag = null;
    sky.wrong = 0;
    sky.falls = [];
    sky.hintAt = -9;
    sky.nameCard = null;
    sky.done = false;
    sky.doneAt = 0;
    sky.glow = 0;
    buildSkyStars();
  }

  function buildSkyStars() {
    var i, s, pts = [];
    var cosDec = Math.cos(55 * Math.PI / 180);
    for (i = 0; i < SKY_FIGURE.stars.length; i++) {
      s = SKY_FIGURE.stars[i];
      pts.push({ x: s.ra * 15 * cosDec, y: -s.dec, n: s.n });
    }
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (i = 0; i < pts.length; i++) {
      if (pts[i].x < minX) minX = pts[i].x;
      if (pts[i].x > maxX) maxX = pts[i].x;
      if (pts[i].y < minY) minY = pts[i].y;
      if (pts[i].y > maxY) maxY = pts[i].y;
    }
    var boxW = 300, boxH = 300, bx = 45, by = 150;
    var k = Math.min(boxW / (maxX - minX), boxH / (maxY - minY));
    var w = (maxX - minX) * k, h = (maxY - minY) * k;
    var ox2 = bx + (boxW - w) / 2, oy2 = by + (boxH - h) / 2;
    sky.stars = [];
    for (i = 0; i < pts.length; i++) {
      sky.stars.push({
        x: ox2 + (pts[i].x - minX) * k,
        y: oy2 + (pts[i].y - minY) * k,
        n: pts[i].n
      });
    }

    // A sky behind it, seeded so it does not shimmer.
    var rnd = seeded(77123);
    sky.bg = [];
    for (i = 0; i < 150; i++) {
      sky.bg.push({ x: rnd() * 390, y: rnd() * 690, r: 0.5 + rnd() * 1.5, a: 0.12 + rnd() * 0.6 });
    }
  }

  function skyLineOf(a, b) {
    for (var i = 0; i < SKY_FIGURE.lines.length; i++) {
      var l = SKY_FIGURE.lines[i];
      if ((l[0] === a && l[1] === b) || (l[0] === b && l[1] === a)) return i;
    }
    return -1;
  }

  function skyStarAt(p) {
    var best = -1, bd = 24;
    for (var i = 0; i < sky.stars.length; i++) {
      var d = dist(p.x, p.y, sky.stars[i].x, sky.stars[i].y);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function skyDown(p) {
    if (chromeTap(p)) return;
    var i = skyStarAt(p);
    sky.nameCard = null;
    sky.drag = i >= 0 ? { from: i, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false } : null;
  }

  function skyMove(p) {
    if (!sky.drag) return;
    sky.drag.x = p.x;
    sky.drag.y = p.y;
    if (dist(p.x, p.y, sky.drag.sx, sky.drag.sy) > 9) sky.drag.moved = true;
  }

  function skyUp(p) {
    var d = sky.drag;
    sky.drag = null;
    if (!d) return;
    if (!d.moved) {
      sky.nameCard = { i: d.from, age: 0 };
      sfx.pick();
      return;
    }
    var to = skyStarAt(p);
    if (to < 0 || to === d.from) return;
    var li = skyLineOf(d.from, to);
    if (li >= 0 && !sky.drawn[li]) {
      sky.drawn[li] = true;
      sfx.pick();
      var all = true;
      for (var i = 0; i < sky.drawn.length; i++) if (!sky.drawn[i]) all = false;
      if (all) {
        sky.done = true;
        sky.doneAt = clock;
        teachWord('setare');
        sfx.win();
      }
    } else if (li < 0) {
      sky.wrong++;
      sky.hintAt = clock;
      sky.falls.push({
        ax: sky.stars[d.from].x, ay: sky.stars[d.from].y,
        bx: sky.stars[to].x, by: sky.stars[to].y, age: 0

    }

  function updateSky(dt) {
    for (var i = sky.falls.length - 1; i >= 0; i--) {

    if (sky.nameCard) {
      sky.nameCard.age += dt;
      if (sky.nameCard.age > 3) sky.nameCard = null;
    }
    if (sky.done) sky.glow = Math.min(1, sky.glow + dt * 1.4);
  }

  function drawSky(cssW, cssH) {

    ctx.beginPath();

    ctx.quadraticCurveTo(230, 726, 300, 690);
    ctx.quadraticCurveTo(350, 668, 390, 690);

    ctx.fillStyle = '#131D2E';

    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(270, 708);
    ctx.lineTo(298, 690);
    ctx.lineTo(326, 708);

    ctx.fill();
    ctx.fillStyle = 'rgba(255,214,120,0.9)';

    var drawnCount = 0;

      ctx.lineWidth = 1.2;

      g.addColorStop(0, 'rgba(255,246,214,0.55)');
      g.addColorStop(1, 'rgba(255,246,214,0)');
