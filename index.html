    else if (side === 2) { x = rand(60, world.w - 60); y = -R.enemySize; }
    else { x = rand(60, world.w - 60); y = world.h + R.enemySize; }
    enemies.push({ x: x, y: y, vx: 0, vy: 0, wob: rand(0, TAU), spin: rand(0, TAU), hurt: 0 });
  }

  function addParticles(x, y, color, n, speed) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU);
      var sp = rand(20, speed || 120);
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.4, 0.9), age: 0, color: color, r: rand(1.6, 4) });
    }
  }

  function addFloater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color || C.ink, age: 0, life: 1.1 });
  }

  function collectPickup(i) {
    var p = pickups[i];
    if (carry >= R.carryMax) {
      if (clock - lastFullNote > 1.6) {
        lastFullNote = clock;
        addFloater(hero.x, hero.y - 46, 'basket full', C.inkSoft);
      }
      return;
    }
    pickups.splice(i, 1);
    carry++;
    addParticles(p.x, p.y, '#F2CE73', 12, 90);
    addParticles(p.x, p.y, '#FFFFFF', 4, 40);
    addFloater(p.x, p.y - 26, '+1', C.turquoiseDeep);
    sfx.pick();
    spawnPickup();
  }

  function deliver() {
    if (carry <= 0) return;
    var n = carry;
    nectar += n;
    carry = 0;
    var w = words[wordIndex % words.length];
    wordIndex++;
    learned.push(w);
    wordCard = { word: w, age: 0, life: 2.8 };
    addParticles(hive.x, hive.y + 18, '#F2CE73', 18, 130);
    addFloater(hive.x, hive.y - hive.r * 0.55, '+' + n, C.honey);
    shake = 0.18;
    sfx.deliver();
    if (stage === 'gather' && nectar >= R.goal) endGame(true);
  }

  /* The day: gather, then water, then catch. Each task hands the next one on. */
  function showNotice(title, sub) {
    notice = { title: title, sub: sub, age: 0, life: 2.6 };
  }

  /* Finglish is written with its long vowels marked (áb, kháhar, rúz), but the
     code that calls teachWord has always spelled them plainly (ab, khahar). An
     exact match silently taught nothing, which is why greeting Donya gave no
     word. The lookup folds the marks away instead of asking every call site to
     remember them. */
  function plainFinglish(t) {
    var out = String(t).toLowerCase();
    // NFD splits "á" into "a" + U+0301, so both spellings normalise the same.
    if (out.normalize) out = out.normalize('NFD');
    return out.replace(/[\u0300-\u036f]/g, '');
  }

  function teachWord(f) {
    var w = null, i;
    for (i = 0; i < words.length; i++) if (words[i].f === f) w = words[i];
    if (!w) {
      var want = plainFinglish(f);
      for (i = 0; i < words.length; i++) {
        if (plainFinglish(words[i].f) === want) { w = words[i]; break; }
      }
    }
    // A person's word lives on their species row, not in the word table: read it
    // from there rather than keeping a second copy that can drift.
    if (!w) {
      var want2 = plainFinglish(f);
      for (var kk in SPECIES) {
        if (!SPECIES.hasOwnProperty(kk)) continue;
        var pool = SPECIES[kk];
        for (i = 0; i < pool.length; i++) {
          if (plainFinglish(pool[i].f) === want2) { w = { f: pool[i].f, e: pool[i].e, p: pool[i].p }; break; }
        }
        if (w) break;
      }
    }
    if (!w) return;
    for (i = 0; i < learned.length; i++) if (plainFinglish(learned[i].f) === plainFinglish(f)) return;
    learned.push(w);
    saveLearned();
    wordCard = { word: w, age: 0, life: 2.8 };
    checkErrand();
  }

  function beginWater() {
    stage = 'water';
    nectar += carry;
    carry = 0;
    pickups.length = 0;
    pour = null;
    spawnSprouts();
    showNotice('Midday: the sprouts are thirsty', 'hold on a sprout to pour');
    teachWord('ab');
  }

  function beginFireflies() {
    stage = 'fireflies';
    sprouts.length = 0;
    pour = null;
    enemies.length = 0;
    spawnFireflies();
    showNotice('Dusk: the fireflies are out', 'tap a light to keep it');
    teachWord('shab');
  }

  function spawnSprouts() {
    var spots = [
      { x: world.w * 0.22, y: world.h * 0.40 },
      { x: world.w * 0.78, y: world.h * 0.38 },
      { x: world.w * 0.26, y: world.h * 0.70 },
      { x: world.w * 0.74, y: world.h * 0.72 },
      { x: world.w * 0.50, y: world.h * 0.56 }
    ];
    sprouts = [];
    var n = Math.min(R.waterGoal, spots.length);
    for (var i = 0; i < n; i++) {
      sprouts.push({ x: spots[i].x, y: spots[i].y, water: 0, done: false, sway: rand(0, TAU) });
    }
  }

  function spawnFireflies() {
    fireflies = [];
    var cols = 3;
    var rows = Math.max(1, Math.ceil(R.catchGoal / cols));
    for (var i = 0; i < R.catchGoal; i++) {
      var col = i % cols, row = Math.floor(i / cols);
      var x = ((col + 0.5) / cols) * world.w + rand(-34, 34);
      var y = world.h * (0.30 + 0.60 * ((row + 0.5) / rows)) + rand(-26, 26);
      fireflies.push({
        x: clamp(x, 80, world.w - 80),
        y: clamp(y, 280, world.h - 120),
        ph: rand(0, TAU),
        sp: rand(0.5, 1.1),
        r: rand(10, 15)
      });
    }
  }

  function nearestSprout(maxD) {
    var best = null, bd = maxD || 150;
    for (var i = 0; i < sprouts.length; i++) {
      if (sprouts[i].done) continue;
      var d = dist(hero.x, hero.y, sprouts[i].x, sprouts[i].y);
      if (d < bd) { bd = d; best = sprouts[i]; }
    }
    return best;
  }

  function sproutAt(x, y, maxD) {
    var best = null, bd = maxD || 90;
    for (var i = 0; i < sprouts.length; i++) {
      if (sprouts[i].done) continue;
      var d = dist(x, y, sprouts[i].x, sprouts[i].y);
      if (d < bd) { bd = d; best = sprouts[i]; }
    }
    return best;
  }

  function bloom(s) {
    s.done = true;
    s.water = 1;
    watered++;
    addParticles(s.x, s.y - 20, C.rosa, 14, 100);
    addParticles(s.x, s.y - 20, '#FFF3D0', 6, 60);
    addFloater(s.x, s.y - 44, 'bloomed', C.turquoiseDeep);
    shake = 0.12;
    sfx.deliver();
    if (watered >= R.waterGoal) endGame(true);
  }

  function tryCatch(px, py) {
    var best = -1, bd = 58, i;
    for (i = 0; i < fireflies.length; i++) {
      var d = dist(px, py, fireflies[i].x, fireflies[i].y);
      if (d < bd) { bd = d; best = i; }
    }
    if (best < 0) {
      ripple = { x: px, y: py, age: 0 };
      return false;
    }
    var f = fireflies[best];
    fireflies.splice(best, 1);
    caught++;
    addParticles(f.x, f.y, '#FFE9A8', 12, 110);
    addParticles(f.x, f.y, '#FFFFFF', 4, 60);
    addFloater(f.x, f.y - 22, '+1', C.saffron);
    sfx.pick();
    if (caught >= R.catchGoal) endGame(true);
    return true;
  }

  function gustHit(e) {
    if (invuln > 0) return;
    bees--;
    invuln = 2.2;
    shake = 0.5;
    sfx.bee();
    addParticles(e.x, e.y, C.dust, 12, 150);
    addParticles(hero.x, hero.y, '#F2CE73', 8, 110);
    addFloater(hero.x, hero.y - 54, 'a bee flew home', C.terracotta);
    var dx = e.x - hero.x, dy = e.y - hero.y;
    var d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    e.x += (dx / d) * 170;
    e.y += (dy / d) * 170;
    e.vx = (dx / d) * 420;
    e.vy = (dy / d) * 420;
    e.hurt = 0.3;
    if (bees <= 0) endGame(false);
  }

  /* 8. UPDATE */
  function update(dt) {
    clock += dt;
    if (restartGuard > 0) restartGuard -= dt;
    updateParticles(dt);
    updateFloaters(dt);
    updateMotes(dt);
    for (var i = 0; i < pickups.length; i++) {
      pickups[i].age += dt;
      pickups[i].wob += dt;
    }
    if (wordCard) {
      wordCard.age += dt;
      if (wordCard.age >= wordCard.life) wordCard = null;
    }
    if (ripple) {
      ripple.age += dt;
      if (ripple.age > 0.55) ripple = null;
    }
    if (notice) {
      notice.age += dt;
      if (notice.age >= notice.life) notice = null;
    }

    if (scene !== 'island') { updatePlace(dt); return; }

    if (phase !== 'playing') return;

    if (stage !== 'island') {
      time -= dt;
      elapsed += dt;
      if (time <= 0) { time = 0; endGame(false); return; }
    }

    /* --- Movement: keys, or walk toward the tapped spot ------------- */
    var mx = 0, my = 0;
    if (keys['arrowleft'] || keys['a']) mx -= 1;
    if (keys['arrowright'] || keys['d']) mx += 1;
    if (keys['arrowup'] || keys['w']) my -= 1;
    if (keys['arrowdown'] || keys['s']) my += 1;

    if (mx === 0 && my === 0 && walkTarget) {
      var tx = walkTarget.x - hero.x, ty = walkTarget.y - hero.y;
      var td = Math.sqrt(tx * tx + ty * ty);
      if (td < 10) {
        walkTarget = null;
      } else {
        // A tapped spot is arrived at, not hit: the last stretch of the walk is
        // eased, so her momentum can settle her onto the spot instead of
        // carrying her past it and back.
        var close = clamp(td / 70, 0.18, 1);
        mx = (tx / td) * close;
        my = (ty / td) * close;
      }
    }
    var ml = Math.sqrt(mx * mx + my * my);
    if (ml > 1) { mx /= ml; my /= ml; }

    hero.moving = lerp(hero.moving, ml > 0.05 ? 1 : 0, 1 - Math.exp(-dt * 10));
    if (mx !== 0) hero.dir = mx > 0 ? 1 : -1;
    if (Math.abs(mx) + Math.abs(my) > 0.05) {
      // Eight facings: the three drawings, and a quarter-turn either side of
      // each of the two that has a front and a back.
      // Four facings: front, back, and the profile, mirrored for left and right.
      // Pressing two directions at once still walks her diagonally, but she turns
      // to whichever axis she leans into - there is no fifth drawing to turn to.
      var amx = Math.abs(mx), amy = Math.abs(my);
      if (amy >= amx) {
        hero.facing = my < 0 ? 'back' : 'front';
      } else {
        hero.facing = 'side';
      }
    }
    hero.tilt = lerp(hero.tilt, mx * 0.12, 1 - Math.exp(-dt * 8));
    hero.anim += dt * (1 + hero.moving * 2.4);
    // Her step keeps time with her own velocity, so she never paddles while
    // gliding to a stop and never skates while moving slowly.
    var speed = Math.sqrt(hero.vx * hero.vx + hero.vy * hero.vy);
    keeperPhase = (keeperPhase + speed * dt / 26) % 8;

    // She carries momentum: a command sets the speed she is heading for and her
    // own velocity catches up to it, so nothing snaps from standing to full
    // pace. Releasing the controls lets her coast to a stop in the same way.
    var wantX = mx * R.heroSpeed, wantY = my * R.heroSpeed;
    var grip = ml > 0.05 ? 17 : 12;
    var ease = 1 - Math.exp(-dt * grip);
    hero.vx += (wantX - hero.vx) * ease;
    hero.vy += (wantY - hero.vy) * ease;
    if (!ml && Math.abs(hero.vx) + Math.abs(hero.vy) < 12) { hero.vx = 0; hero.vy = 0; }
    hero.x += hero.vx * dt;
    hero.y += hero.vy * dt;

    if (walkTarget) {
      // Close the last few units so she settles exactly on the spot.
      var sdx = walkTarget.x - hero.x, sdy = walkTarget.y - hero.y;
      if (Math.abs(sdx) + Math.abs(sdy) < 6) {
        // The next leg of a routed walk, if there is one.
        if (seaRoute && seaRoute.length) {
          var leg = seaRoute.shift();
          walkTarget = { x: leg.x, y: leg.y };
        } else {
          walkTarget = null;
        }
      }
    }

    hero.x = clamp(hero.x,
      stage === 'island' ? 0 : 72,
      stage === 'island' ? world.w : world.w - 72);
    hero.y = clamp(hero.y,
      stage === 'island' ? (interior ? 150 : 56) : 200,
      stage === 'island' ? (interior ? world.h - 120 : world.h) : world.h - 64);
    // A river is a channel she cannot wade: she is pushed out of the water onto
    // the nearer bank, the way she is kept off the sea.
    if (stage === 'island' && !interior && sectionDef().kind === 'river') {
      if (inRiver(hero.x, hero.y, world.w, world.h)) {
        var rvv = clamp(hero.y / world.h, 0, 1);
        var rcc = riverCentre(rvv, sectionDef().name) * world.w;
        var rhh = riverHalfWidth(rvv, sectionDef().name) * world.w;
        hero.x = hero.x < rcc ? rcc - rhh - 6 : rcc + rhh + 6;
        hero.x = clamp(hero.x, 22, world.w - 22);
      }
    }
    // A pond is a body of water: she keeps to its bank, at the rim of the same
    // ellipse both views draw.
    if (stage === 'island' && !interior && sectionDef().kind === 'pond') {
      var psz = pondShape(world.w, world.h);
      var pdx = (hero.x - psz.cx) / psz.rx, pdy = (hero.y - psz.cy) / psz.ry;
      var pr = Math.sqrt(pdx * pdx + pdy * pdy);
      if (pr < 1 && pr > 0.0001) {
        // Pushed out to the rim, along the line from the centre through her.
        hero.x = psz.cx + (pdx / pr) * psz.rx;
        hero.y = psz.cy + (pdy / pr) * psz.ry;
        hero.vx = 0; hero.vy = 0;
      }
    }
    // On a shore she keeps to the dry sand: the surf is the sea's edge, not
    // ground for standing on.
    if (stage === 'island' && !interior && sectionDef().kind === 'beach') {
      if (isSurf(hero.x, hero.y, world.w, world.h)) {
        var sdx = shoreSide();
        var sband = tideLine(world.w, world.h);
        if (sdx.dx > 0) hero.x = world.w - sband - 4;
        else if (sdx.dx < 0) hero.x = sband + 4;
        else if (sdx.dy > 0) hero.y = world.h - sband - 4;
        else hero.y = sband + 4;
        hero.vx = 0; hero.vy = 0;
      }
    }
    // A stream is running water: she keeps to one bank or the other.
    if (stage === 'island' && !interior && sectionDef().kind === 'stream') {
      if (inStream(hero.x, hero.y, world.w, world.h)) {
        var sv2 = clamp(hero.y / world.h, 0, 1);
        var sc2 = streamCentre(sv2) * world.w, sh2 = streamHalf(sv2) * world.w;
        hero.x = hero.x < sc2 ? sc2 - sh2 - 5 : sc2 + sh2 + 5;
        hero.x = clamp(hero.x, 20, world.w - 20);
        hero.vx = 0;
      }
    }
    // She keeps to the shingle in a sea section: open water is not ground. In a
    // boat, water IS the ground.
    if (stage === 'island' && !interior && sectionDef().kind === 'sea' && !boatRide.riding) {
      if (!onSeaShore(hero.x, hero.y)) {
        var shore = keepOnSeaShore({ x: hero.x, y: hero.y });
        hero.x = shore.x; hero.y = shore.y;
      }
    }
    // The boat's own motion: it rolls, the oars go through their stroke with her
    // pace, and its wake is laid behind it.
    if (stage === 'island' && !interior && boatRide.riding) {
      var bSpeed = Math.sqrt(hero.vx * hero.vx + hero.vy * hero.vy);
      boatRide.bob = Math.sin(clock * 1.15) * 1.4 + Math.sin(clock * 2.3) * 0.5;
      boatRide.oar = (boatRide.oar + dt * (0.7 + bSpeed / 260)) % 1;
      if (bSpeed > 26) {
        boatRide.still = 0;
        // A wake bead every so often, at the stern.
        boatRide.wakeTimer = (boatRide.wakeTimer || 0) + dt;
        if (boatRide.wakeTimer > 0.20) {
          boatRide.wakeTimer = 0;
          boatRide.wake.push({ x: hero.x, y: hero.y + 34, age: 0 });
          if (boatRide.wake.length > 16) boatRide.wake.shift();
        }
      } else {
        boatRide.still += dt;
      }
      for (var wk = 0; wk < boatRide.wake.length; wk++) boatRide.wake[wk].age += dt;
      boatRide.wake = boatRide.wake.filter(function (w) { return w.age < 2.2; });
    }

    if (stage === 'island' && !interior && sectionDef().kind === 'openwater' && !boatRide.riding) {
      // There is no land here: she can only be here in the boat.
      boatRide.riding = true;
      boatRide.oar = 0;
      boatRide.wake.length = 0;
    }

    if (stage === 'island') {
      // The day goes on while she walks it: eight real minutes to a whole day.
      day.t = (day.t + dt * day.rate) % 1;
      stepInto(dt, speed);
      updateIslandVerb(); updateFauna(dt); sectionCross();
      if (sectionDef() && sectionDef().kind === 'garden') gardenTick(dt);
    }

    if (stepRing.age < 3) stepRing.age += dt;
    if (stepRing.age < 1.2 && stepRing.w > 0 && Math.random() < 0.10) {
      addParticles(stepRing.x + (Math.random() - 0.5) * 14, stepRing.y,
        'rgba(240,252,250,0.95)', 1, 26);
    }
    if (invuln > 0) invuln -= dt;
    if (shake > 0) shake -= dt;

    // A bee that went home comes back to the hive after a while.
    if (shake > 0) shake -= dt;

    // A bee that went home comes back to the hive after a while.
    if (bees < R.hearts) {
      beeReturn -= dt;
      if (beeReturn <= 0) {
        bees++;
        beeReturn = 24;
        addFloater(hive.x, hive.y - hive.r * 0.5, 'a bee is back', C.turquoiseDeep);
        addParticles(hive.x, hive.y + 10, '#F2CE73', 8, 90);
        sfx.pick();
      }
    } else {
      beeReturn = 24;
    }

    /* --- Pickups: gathered by walking over them --------------------- */
    var collectR = R.pickupSize * 0.55 + R.heroSize * 0.4;
    for (i = pickups.length - 1; i >= 0; i--) {
      var p = pickups[i];
      if (dist(p.x, p.y, hero.x, hero.y) < collectR) collectPickup(i);
    }

    /* --- The hive: carrying nectar home is the whole game ---------- */
    if (stage === 'gather' && carry > 0 && dist(hive.x, hive.y, hero.x, hero.y) < hive.r) deliver();

    /* --- Midday: pour water on each sprout until it blooms --------- */
    if (stage === 'water') {
      var holding = pourHeld || keys[' '] || keys['space'];
      if (holding) {
        if (!pour || pour.done) pour = nearestSprout(160);
        if (pour && !pour.done && dist(hero.x, hero.y, pour.x, pour.y) < 175) {
          pour.water = Math.min(1, pour.water + dt * 0.62);
          if (clock - lastWaterNote > 0.07) {
            lastWaterNote = clock;
            particles.push({ x: pour.x + rand(-9, 9), y: pour.y - 54, vx: rand(-10, 10), vy: 150, life: 0.34, age: 0, color: '#BFDADC', r: rand(1.4, 2.6) });
          }
          if (pour.water >= 1) { var doneSprout = pour; pour = null; bloom(doneSprout); }
        }
      } else {
        pour = null;
      }
    }

    /* --- Dusk: the fireflies wander, and a tap keeps one ---------- */
    if (stage === 'fireflies') {
      for (i = 0; i < fireflies.length; i++) {
        var ff = fireflies[i];
        ff.x += Math.sin(clock * ff.sp + ff.ph) * 22 * dt;
        ff.y += Math.cos(clock * ff.sp * 1.3 + ff.ph) * 16 * dt;
        ff.x = clamp(ff.x, 70, world.w - 70);
        ff.y = clamp(ff.y, 250, world.h - 90);
      }
    }

    duskK = lerp(duskK, stage === 'island' ? 0.05 : (stage === 'gather' ? 0.12 : (stage === 'water' ? 0.45 : 0.85)), 1 - Math.exp(-dt * 0.8));

    /* --- Dust devils ------------------------------------------------- */
    if (stage !== 'fireflies' && stage !== 'island') {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = R.enemySpawnEvery; }
    }

    var eSpeed = R.enemySpeed + R.enemySpeedGrowth * elapsed;
    var sepR = R.enemySize * 1.6;
    var k = 1 - Math.exp(-dt * 2.2);

    for (i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      e.wob += dt;
      e.spin += dt * 2.4;
      if (e.hurt > 0) e.hurt -= dt;

      var dx = hero.x - e.x, dy = hero.y - e.y;
      var d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      var dvx = (dx / d) * eSpeed;
      var dvy = (dy / d) * eSpeed;

      var sx = 0, sy = 0;
      for (var j = 0; j < enemies.length; j++) {
        if (j === i) continue;
        var o = enemies[j];
        var odx = e.x - o.x, ody = e.y - o.y;
        var od = Math.max(1, Math.sqrt(odx * odx + ody * ody));
        if (od < sepR) {
          var push = (sepR - od) * 60;
          sx += (odx / od) * push;
          sy += (ody / od) * push;
        }
      }

      if (e.hurt > 0) {
        e.vx *= Math.exp(-dt * 6);
        e.vy *= Math.exp(-dt * 6);
      } else {
        e.vx += ((dvx + sx) - e.vx) * k;
        e.vy += ((dvy + sy) - e.vy) * k;
      }

      e.x += e.vx * dt;
      e.y += e.vy * dt;
      e.x = clamp(e.x, -R.enemySize, world.w + R.enemySize);
      e.y = clamp(e.y, -R.enemySize, world.h + R.enemySize);

      var hitR = (R.enemySize + R.heroSize) * 0.42;
      if (dist(e.x, e.y, hero.x, hero.y) < hitR && invuln <= 0) gustHit(e);
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.exp(-dt * 3);
      p.vy *= Math.exp(-dt * 3);
    }
  }

  function updateFloaters(dt) {
    for (var i = floaters.length - 1; i >= 0; i--) {
      var f = floaters[i];
      f.age += dt;
      f.y -= 38 * dt;
      if (f.age >= f.life) floaters.splice(i, 1);
    }
  }

  function updateMotes(dt) {
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.y -= m.sp * dt;
      m.x += Math.sin(clock * 0.7 + m.ph) * 4 * dt;
      if (m.y < -6) { m.y = world.h + 6; m.x = rand(0, world.w); }
    }
  }

  /* 9. RENDER */
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    if (scene !== 'island') {
      var pcW = canvas.width / dpr, pcH = canvas.height / dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#141B2C';
      ctx.fillRect(0, 0, pcW, pcH);
      var place = placeDef(scene);
      if (place) place.draw(pcW, pcH);
      // The look page has the word on it already; anything else needs the card.
      if (scene !== 'look') drawWordCard();
      // The sheet covers a place as well as the island: the menu is the game's
      // one way in, so it cannot be reachable from only one screen.
      if (menu.open) drawMenu(pcW, pcH);
      return;
    }

    if (scene === 'island' && stage === 'island') { renderIsland(); return; }

    ctx.fillStyle = '#77875C';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var shX = shake > 0 ? rand(-1, 1) * shake * 10 * dpr : 0;
    var shY = shake > 0 ? rand(-1, 1) * shake * 10 * dpr : 0;
    ctx.setTransform(dpr * fitScale, 0, 0, dpr * fitScale, dpr * ox + shX, dpr * oy + shY);

    drawGround();
    drawScenery();
    drawSprouts();
    drawHive();
    drawPickups();
    drawHero();
    drawEnemies();
    drawFireflies();
    drawMotes();
    drawParticles();
    drawFloaters();
    drawRipple();
    drawDuskVeil();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (phase === 'playing' || paused || phase === 'won' || phase === 'lost') drawHUD();
    if (stage === 'island' && phase === 'playing' && !paused) drawIslandVerb();
    drawNotice();
    drawWordCard();
    drawOverlay();
  }

  function drawGround() {
    if (bgPattern && customArt('background')) {
      ctx.fillStyle = bgPattern;
      ctx.fillRect(0, 0, world.w, world.h);
    } else if (images.background && customArt('background')) {
      var img = images.background;
      var iw = img.naturalWidth || 512, ih = img.naturalHeight || 512;
      var sc = Math.max(world.w / iw, world.h / ih);
      ctx.drawImage(img, (world.w - iw * sc) / 2, (world.h - ih * sc) / 2, iw * sc, ih * sc);
    } else {
      var g = ctx.createLinearGradient(0, 0, 0, world.h);
      g.addColorStop(0, '#A9B986');
      g.addColorStop(0.45, C.ground);
      g.addColorStop(1, '#94A66F');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, world.w, world.h);

      // Broad, soft patches so the meadow is not one flat green.
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#B7C593';
      ctx.beginPath();
      ctx.ellipse(world.w * 0.26, world.h * 0.36, world.w * 0.34, world.h * 0.13, -0.2, 0, TAU);
      ctx.ellipse(world.w * 0.78, world.h * 0.62, world.w * 0.28, world.h * 0.11, 0.3, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#81935F';
      ctx.beginPath();
      ctx.ellipse(world.w * 0.58, world.h * 0.9, world.w * 0.4, world.h * 0.12, 0.1, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // The path from the gate up to the hive: drawn, not obeyed.
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(216,196,163,0.85)';
    ctx.lineWidth = 58;
    ctx.beginPath();
    ctx.moveTo(world.w * 0.5, world.h + 20);
    ctx.bezierCurveTo(world.w * 0.42, world.h * 0.78, world.w * 0.62, world.h * 0.42, hive.x, hive.y + 60);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(233,222,203,0.7)';
    ctx.lineWidth = 40;
    ctx.beginPath();
    ctx.moveTo(world.w * 0.5, world.h + 20);
    ctx.bezierCurveTo(world.w * 0.42, world.h * 0.78, world.w * 0.62, world.h * 0.42, hive.x, hive.y + 60);
    ctx.stroke();
    ctx.restore();

    // Hedgerow at both edges: the garden's walls.
    if (!customArt('background')) drawHedge();
  }

  function drawHedge() {
    ctx.save();
    for (var side = 0; side < 2; side++) {
      var x = side === 0 ? -14 : world.w + 14;
      var dir = side === 0 ? 1 : -1;
      ctx.fillStyle = C.hedge;
      for (var y = -30; y < world.h + 40; y += 64) {
        ctx.beginPath();
        ctx.arc(x, y + Math.sin(y * 0.05) * 6, 46, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = C.hedgeLight;
      for (var y2 = -10; y2 < world.h + 40; y2 += 64) {
        ctx.beginPath();
        ctx.arc(x + dir * 10, y2, 24, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ---- The edges of a section -------------------------------------------- */
  /* Every room has four edges and each one says what it is. An edge that leads
     somewhere is a gap with the next place's name on it - north, south, east and
     west all alike, because a door you cannot see is not a door. An edge that
     leads nowhere is a barrier you can read: a cliff, a dune wall, a hedge or
     the water's own horizon. */
  function neighbourOf(dx, dy) {
    return SECTIONS[sectionId(section.cx + dx, section.cy + dy)] || null;
  }

  /* ---- The keeper's errands ---------------------------------------------- */
  /* The island is not a set of rooms to look at: it is a round of small work.
     One errand at a time, in the keeper's own voice, and each one sends her
     somewhere with something to do when she arrives. The errand names a place,
     a person or a thing, so the walking always has a reason, and finishing one
     hands over the next. Progress is the world itself - words learned, places
     reached, things done - never a counter of its own. */
  var ERRAND_KEY = 'darya.errand';
  var errandAt = 0;
  try { errandAt = parseInt(window.localStorage.getItem(ERRAND_KEY) || '0', 10) || 0; } catch (e) { errandAt = 0; }

  var visited = {};
  try {
    var seen = (window.localStorage.getItem('darya.visited') || '').split(',');
    for (var vi = 0; vi < seen.length; vi++) if (seen[vi]) visited[seen[vi]] = 1;
  } catch (e) { visited = {}; }

  function visitSection(cx, cy) {
    var id = sectionId(cx, cy);
    if (!visited[id]) {
      visited[id] = 1;
      var ids = [];
      for (var k in visited) ids.push(k);
      try { window.localStorage.setItem('darya.visited', ids.join(',')); } catch (e) { /* private */ }
    }
    checkErrand();
  }

  function beenTo(name) {
    for (var key in SECTIONS) {
      if (!SECTIONS.hasOwnProperty(key)) continue;
      if (SECTIONS[key].name !== name) continue;
      if (visited[key]) return true;
    }
    return false;
  }

  function placeDone(id) { return !!storyDone[id]; }

  /* Who the keeper has spoken to, so an errand can be "go and meet the
     shepherd" and read the world for the answer. */
  var metBeing = {};

  /* The errands, in order. Each is a sentence in the keeper's own voice that
     names a PERSON, a PLACE and a THING TO DO in one line, a count for the strip,
     and a test that reads the world rather than a flag. The people of the island
     are the ones asking, so the walking always has someone behind it. */
  var ERRANDS = [
    {
      line: 'read three of the carved stones',
      where: 'go to any carved stone and read it',
      count: function () { return [Math.min(3, learned.length), 3]; },
      done: function () { return learned.length >= 3; }
    },
    {
      line: 'greet Donya at the well',
      where: 'she waits in the yard, by the well',
      count: function () { return [donyaMet ? 1 : 0, 1]; },
      done: function () { return !!donyaMet; }
    },
    {
      line: 'walk out to the apiary and open a hive',
      where: 'go north out of the yard, past the wood edge',
      count: function () { return [placeDone('comb') || placeDone('queen') ? 1 : 0, 1]; },
      done: function () {
        return beenTo('the apiary') && (placeDone('comb') || placeDone('queen'));
      }
    },
    {
      line: 'find the greenhouse and cross two seeds',
      where: 'go west along the lane, to the greenhouse',
      count: function () { return [placeDone('glasshouse') ? 1 : 0, 1]; },
      done: function () { return placeDone('glasshouse'); }
    },
    {
      line: 'carry the can to the stream and fill it',
      where: 'go south-west, to where the ground turns wet',
      count: function () { return [placeDone('stream') ? 1 : 0, 1]; },
      done: function () { return placeDone('stream'); }
    },
    {
      line: 'walk the four ways out of the yard',
      where: 'step out of the yard by each of its four edges',
      count: function () {
        return [(visited['0,1'] ? 1 : 0) + (visited['-1,0'] ? 1 : 0) +
          (visited['1,0'] ? 1 : 0) + (visited['0,-1'] ? 1 : 0), 4];
      },
      done: function () {
        return !!(visited['0,1'] && visited['-1,0'] && visited['1,0'] && visited['0,-1']);
      }
    },
    {
      line: 'climb to the high pastures',
      where: 'go north from the apiary, and north again',
      count: function () { return [beenTo('the high pastures') ? 1 : 0, 1]; },
      done: function () { return beenTo('the high pastures'); }
    },
    {
      line: 'reach the shore and the sea',
      where: 'go south past the pond, to the shore and the sea',
      count: function () {
        return [(beenTo('the shore') ? 1 : 0) + (beenTo('the sea') ? 1 : 0), 2];
      },
      done: function () { return beenTo('the shore') && beenTo('the sea'); }
    },
    /* ---- the people ---- */
    {
      line: 'hear the storyteller out in the yard',
      where: 'he sits in the yard, by the well',
      count: function () { return [metBeing['being-storyteller'] ? 1 : 0, 1]; },
      done: function () { return !!metBeing['being-storyteller']; }
    },
    {
      line: 'sit with the weaver in the garden',
      where: 'go east from the yard, into the garden',
      count: function () { return [metBeing['being-weaver'] ? 1 : 0, 1]; },
      done: function () { return !!metBeing['being-weaver']; }
    },
    {
      line: 'ask the fisher at the pond about the water',
      where: 'go south from the yard, down to the pond',
      count: function () { return [metBeing['being-fisher'] ? 1 : 0, 1]; },
      done: function () { return !!metBeing['being-fisher']; }
    },
    {
      line: 'walk the steppe with the shepherd',
      where: 'go north past the apiary, to the dry grass',
      count: function () { return [metBeing['being-shepherd'] ? 1 : 0, 1]; },
      done: function () { return !!metBeing['being-shepherd']; }
    },
    {
      line: 'ask the nomad where the water is',
      where: 'go north-east, to where the sand begins',
      count: function () { return [metBeing['being-nomad'] ? 1 : 0, 1]; },
      done: function () { return !!metBeing['being-nomad']; }
    },
    {
      line: 'hear the caravaneer out',
      where: 'keep going into the dunes',
      count: function () { return [metBeing['being-caravaneer'] ? 1 : 0, 1]; },
      done: function () { return !!metBeing['being-caravaneer']; }
    },
    {
      line: 'read the stone at the shrine',
      where: 'find it among the old stones',
      count: function () { return [placeDone('shrine') ? 1 : 0, 1]; },
      done: function () { return placeDone('shrine'); }
    },
    {
      line: 'fish the lake three times over',
      where: 'row out from the sea, to the lake',
      count: function () { return [placeDone('lake') ? 1 : 0, 1]; },
      done: function () { return placeDone('lake'); }
    },
    {
      line: 'name the seven stars',
      where: 'look up at night, from anywhere on the island',
      count: function () { return [placeDone('sky') ? 1 : 0, 1]; },
      done: function () { return placeDone('sky'); }
    },
    {
      line: 'walk the rim of the island',
      where: 'the cliff and the hedge mark the island’s end',
      count: function () {
        var n = 0;
        for (var k in SECTIONS) if (SECTIONS.hasOwnProperty(k) && visited[k]) n++;
        return [n, Object.keys(SECTIONS).length];
      },
      done: function () {
        var n = 0;
        for (var k in SECTIONS) if (SECTIONS.hasOwnProperty(k) && visited[k]) n++;
        return n >= Object.keys(SECTIONS).length;
      }
    }
  ];

  /* The people of the island, and the one thing each of them wants. */
  var PEOPLE = {
    'being-fisher': {
      where: 'the pond', ask: 'bring the fisher word of the water',
      said: '"The pond keeps its own counsel. Ask it at dusk."'
    },
    'being-weaver': {
      where: 'the garden', ask: 'sit with the weaver while she works',
      said: '"Every row is a decision. You cannot take one back."'
    },
    'being-shepherd': {
      where: 'the steppe', ask: 'walk the steppe with the shepherd',
      said: '"Up here the flock knows the ground better than I do."'
    },
    'being-nomad': {
      where: 'the desert', ask: 'ask the nomad where the water is',
      said: '"The sand remembers every path. I only follow the cool ones."'
    },
    'being-caravaneer': {
      where: 'the desert', ask: 'hear the caravaneer out',
      said: '"Forty days to the sea, and every one of them a story."'
    },
    'being-storyteller': {
      where: 'the yard', ask: 'hear the storyteller to the end',
      said: '"Sit. The island has been waiting to tell you something."'
    }
  };

  function beingLineFor(id) {
    var p = PEOPLE[id];
    return p ? p.said : '"Well met."';
  }

  function errand() { return ERRANDS[Math.min(errandAt, ERRANDS.length - 1)]; }

  function errandDone() { return errandAt >= ERRANDS.length; }

  /* Called whenever the world may have changed: a word learned, a place
     finished, a section entered. One errand completes at a time, so the strip
     never jumps two steps and the reward always lands where she is standing. */
  function checkErrand() {
    if (errandDone()) return;
    var e = errand();
    if (!e.done()) return;
    errandAt++;
    try { window.localStorage.setItem(ERRAND_KEY, String(errandAt)); } catch (err) { /* private */ }
    if (errandDone()) {
      showNotice('The notebook is full', 'every errand the island had');
    } else {
      showNotice('Errand done: ' + e.line, 'next \u00b7 ' + errand().line);
    }
    teachWord('k\u00e1r');
    sfx.pick();
  }

  /* The strip at the top of the island: what she is about, and how far along. */
  function drawErrand() {
    if (stage !== 'island' || interior) return;
    var cssW = canvas.width / dpr, cssH = canvas.height / dpr;
    // The hour, at the top right, in the same ink as the errand.
    drawHourChip(cssW, cssH);
    var s = clamp(Math.min(cssW, cssH) / 520, 0.8, 1.3);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    var line, right, detail;
    if (errandDone()) {
      line = 'the notebook is full';
      right = '';
      detail = 'every errand the island had';
    } else {
      var e = errand();
      var c = e.count();
      line = e.line;
      right = c[1] > 1 ? c[0] + ' / ' + c[1] : (c[0] ? '\u2713' : '');
      detail = e.where || '';
    }

    // The card is measured around its WIDEST row, so the two lines line up and
    // the detail never pokes out of the paper.
    var titleFont = 'italic 500 ' + Math.round(12.5 * s) + 'px ' + FONT_SERIF;
    var detailFont = 'italic 400 ' + Math.round(11 * s) + 'px ' + FONT_SERIF;
    ctx.font = titleFont;
    var tw = ctx.measureText(line).width;
    ctx.font = detailFont;
    var dw = detail ? ctx.measureText(detail).width : 0;

    var w = Math.min(cssW - 28 * s, Math.max(tw + (right ? 62 : 34) * s, dw + 30 * s));
    var h = (detail ? 46 : 30) * s;
    var x = cssW / 2 - w / 2, y = 12 * s;
    // The island's menu: a card at the top-left of the page, above the errand
    // strip's shoulder. It is the way to the errands, the word book, the notebook,
    // the bag, the map, the sky and the language - everything the island holds.
    var mw = 74 * s, mh = 26 * s, mx = 8 * s, my = 12 * s + h + 6 * s;
    ctx.fillStyle = 'rgba(247,244,238,0.92)';
    roundRect(mx, my, mw, mh, 8 * s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(216,204,184,0.95)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.save();
    ctx.strokeStyle = C.inkSoft;
    ctx.lineWidth = 1.5 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var mr = 0; mr < 3; mr++) {
      var mry = my + mh * (0.30 + mr * 0.20);
      ctx.moveTo(mx + 8 * s, mry);
      ctx.lineTo(mx + 17 * s, mry);
    }
    ctx.stroke();
    ctx.fillStyle = C.inkSoft;
    ctx.font = '600 ' + Math.round(10 * s) + 'px ' + FONT_UI;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('menu', mx + 21 * s, my + mh / 2);
    ctx.restore();
    addHit(mx, my, mw, mh, 'back');
    ctx.fillStyle = 'rgba(247,244,238,0.90)';
    roundRect(x, y, w, h, h / 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(216,204,184,0.9)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // The objective on the first row, with the count at its right.
    var rowOne = y + (detail ? 15 : 15) * s;
    ctx.fillStyle = C.inkSoft;
    ctx.font = titleFont;
    ctx.fillText(line, cssW / 2 - (right ? 12 * s : 0), rowOne);
    if (right) {
      ctx.fillStyle = C.turquoiseDeep;
      ctx.font = '600 ' + Math.round(11 * s) + 'px ' + FONT_UI;
      ctx.fillText(right, x + w - 20 * s, rowOne);
    }

    // The one line that says where to go, under a hairline, so the two rows read
    // as belonging to each other.
    if (detail) {
      ctx.strokeStyle = 'rgba(216,204,184,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 18 * s, y + 26 * s);
      ctx.lineTo(x + w - 18 * s, y + 26 * s);
      ctx.stroke();
      ctx.fillStyle = 'rgba(42,35,32,0.58)';
      ctx.font = detailFont;
      ctx.fillText(detail, cssW / 2, y + 36 * s);
    }

    ctx.textAlign = 'left';
    ctx.restore();
  }

  function drawSectionEdges(d) {
    if (interior) return;
    if (d.kind === 'sea') {
      // On the water the far edges are the horizon, not a hedge; the edges she
      // came in by are her own shore. Only the shore edges need a sign.
      var south = neighbourOf(0, 1), east = neighbourOf(1, 0);
      if (south) drawOpenEdge({ dx: 0, dy: 1, side: 'south' }, south, d, world.w, world.h);
      if (east) drawOpenEdge({ dx: 1, dy: 0, side: 'east' }, east, d, world.w, world.h);
      return;
    }
    var W = world.w, H = world.h;
    // The side labels sit inside the page, so the name is never cut off by the
    // edge of the screen it belongs to.
    var edges = [
      { dx: 0, dy: -1, side: 'north' },
      { dx: 0, dy: 1, side: 'south' },
      { dx: -1, dy: 0, side: 'west' },
      { dx: 1, dy: 0, side: 'east' }
    ];
    var i;
    for (i = 0; i < edges.length; i++) {
      var e = edges[i];
      var next = neighbourOf(e.dx, e.dy);
      if (next) drawOpenEdge(e, next, d, W, H);
      else drawClosedEdge(e, d, W, H);
    }
  }

  /* A gap that leads on: a softened break in the ground's edge, a chevron
     pointing the way, and the name of the place beyond it. */
  function drawOpenEdge(e, next, d, W, H) {
    var along, at, half = 56, ax, ay, bx, by;
    var horizontal = e.dy !== 0;
    ctx.save();

    if (horizontal) {
      var ey = e.side === 'north' ? 0 : H;
      ax = W * 0.5 - half; bx = W * 0.5 + half;
      ay = by = ey;
      // The break in the verge, lighter than the ground so it reads as a way on.
      var g = ctx.createLinearGradient(0, ey, 0, ey + (e.side === 'north' ? 64 : -64));
      g.addColorStop(0, 'rgba(247,244,238,0.55)');
      g.addColorStop(1, 'rgba(247,244,238,0)');
      ctx.fillStyle = g;
      ctx.fillRect(ax - 26, e.side === 'north' ? ey : ey - 64, (bx - ax) + 52, 64);
      // A worn track through it, so the gap is a path and not a smudge.
      ctx.fillStyle = 'rgba(196,178,140,0.55)';
      roundRect(W * 0.5 - 20, e.side === 'north' ? ey - 2 : ey - 46, 40, 48, 18);
      ctx.fill();
      at = { x: W * 0.5, y: e.side === 'north' ? 26 : H - 26 };
      along = 1;
    } else {
      var ex = e.side === 'west' ? 0 : W;
      ax = ax = ex; ay = H * 0.5 - half; by = H * 0.5 + half;
      var g2 = ctx.createLinearGradient(ex, 0, ex + (e.side === 'west' ? 64 : -64), 0);
      g2.addColorStop(0, 'rgba(247,244,238,0.55)');
      g2.addColorStop(1, 'rgba(247,244,238,0)');
      ctx.fillStyle = g2;
      ctx.fillRect(e.side === 'west' ? ex : ex - 64, ay - 26, 64, (by - ay) + 52);
      ctx.fillStyle = 'rgba(196,178,140,0.55)';
      roundRect(e.side === 'west' ? ex - 2 : ex - 46, H * 0.5 - 20, 48, 40, 18);
      ctx.fill();
      at = { x: e.side === 'west' ? 46 : W - 46, y: H * 0.5 };
      along = 0;
    }

    // The chevron, pointing out of the section.
    ctx.fillStyle = 'rgba(90,74,56,0.42)';
    ctx.beginPath();
    var cx2 = at.x, cy2 = at.y, r = 7;
    if (e.side === 'north') {
      ctx.moveTo(cx2 - r, cy2 + r * 0.4); ctx.lineTo(cx2, cy2 - r * 0.8); ctx.lineTo(cx2 + r, cy2 + r * 0.4);
    } else if (e.side === 'south') {
      ctx.moveTo(cx2 - r, cy2 - r * 0.4); ctx.lineTo(cx2, cy2 + r * 0.8); ctx.lineTo(cx2 + r, cy2 - r * 0.4);
    } else if (e.side === 'west') {
      ctx.moveTo(cx2 + r * 0.4, cy2 - r); ctx.lineTo(cx2 - r * 0.8, cy2); ctx.lineTo(cx2 + r * 0.4, cy2 + r);
    } else {
      ctx.moveTo(cx2 - r * 0.4, cy2 - r); ctx.lineTo(cx2 + r * 0.8, cy2); ctx.lineTo(cx2 - r * 0.4, cy2 + r);
    }
    ctx.closePath();
    ctx.fill();

    // The place beyond, named small in the direction it lies. The names are set
    // upright, on a slip of paper: a label turned on its side is a puzzle, not a
    // sign.
    var label = next.name.replace(/^the /, '');
    ctx.font = 'italic 400 12px ' + FONT_SERIF;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(58,48,40,0.66)';
    var lw = ctx.measureText(label).width + 24;
    if (e.side === 'north') {
      // Clear of the errand strip, which owns the very top of the page.
      slip(W * 0.5, 74, lw, 22);
      ctx.fillText(label, W * 0.5, 74);
    } else if (e.side === 'south') {
      slip(W * 0.5, H - 54, lw, 22);
      ctx.fillText(label, W * 0.5, H - 54);
    } else if (e.side === 'west') {
      slip(74, H * 0.5, lw, 22);
      ctx.fillText(label, 74, H * 0.5);
    } else {
      slip(W - 74, H * 0.5, lw, 22);
      ctx.fillText(label, W - 74, H * 0.5);
    }
    ctx.textAlign = 'left';
    ctx.restore();
  }

  /* A slip of paper behind a name, so it reads over any ground. */
  function slip(x, y, w, h) {
    ctx.save();
    ctx.fillStyle = 'rgba(247,244,238,0.80)';
    roundRect(x - w / 2, y - h / 2, w, h, Math.min(w, h) / 2);
    ctx.fill();
    ctx.restore();
  }

  /* An edge that leads nowhere: the island ends here, and the drawing says so.
     A cliff for rock and salt, a wall of thorn for the woods and the yards, a
     dune crest for sand, a bank for the wet places. */
  function drawClosedEdge(e, d, W, H) {
    var style = 'hedge';
    if (d.kind === 'heights' || d.kind === 'desert' || d.kind === 'steppe' || d.kind === 'beach') style = 'cliff';
    if (d.kind === 'pond' || d.kind === 'stream' || d.kind === 'river') style = 'bank';
    if (d.kind === 'glass' || d.kind === 'henhouse' || d.kind === 'apiary' || d.kind === 'yard' || d.kind === 'garden' || d.kind === 'meadow') style = 'hedge';
    if (d.kind === 'openwater') style = 'horizon';

    ctx.save();
    var out = e.dy !== 0 ? (e.side === 'north' ? 1 : -1) : (e.side === 'west' ? 1 : -1);
    var i, n = style === 'horizon' ? 0 : (style === 'cliff' ? 11 : 13);

    if (style === 'horizon') {
      // Open water does not end: it goes out of sight. A pale hazy band where the
      // sky would be, and nothing else - no wall, no hedge, no bank.
      var hz = ctx.createLinearGradient(
        e.dy !== 0 ? 0 : (e.side === 'west' ? 0 : W),
        e.dy !== 0 ? (e.side === 'north' ? 0 : H) : 0,
        e.dy !== 0 ? 0 : (e.side === 'west' ? 70 : W - 70),
        e.dy !== 0 ? (e.side === 'north' ? 70 : H - 70) : 0);
      hz.addColorStop(0, 'rgba(214,234,238,0.55)');
      hz.addColorStop(1, 'rgba(214,234,238,0)');
      ctx.fillStyle = hz;
      if (e.dy !== 0) ctx.fillRect(0, e.side === 'north' ? 0 : H - 70, W, 70);
      else ctx.fillRect(e.side === 'west' ? 0 : W - 70, 0, 70, H);
      ctx.restore();
      return;
    }

    if (style === 'cliff') {
      // A cliff is a lip and a fall: a dark line where the ground stops, then
      // lumps of broken rock sitting on it, each a different size.
      ctx.strokeStyle = 'rgba(72,62,50,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (e.dy !== 0) { ctx.moveTo(0, e.side === 'north' ? 18 : H - 18); ctx.lineTo(W, e.side === 'north' ? 18 : H - 18); }
      else { ctx.moveTo(e.side === 'west' ? 18 : W - 18, 0); ctx.lineTo(e.side === 'west' ? 18 : W - 18, H); }
      ctx.stroke();
    }

    for (i = 0; i < n; i++) {
      var t = (i + 0.5) / n;
      var x, y;
      if (e.dy !== 0) { x = W * t; y = e.side === 'north' ? 0 : H; }
      else { x = e.side === 'west' ? 0 : W; y = H * t; }
      var s = 0.78 + ((i * 37) % 11) / 20;

      if (style === 'cliff') {
        // Two tones, so the rock reads as broken rather than as a painted band.
        ctx.fillStyle = i % 3 === 0 ? '#B2A78F' : '#C3B9A2';
        ctx.beginPath();
        if (e.dy !== 0) ctx.ellipse(x, y + out * 9, 26 * s, 15 * s, 0, 0, TAU);
        else ctx.ellipse(x + out * 9, y, 15 * s, 26 * s, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = i % 3 === 0 ? 'rgba(86,76,62,0.32)' : 'rgba(86,76,62,0.20)';
        ctx.beginPath();
        if (e.dy !== 0) ctx.ellipse(x - 5 * s, y + out * 20, 20 * s, 11 * s, 0, 0, TAU);
        else ctx.ellipse(x + out * 20, y - 5 * s, 11 * s, 20 * s, 0, 0, TAU);
        ctx.fill();
      } else if (style === 'bank') {
        ctx.fillStyle = 'rgba(120,140,96,0.5)';
        ctx.beginPath();
        if (e.dy !== 0) ctx.ellipse(x, y, 26 * s, 12 * s, 0, 0, TAU);
        else ctx.ellipse(x, y, 12 * s, 26 * s, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(110,150,150,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (e.dy !== 0) {
          ctx.moveTo(x - 22 * s, y + (e.side === 'north' ? 8 : -8));
          ctx.quadraticCurveTo(x, y + (e.side === 'north' ? 2 : -2), x + 22 * s, y + (e.side === 'north' ? 8 : -8));
        } else {
          ctx.moveTo(x + (e.side === 'west' ? 8 : -8), y - 22 * s);
          ctx.quadraticCurveTo(x + (e.side === 'west' ? 2 : -2), y, x + (e.side === 'west' ? 8 : -8), y + 22 * s);
        }
        ctx.stroke();
      } else {
        // A hedge: a run of dark rounded bushes, taller than she is.
        var hx = e.dy !== 0 ? x : x + out * 6;
        var hy = e.dy !== 0 ? y + out * 6 : y;
        ctx.fillStyle = i % 2 ? '#3E5A33' : '#476439';
        ctx.beginPath();
        if (e.dy !== 0) ctx.ellipse(hx, hy, 26 * s, 20 * s, 0, 0, TAU);
        else ctx.ellipse(hx, hy, 20 * s, 26 * s, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.beginPath();
        if (e.dy !== 0) ctx.ellipse(hx - 4, hy - 5, 15 * s, 9 * s, 0, 0, TAU);
        else ctx.ellipse(hx - 5, hy - 4, 9 * s, 15 * s, 0, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawDaisy(x, y, r, a) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + Math.sin(clock * 1.1 + x * 0.03) * 0.08);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    for (var p = 0; p < 6; p++) {
      var ang = (p / 6) * TAU;
      ctx.beginPath();
      ctx.ellipse(Math.cos(ang) * r * 0.9, Math.sin(ang) * r * 0.9, r * 0.62, r * 0.36, ang, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = C.saffron;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.45, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* The hive - drawn once per frame, so it can breathe. */
  function drawHive() {
    var x = hive.x, y = hive.y;
    var near = phase === 'playing' && carry > 0;
    var pulse = 1 + Math.sin(clock * 2.2) * 0.012;

    ctx.save();
    // Approach ring, only while carrying.
    if (near) {
      ctx.strokeStyle = 'rgba(47,167,155,0.55)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 10]);
      ctx.beginPath();
      ctx.arc(x, y + 24, hive.r, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(47,167,155,0.18)';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(x, y + 24, hive.r - 3, 0, TAU);
      ctx.stroke();
    }

    // Warm halo.
    var halo = ctx.createRadialGradient(x, y + 10, 10, x, y + 10, 190);
    halo.addColorStop(0, 'rgba(232,163,61,0.20)');
    halo.addColorStop(1, 'rgba(232,163,61,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(x - 200, y - 190, 400, 400);

    // Shadow.
    ctx.fillStyle = 'rgba(30,40,22,0.20)';
    ctx.beginPath();
    ctx.ellipse(x, y + 66, 84, 20, 0, 0, TAU);
    ctx.fill();

    // Stand.
    ctx.fillStyle = C.strawDeep;
    ctx.beginPath();
    ctx.moveTo(x - 46, y + 44);
    ctx.lineTo(x - 36, y + 68);
    ctx.lineTo(x - 22, y + 68);
    ctx.lineTo(x - 26, y + 44);
    ctx.closePath();
    ctx.moveTo(x + 46, y + 44);
    ctx.lineTo(x + 36, y + 68);
    ctx.lineTo(x + 22, y + 68);
    ctx.lineTo(x + 26, y + 44);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#B08F58';
    ctx.fillRect(x - 62, y + 40, 124, 12);

    ctx.translate(x, y + 10);
    ctx.scale(pulse, pulse);

    // Skep: stacked coils.
    var rings = [
      { y: 30, rx: 60, c: '#D9B06A' },
      { y: 14, rx: 66, c: '#E1BC79' },
      { y: -4, rx: 64, c: '#E8C886' },
      { y: -22, rx: 56, c: '#EDD294' },
      { y: -38, rx: 43, c: '#F0D9A2' },
      { y: -51, rx: 27, c: '#F3DFB0' }
    ];
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      ctx.fillStyle = 'rgba(122,84,36,0.18)';
      ctx.beginPath();
      ctx.ellipse(0, r.y + 8, r.rx, 15, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = r.c;
      ctx.beginPath();
      ctx.ellipse(0, r.y, r.rx, 17, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,98,44,0.28)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(0, r.y + 1, r.rx - 3, 13, 0, 0.15, Math.PI - 0.15);
      ctx.stroke();
    }

    // Entrance.
    ctx.fillStyle = '#5B3B1E';
    ctx.beginPath();
    ctx.ellipse(0, 30, 17, 11, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3E2713';
    ctx.beginPath();
    ctx.ellipse(0, 31, 11, 7, 0, 0, TAU);
    ctx.fill();
    // Landing board.
    ctx.fillStyle = '#B98F52';
    ctx.beginPath();
    ctx.ellipse(0, 43, 26, 7, 0, 0, TAU);
    ctx.fill();

    // Bees around the skep.
    for (var b = 0; b < 3; b++) {
      var ang = clock * (0.7 + b * 0.13) + b * 2.1;
      var br = 84 + b * 16;
      drawBee(Math.cos(ang) * br, -14 + Math.sin(ang) * br * 0.55, 0.68);
    }

    ctx.restore();
  }

  function drawBee(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.ellipse(-4, -7, 7, 4, -0.5, 0, TAU);
    ctx.ellipse(4, -7, 7, 4, 0.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3B2A24';
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 6, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = C.saffron;
    ctx.beginPath();
    ctx.ellipse(-2.6, 0, 2.2, 5.4, 0, 0, TAU);
    ctx.ellipse(2.6, 0, 2.2, 5.4, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3B2A24';
    ctx.beginPath();
    ctx.arc(-7, -1, 2.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawPickups() {
    for (var i = 0; i < pickups.length; i++) {
      var p = pickups[i];
      var bob = Math.sin(p.age * 2.6) * 4;
      drawPickup(p.x, p.y + bob, p.age, p.kind);
    }
  }

  function drawPickup(x, y, age, kind) {
    var s = R.pickupSize / 40;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    paintNectar(ctx, age, kind);
    ctx.restore();
  }

  /* One nectar drop, with its stem, glow and bloom. Design units: the drop is
   * about 40 tall. The world and the studio's close-up share it. */
  function paintNectar(g, age, kind, withGlow) {
    if (withGlow !== false) {
      var glow = g.createRadialGradient(0, 0, 2, 0, 0, 44);
      glow.addColorStop(0, 'rgba(244,206,115,0.55)');
      glow.addColorStop(0.5, 'rgba(244,206,115,0.18)');
      glow.addColorStop(1, 'rgba(244,206,115,0)');
      g.fillStyle = glow;
      g.fillRect(-50, -50, 100, 100);
    }

    // Little stem and leaf, so it reads as the flower's nectar.
    g.strokeStyle = '#5A8A3C';
    g.lineWidth = 2.4;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(0, 10);
    g.quadraticCurveTo(-3, 20, 0, 27);
    g.stroke();
    g.fillStyle = '#6E9A4C';
    g.beginPath();
    g.ellipse(7, 21, 6, 3, 0.6, 0, TAU);
    g.fill();

    if (kind === 1) {
      // A paler drop, as if from a white bloom.
      g.fillStyle = 'rgba(255,255,255,0.0)';
    }

    // Nectar drop, in three shades so the meadow is not one colour.
    var top = kind === 1 ? '#FFEBB4' : (kind === 2 ? '#F7D07A' : '#FBE2A0');
    var bottom = kind === 1 ? '#E7B45A' : (kind === 2 ? '#DA8F2C' : '#E8A33D');
    var drop = g.createLinearGradient(0, -16, 0, 12);
    drop.addColorStop(0, top);
    drop.addColorStop(1, bottom);
    g.fillStyle = drop;
    g.beginPath();
    g.moveTo(0, -15);
    g.bezierCurveTo(8, -6, 10, 1, 9, 6);
    g.bezierCurveTo(8, 12, -8, 12, -9, 6);
    g.bezierCurveTo(-10, 1, -8, -6, 0, -15);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(122,80,20,0.25)';
    g.lineWidth = 1.2;
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.beginPath();
    g.ellipse(-3, 2, 2.4, 3.4, -0.2, 0, TAU);
    g.fill();
  }

  /* The boat she is sitting in, from above: the hull around her, the thwart, the
     two oars, and the wake it leaves. */
  function drawBoatHull() {
    var bx = hero.x, by = hero.y + 6 + boatRide.bob;
    ctx.save();
    ctx.translate(bx, by);

    // The wake: rings and chevrons left behind the stern.
    for (var wk = 0; wk < boatRide.wake.length; wk++) {
      var w = boatRide.wake[wk];
      var wa = 1 - w.age / 2.2;
      var wr = 16 + w.age * 26;
      ctx.strokeStyle = 'rgba(232,250,248,' + (0.30 * wa).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(w.x - bx, w.y - by, wr, wr * 0.34, 0, 0, TAU);
      ctx.stroke();
    }

    // The hull, seen from above: a long leaf, pointed at both ends.
    ctx.fillStyle = '#7A5334';
    ctx.beginPath();
    ctx.moveTo(0, -52);
    ctx.quadraticCurveTo(30, -30, 32, 6);
    ctx.quadraticCurveTo(30, 40, 0, 52);
    ctx.quadraticCurveTo(-30, 40, -32, 6);
    ctx.quadraticCurveTo(-30, -30, 0, -52);
    ctx.closePath();
    ctx.fill();

    // The inside, a paler plank colour, inset so the gunwale reads as a rim.
    ctx.fillStyle = '#B4762E';
    ctx.beginPath();
    ctx.moveTo(0, -44);
    ctx.quadraticCurveTo(23, -26, 25, 6);
    ctx.quadraticCurveTo(23, 33, 0, 44);
    ctx.quadraticCurveTo(-23, 33, -25, 6);
    ctx.quadraticCurveTo(-23, -26, 0, -44);
    ctx.closePath();
    ctx.fill();

    // The water she is displacing: a bright rim round the hull.
    ctx.strokeStyle = 'rgba(240,254,250,0.42)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -52);
    ctx.quadraticCurveTo(30, -30, 32, 6);
    ctx.quadraticCurveTo(30, 40, 0, 52);
    ctx.quadraticCurveTo(-30, 40, -32, 6);
    ctx.quadraticCurveTo(-30, -30, 0, -52);
    ctx.closePath();
    ctx.stroke();

    var ph = boatRide.oar * TAU;
    for (var o = -1; o <= 1; o += 2) {
      var swing = Math.sin(ph + (o > 0 ? 0 : Math.PI));
      ctx.save();
      ctx.translate(o * 18, 2);
      ctx.rotate(o * (0.34 + swing * 0.22));
      ctx.strokeStyle = '#9A7648';
      ctx.lineWidth = 3.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(o * 34, -6 + swing * 9);
      ctx.stroke();
      // Its blade in the water.
      ctx.fillStyle = 'rgba(214,240,238,0.55)';
      ctx.beginPath();
      ctx.ellipse(o * 36, -6 + swing * 9, 9, 4.4, o * 0.3, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  /* The near side of the boat, drawn over her: the gunwale and the thwart, so she
     is inside the boat and not sitting on top of it. */
  function drawBoatFront() {
    var bx = hero.x, by = hero.y + 6 + boatRide.bob;
    ctx.save();
    ctx.translate(bx, by);
    // The thwart's ends, either side of her.
    ctx.fillStyle = '#8E6A42';
    roundRect(-26, -4, 15, 10, 3);
    ctx.fill();
    roundRect(11, -4, 15, 10, 3);
    ctx.fill();
    // The near gunwale: the boat's rim, over her lap.
    ctx.strokeStyle = '#6B4A2E';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-30, 26);
    ctx.quadraticCurveTo(0, 44, 30, 26);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(190,150,96,0.55)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-30, 23);
    ctx.quadraticCurveTo(0, 41, 30, 23);
    ctx.stroke();
    ctx.restore();
  }

  /* Where a keeper's feet land below the point she is drawn at, in page pixels.
     One owner: her shadow, Donya's shadow and anything else standing on the
     ground measure their contact point from this. */
  var _feetCache = {};
  function keeperFeetBelow(size) {
    if (_feetCache[size] !== undefined) return _feetCache[size];
    var probe = document.createElement('canvas');
    probe.width = 200; probe.height = 260;
    var pc = probe.getContext('2d');
    var prev = ctx;
    ctx = pc;
    pc.setTransform(1, 0, 0, 1, 0, 0);
    pc.clearRect(0, 0, 200, 260);
    pc.save();
    pc.translate(100, 100);
    try { paintKeeper(pc, size, 'front', null, false, OUTFITS[0], false); } catch (e) { /* fall through */ }
    pc.restore();
    ctx = prev;
    var d = pc.getImageData(0, 0, 200, 260).data;
    var low = -1;
    for (var y = 0; y < 260; y++) {
      for (var x = 0; x < 200; x++) {
        if (d[(y * 200 + x) * 4 + 3] > 10) { if (y > low) low = y; break; }
      }
    }
    var feet = low >= 0 ? low - 100 : size * 0.21;
    _feetCache[size] = feet;
    return feet;
  }

  function drawHero() {
    var bob = Math.sin(hero.anim * 2.2) * 2.2 * hero.moving;
    var blink = invuln > 0 && Math.floor(invuln * 12) % 2 === 0;
    ctx.save();
    if (blink) ctx.globalAlpha = 0.55;

    if (boatRide.riding) {
      // In the boat: the boat is drawn, her shadow is not.
      ctx.restore();
      ctx.save();
      if (blink) ctx.globalAlpha = 0.55;
      drawBoatHull();
      // Sitting down inside it, with her hips on the thwart.
      ctx.translate(hero.x, hero.y + 18 + boatRide.bob);
      paintKeeper(ctx, R.heroSize * 0.92, 'back', 'sit', false, OUTFITS[outfit] || OUTFITS[0], false);
      ctx.restore();
      ctx.save();
      drawBoatFront();
      ctx.restore();
      return;
    }

    // Her shadow, from the island's one sun: it lies the way the sun pushes it
    // and grows long as the sun drops.
    castShadow(hero.x, hero.y + keeperFeetBelow(R.heroSize), 56, 0.26);

    ctx.translate(hero.x, hero.y + bob);
    ctx.rotate(hero.tilt);
    drawCharacter(ctx, 'hero', R.heroSize);
    ctx.restore();

    // What she carries, in a little pouch at her side.
    if (carry > 0) {
      ctx.save();
      ctx.translate(hero.x + 26 * hero.dir, hero.y + 14 + bob);
      for (var i = 0; i < carry; i++) {
        var a = -0.9 + i * 0.45;
        ctx.fillStyle = '#E8A33D';
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * 8, Math.sin(a) * 5 - (i % 2) * 3, 4, 5, 0, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  /* Midday's sprouts: dry and drooping until water brings them upright. */
  function drawSprouts() {
    for (var i = 0; i < sprouts.length; i++) {
      var s = sprouts[i];
      var w = s.water;
      var sway = Math.sin(clock * 1.4 + s.sway) * (1.5 + w * 2.5);

      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.scale(1.45, 1.45);

      // A patch of dry earth marks the spot from across the meadow.
      ctx.fillStyle = 'rgba(214,190,144,0.92)';
      ctx.beginPath();
      ctx.ellipse(0, 7, 31, 14, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(180,150,100,0.5)';
      ctx.beginPath();
      ctx.ellipse(0, 9, 22, 9, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,110,66,0.45)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-17, 4);
      ctx.lineTo(-9, 8);
      ctx.lineTo(-13, 13);
      ctx.moveTo(12, 3);
      ctx.lineTo(17, 8);
      ctx.stroke();

      // A watering can tips over the sprout while it is being poured.
      if (s === pour) {
        ctx.save();
        ctx.translate(-20, -74);
        ctx.rotate(-0.42 + Math.sin(clock * 6) * 0.03);
        ctx.fillStyle = '#7FA7A2';
        roundRect(-11, -9, 22, 16, 5);
        ctx.fill();
        ctx.fillStyle = '#6C938E';
        ctx.beginPath();
        ctx.moveTo(9, -6);
        ctx.lineTo(20, -13);
        ctx.lineTo(21, -8);
        ctx.lineTo(11, 1);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#5E8783';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(-2, -10, 6, Math.PI * 1.05, Math.PI * 1.95);
        ctx.stroke();
        ctx.restore();

        for (var d = 0; d < 3; d++) {
          var fall = (clock * 90 + d * 14) % 46;
          ctx.fillStyle = 'rgba(150,205,208,' + (0.9 - fall / 60).toFixed(2) + ')';
          ctx.beginPath();
          ctx.ellipse(4 + d * 3, -52 + fall, 1.8, 2.6, 0.2, 0, TAU);
          ctx.fill();
        }
      }

      if (s.done) {
        // A bloom, with the stem that carried it.
        ctx.strokeStyle = '#4E6E33';
        ctx.lineWidth = 3.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 5);
        ctx.quadraticCurveTo(3, -14, sway * 0.4, -32);
        ctx.stroke();
        var glow = ctx.createRadialGradient(0, -42, 2, 0, -42, 50);
        glow.addColorStop(0, 'rgba(255,238,190,0.55)');
        glow.addColorStop(1, 'rgba(255,238,190,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, -42, 50, 0, TAU);
        ctx.fill();
        drawDaisy(sway * 0.4, -42, 20, 0);
      } else {
        var lift = 16 + w * 30;
        var bend = (1 - w) * 26;
        ctx.strokeStyle = '#456428';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 5);
        ctx.quadraticCurveTo(bend * 0.7 + sway, -lift * 0.5, bend + sway, -lift);
        ctx.stroke();

        for (var k = -1; k <= 1; k += 2) {
          ctx.save();
          ctx.translate(bend * 0.5 + sway * 0.6, -lift * 0.52);
          ctx.rotate(k * (0.55 + (1 - w) * 0.85));
          ctx.fillStyle = w > 0.5 ? '#83A654' : '#93A363';
          ctx.beginPath();
          ctx.ellipse(k * 13, 0, 14, 6.5, 0, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = 'rgba(60,84,36,0.35)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.restore();
        }

        ctx.fillStyle = w > 0.8 ? C.saffron : '#C2B485';
        ctx.beginPath();
        ctx.arc(bend + sway, -lift, 5 + w * 2.6, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(90,72,40,0.35)';
        ctx.lineWidth = 1.1;
        ctx.stroke();

        // How much water it has.
        ctx.strokeStyle = 'rgba(42,35,32,0.3)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 9, 21, 0, TAU);
        ctx.stroke();
        if (w > 0.01) {
          ctx.strokeStyle = C.turquoise;
          ctx.beginPath();
          ctx.arc(0, 9, 21, -Math.PI / 2, -Math.PI / 2 + TAU * w);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  /* Dusk's fireflies: warm lights drifting over the meadow. */
  function drawFireflies() {
    for (var i = 0; i < fireflies.length; i++) {
      var f = fireflies[i];
      var pulse = 0.55 + 0.45 * Math.sin(clock * 2.6 + f.ph);
      var glow = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, f.r * 3.8);
      glow.addColorStop(0, 'rgba(255,240,170,' + (1 * pulse).toFixed(3) + ')');
      glow.addColorStop(0.35, 'rgba(255,216,124,' + (0.4 * pulse).toFixed(3) + ')');
      glow.addColorStop(1, 'rgba(255,216,124,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 3.8, 0, TAU);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,' + (0.6 + 0.4 * pulse).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(f.x, f.y, 2.8 + pulse * 1.8, 0, TAU);
      ctx.fill();
    }
  }

  function drawEnemies() {
    for (var i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
  }

  function drawEnemy(e) {
    var s = R.enemySize / 74;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(s, s);

    castShadow(0, 30, 52, 0.20, 56);

    ctx.rotate(Math.sin(e.wob * 1.1) * 0.08);
    ctx.translate(0, Math.sin(e.wob * 2) * 3);
    paintDustDevil(ctx, 74, e.spin);
    ctx.restore();
  }

  /* One dust devil, at any size and any point in its turn. The world and the
   * studio's close-up both call this, so they always show the same thing. */
  function paintDustDevil(g, size, spin) {
    var s = size / 74;
    g.save();
    g.scale(s, s);

    // A low puff of travelling dust: soft body first.
    var body = g.createLinearGradient(0, -28, 0, 26);
    body.addColorStop(0, 'rgba(238,224,190,0.78)');
    body.addColorStop(0.6, 'rgba(216,192,148,0.66)');
    body.addColorStop(1, 'rgba(190,158,108,0.42)');
    g.fillStyle = body;
    g.beginPath();
    g.ellipse(-11, 4, 20, 13, -0.15, 0, TAU);
    g.ellipse(10, 5, 21, 12, 0.12, 0, TAU);
    g.ellipse(0, -8, 17, 12, 0, 0, TAU);
    g.fill();

    // Lighter crest on top.
    g.fillStyle = 'rgba(250,240,214,0.5)';
    g.beginPath();
    g.ellipse(-3, -12, 12, 7, 0, 0, TAU);
    g.fill();

    // Wind lines sweeping through it.
    g.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      var off = Math.sin(spin * 1.3 + i * 2.0) * 4;
      var y = -12 + i * 10 + off;
      g.strokeStyle = 'rgba(146,112,64,' + (0.42 - i * 0.08) + ')';
      g.lineWidth = 2.6 - i * 0.4;
      g.beginPath();
      g.moveTo(-26, y);
      g.bezierCurveTo(-8, y - 7, 10, y + 7, 26, y - 2);
      g.stroke();
    }

    // Sand and leaf flecks caught in the gust.
    for (var d = 0; d < 6; d++) {
      var ang = spin * 1.5 + d * 1.25;
      var rr = 13 + d * 3.6;
      g.fillStyle = d % 3 === 0 ? 'rgba(96,124,56,0.9)' : 'rgba(140,104,56,0.95)';
      g.beginPath();
      g.ellipse(Math.cos(ang) * rr, Math.sin(ang) * rr * 0.7 - 3, 2.6, 2, ang, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  /* The ring her last step threw, under her feet on the water. */
  /* The hour, and the part of the day it belongs to, with the sun or the moon
     beside it. It is the same light that falls on the page, named. */
  function drawHourChip(cssW, cssH) {
    var s = clamp(Math.min(cssW, cssH) / 520, 0.82, 1.4);
    var L = dayLight();
    var label = dayClock();
    var part = dayName();
    ctx.save();
    ctx.font = '600 ' + Math.round(11 * s) + 'px ' + FONT_UI;
    var w1 = ctx.measureText(label).width;
    ctx.font = 'italic 400 ' + Math.round(11 * s) + 'px ' + FONT_SERIF;
    var w2 = ctx.measureText(part).width;
    var w = Math.max(w1, w2) + 34 * s;
    var h = 32 * s;
    var x = cssW - w - 12 * s, y = 10 * s;
    ctx.fillStyle = 'rgba(247,244,238,0.80)';
    roundRect(x, y, w, h, h / 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(216,204,184,0.9)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // The sun, or the moon, at its own height in the sky.
    var mx = x + 15 * s, my = y + h / 2;
    if (L.night) {
      ctx.fillStyle = '#5A6478';
      ctx.beginPath();
      ctx.arc(mx, my, 5 * s, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(247,244,238,0.92)';
      ctx.beginPath();
      ctx.arc(mx + 2 * s, my - 1.5 * s, 4.4 * s, 0, TAU);
      ctx.fill();
    } else {
      var warm = L.warm;
      ctx.fillStyle = warm > 0.25 ? '#E8A24A' : '#E3B24E';
      ctx.beginPath();
      ctx.arc(mx, my, 5 * s, 0, TAU);
      ctx.fill();
      // Its halo, brighter when it is low.
      ctx.strokeStyle = 'rgba(227,178,78,' + (0.35 + 0.3 * warm).toFixed(2) + ')';
      ctx.lineWidth = 1.2 * s;
      ctx.beginPath();
      ctx.arc(mx, my, 8 * s, 0, TAU);
      ctx.stroke();
    }

    ctx.textAlign = 'left';
    ctx.fillStyle = C.ink;
    ctx.font = '600 ' + Math.round(11 * s) + 'px ' + FONT_UI;
    ctx.fillText(label, x + 26 * s, y + 13 * s);
    ctx.fillStyle = C.inkFaint;
    ctx.font = 'italic 400 ' + Math.round(10 * s) + 'px ' + FONT_SERIF;
    ctx.fillText(part, x + 26 * s, y + 25 * s);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function drawStepRing() {
    if (!stepRing || stepRing.age > 1.15) return;
    var a = 1 - stepRing.age / 1.15;
    var r = 26 + stepRing.age * 58;
    var y = stepRing.y;
    var strength = 0.35 + stepRing.w * 0.65;
    ctx.save();
    // A darker rim under the bright one, so the ring reads against pale water.
    ctx.strokeStyle = 'rgba(58,96,102,' + (0.30 * a * strength).toFixed(3) + ')';
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.ellipse(stepRing.x, y, r, r * 0.26, 0, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(248,255,254,' + (0.92 * a * strength).toFixed(3) + ')';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(stepRing.x, y, r, r * 0.26, 0, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(248,255,254,' + (0.60 * a * strength).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(stepRing.x, y, r * 1.5, r * 0.38, 0, 0, TAU);
    ctx.stroke();
    // A bright crown where the foot went in, fading first.
    if (stepRing.age < 0.35) {
      var crown = 1 - stepRing.age / 0.35;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * crown * strength).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(stepRing.x, y, r * 0.45, r * 0.14, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMotes() {
    ctx.save();
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      var a = 0.16 + 0.12 * Math.sin(clock * 1.6 + m.ph);
      ctx.fillStyle = 'rgba(247,231,183,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      var a = 1 - f.age / f.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = f.color;
      ctx.font = '600 22px ' + FONT_UI;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function drawRipple() {
    if (!ripple) return;
    var t = ripple.age / 0.55;
    ctx.strokeStyle = 'rgba(244,237,225,' + (0.75 * (1 - t)).toFixed(3) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(ripple.x, ripple.y, 8 + t * 26, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = 'rgba(244,237,225,' + (0.5 * (1 - t)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(ripple.x, ripple.y, 3.5, 0, TAU);
    ctx.fill();
  }

  function drawDuskVeil() {
    if (phase === 'title') return;
    var k = clamp(duskK, 0, 1);
    if (k <= 0.01) return;
    var g = ctx.createRadialGradient(world.w * 0.5, world.h * 0.42, world.h * 0.15, world.w * 0.5, world.h * 0.5, world.h * 0.8);
    g.addColorStop(0, 'rgba(224,163,42,' + (0.02 + k * 0.10).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(46,54,80,' + (0.03 + k * 0.52).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, world.w, world.h);
    // A cool cast over everything, so dusk reads as dusk.
    ctx.fillStyle = 'rgba(38,48,72,' + (k * 0.30).toFixed(3) + ')';
    ctx.fillRect(0, 0, world.w, world.h);
  }

  /* HUD - paper chips laid over the field. */
  function drawHUD() {
    if (stage === 'island') return;
    var cssW = canvas.width / dpr, cssH = canvas.height / dpr;
    var s = clamp(Math.min(cssW, cssH) / 520, 0.82, 1.5);
    var pad = 12 * s;
    var chipH = 44 * s;
    var y = pad;
    var fs = Math.round(15 * s);

    ctx.save();
    ctx.textBaseline = 'middle';

    // Left: the three bees.
    var bw = 92 * s;
    drawChip(pad, y, bw, chipH, s);
    for (var i = 0; i < R.hearts; i++) {
      var bx = pad + (18 + i * 28) * s;
      var by = y + chipH / 2;
      ctx.globalAlpha = i < bees ? 1 : 0.22;
      drawBeeGlyph(bx, by, s * 0.9, i < bees);
      ctx.globalAlpha = 1;
    }

    // Centre: the task of this hour.
    var cw = 150 * s;
    var cx = cssW / 2 - cw / 2;
    var taskValue, taskGoal, taskColor, taskGlyph;
    if (stage === 'gather') { taskValue = nectar; taskGoal = R.goal; taskColor = C.honey; taskGlyph = 'jar'; }
    else if (stage === 'water') { taskValue = watered; taskGoal = R.waterGoal; taskColor = C.turquoise; taskGlyph = 'drop'; }
    else { taskValue = caught; taskGoal = R.catchGoal; taskColor = C.saffron; taskGlyph = 'spark'; }
    drawChip(cx, y, cw, chipH, s);
    ctx.fillStyle = C.ink;
    ctx.font = '600 ' + fs + 'px ' + FONT_UI;
    ctx.textAlign = 'left';
    ctx.fillText(taskValue + ' / ' + taskGoal, cx + 40 * s, y + chipH / 2 + 0.5);
    drawTaskGlyph(taskGlyph, cx + 22 * s, y + chipH / 2, s);
    // Progress hairline along the chip's foot.
    var barW = cw - 24 * s;
    var barX = cx + 12 * s;
    var barY = y + chipH - 7 * s;
    ctx.fillStyle = 'rgba(42,35,32,0.12)';
    roundRect(barX, barY, barW, 3 * s, 2 * s);
    ctx.fill();
    ctx.fillStyle = taskColor;
    roundRect(barX, barY, Math.max(2 * s, barW * clamp(taskValue / taskGoal, 0, 1)), 3 * s, 2 * s);
    ctx.fill();

    // Right: the day.
    var dw = 84 * s;
    var dx = cssW - pad - dw;
    drawChip(dx, y, dw, chipH, s);
    drawDayGlyph(dx + 22 * s, y + chipH / 2, s, 1 - clamp(time / R.duration, 0, 1));
    ctx.fillStyle = C.ink;
    ctx.font = '600 ' + fs + 'px ' + FONT_UI;
    ctx.textAlign = 'left';
    ctx.fillText(fmtTime(time), dx + 38 * s, y + chipH / 2 + 0.5);

    // The task's own line, only while nothing else is speaking.
    if (phase === 'playing' && !notice) {
      var hint, tone = 'rgba(42,35,32,0.42)';
      if (stage === 'gather') {
        if (carry > 0) {
          hint = 'basket ' + carry + ' / ' + R.carryMax + '  \u00b7  take it to the hive';
          tone = C.turquoiseDeep;
        } else {
          hint = 'gather nectar from the meadow';
        }
      } else if (stage === 'water') {
        hint = pour ? 'pouring\u2026' : 'walk to a sprout and hold to pour';
        if (pour) tone = C.turquoiseDeep;
      } else {
        hint = 'tap a firefly to keep it';
      }
      ctx.textAlign = 'center';
      ctx.fillStyle = tone;
      ctx.font = '500 ' + Math.round(13 * s) + 'px ' + FONT_UI;
      ctx.fillText(hint, cssW / 2, y + chipH + 16 * s);
    }
    ctx.restore();
  }

  /* The card that announces the next task of the day. */
  function drawNotice() {
    if (!notice || phase === 'title') return;
    var cssW = canvas.width / dpr, cssH = canvas.height / dpr;
    var s = clamp(Math.min(cssW, cssH) / 520, 0.82, 1.5);
    var t = notice.age / notice.life;
    var a = t < 0.1 ? t / 0.1 : (t > 0.78 ? (1 - t) / 0.22 : 1);

    var w = Math.min(cssW - 44 * s, 340 * s);
    var h = 76 * s;
    var x = cssW / 2 - w / 2;
    var y = 92 * s;

    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.fillStyle = 'rgba(42,35,32,0.16)';
    roundRect(x + 3 * s, y + 5 * s, w, h, 14 * s);
    ctx.fill();
    ctx.fillStyle = C.paper;
    roundRect(x, y, w, h, 14 * s);
    ctx.fill();
    ctx.strokeStyle = C.rule;
    ctx.lineWidth = Math.max(1, s);
    ctx.stroke();

    ctx.fillStyle = C.turquoise;
    roundRect(x + 8 * s, y + 13 * s, 3 * s, h - 26 * s, 2 * s);
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    fitFont(ctx, notice.title, 20 * s, w - 44 * s, '600', FONT_SERIF, 'italic ');
    ctx.fillStyle = C.ink;
    ctx.fillText(notice.title, x + 22 * s, y + h * 0.38);
    ctx.fillStyle = C.inkSoft;
    ctx.font = '500 ' + Math.round(13 * s) + 'px ' + FONT_UI;
    ctx.fillText(notice.sub, x + 23 * s, y + h * 0.7);
    ctx.restore();
  }

  function drawChip(x, y, w, h, s) {
    ctx.save();
    ctx.fillStyle = 'rgba(244,237,225,0.94)';
    roundRect(x, y, w, h, 13 * s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(216,204,184,0.9)';
    ctx.lineWidth = Math.max(1, s);
    ctx.stroke();
    ctx.restore();
  }

  function drawBeeGlyph(x, y, k, alive) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(k, k);
    ctx.fillStyle = alive ? '#3B2A24' : 'rgba(59,42,36,0.6)';
    ctx.beginPath();
    ctx.ellipse(0, 1, 7, 5, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = alive ? C.saffron : 'rgba(224,163,42,0.55)';
    ctx.beginPath();
    ctx.ellipse(0, 0.5, 3, 3.5, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = alive ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-3.5, -5, 5, 3, -0.5, 0, TAU);
    ctx.ellipse(3.5, -5, 5, 3, 0.5, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawJarGlyph(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = C.honey;
    roundRect(-8, -8, 16, 18, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    roundRect(-4, -3, 4, 9, 2);
    ctx.fill();
    ctx.fillStyle = '#7A4E1C';
    roundRect(-7, -12, 14, 5, 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTaskGlyph(kind, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    if (kind === 'jar') {
      ctx.fillStyle = C.honey;
      roundRect(-8, -8, 16, 18, 6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      roundRect(-4, -3, 4, 9, 2);
      ctx.fill();
      ctx.fillStyle = '#7A4E1C';
      roundRect(-7, -12, 14, 5, 2);
      ctx.fill();
    } else if (kind === 'drop') {
      ctx.fillStyle = C.turquoise;
      ctx.beginPath();
      ctx.moveTo(0, -11);
      ctx.bezierCurveTo(5, -4, 7, 0, 6, 4);
      ctx.bezierCurveTo(5, 9, -5, 9, -6, 4);
      ctx.bezierCurveTo(-7, 0, -5, -4, 0, -11);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(-2, 2, 1.8, 2.6, -0.2, 0, TAU);
      ctx.fill();
    } else {
      ctx.fillStyle = C.saffron;
      ctx.beginPath();
      for (var i = 0; i < 8; i++) {
        var a = (i / 8) * TAU - Math.PI / 2;
        var r = i % 2 === 0 ? 10 : 3.6;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawDayGlyph(x, y, s, k) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.strokeStyle = 'rgba(42,35,32,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 2, 10, Math.PI, 0);
    ctx.stroke();
    var ang = Math.PI + k * Math.PI;

  function menuSubFor(id) {

    if (id === 'bag') return String(bagCount());
    if (id === 'notebook') return storyPages() + ' / ' + STORY.length;
    if (id === 'sky') return dayName();
    if (id === 'map') {
      var found = 0, all = 0;
      for (var vk in SECTIONS) { if (!SECTIONS.hasOwnProperty(vk)) continue; all++; if (visited[vk]) found++; }
      return found + ' / ' + all;
