    ctx.scale(s, s);
    if (e.sh === 'fungus') drawFungus(e, 0, 0, t);
    else if (e.sh === 'bird') drawBird(e, 0, 0, t);
    else if (e.sh === 'fish') drawFish(e, 0, 0, t);
    else if (e.sh === 'hen') drawHen(e, 0, 0, t);
    else if (e.sh === 'cat') drawCat(e, 0, 0, t);
    else if (e.sh === 'dog') drawDog(e, 0, 0, t);
    else if (e.sh === 'being') drawBeing(e, 0, 0, t, e.id === 'being-sister');
    else if (e.sh === 'find') drawFind(e, 0, 0, t);
    else if (e.sh === 'insect') drawInsect(e, 0, 0, t);
    else if (e.sh === 'frog') drawFrog(e, 0, 0, t);
    else if (e.sh === 'seal') drawSeal(e, 0, 0, t);
    else drawBeast(e, 0, 0, t);
    ctx.restore();
  }

  /* ---- Ground, one drawing per biome ------------------------------------- */
  function groundPalette(kind) {
    switch (kind) {
      // Three stops with a real value range: the far edge darker and cooler, the
      // near edge warmer and lighter. Three near-identical tones is paper.
      case 'woods': return ['#4E6B3A', '#3F5A2E', '#334A26'];
      case 'heights': return ['#93A583', '#83956F', '#73855F'];
      case 'steppe': return ['#B6A96A', '#A99C5C', '#9A8E50'];
      case 'desert': return ['#D9C088', '#CBB178', '#BCA268'];
      case 'beach': return ['#E2CF9E', '#D4BF8C', '#C4AE7A'];
      case 'sea': return ['#6B9396', '#5F8588', '#52777A'];
      case 'openwater': return ['#245A6C', '#1E4E5F', '#184152'];
      case 'pond':
      case 'stream': return ['#8CAC6B', '#7C9C5C', '#6C8C4E'];
      case 'garden': return ['#A3B77E', '#93A86F', '#839860'];
      case 'henhouse': return ['#B3A87A', '#A3986A', '#93885C'];
      case 'apiary': return ['#B8AE76', '#A89E68', '#988E5A'];
      default: return ['#A3B77E', '#93A86F', '#839860'];
    }
  }

  /* Where the river's centre line is at a given height down the page: a channel
     that runs down the right of the river, bends across the bend section and
     opens into the sea at the mouth. One function for the drawing and for the
     banks, so the water and the ground can never disagree. */
  function riverCentre(v, name) {
    if (name === 'the river bend') return 0.16 + v * 0.62;
    if (name === 'the river mouth') return 0.56 + v * 0.12;
    return 0.70 - v * 0.04;
  }
  /* Where the channel meets a section's edge, in page fractions, when the water
     leaves through that edge. The mouth's own channel is the sea's incoming one. */
  function riverMouthAt(v, name) {
    // The mouth opens wider as it nears the sea, and the sea's channel is the
    // same funnel read from the other end.
    return { c: riverCentre(v, name), h: riverHalfWidth(v, name) };
  }

  function riverHalfWidth(v, name) {
    if (name === 'the river bend') return 0.17;
    // The mouth keeps a channel's width and opens only a little at the tide.
    if (name === 'the river mouth') return 0.13 + v * 0.045;
    return 0.15;
  }
  function inRiver(x, y, W, H) {
    var v = clamp(y / H, 0, 1);
    var name = sectionDef().name;
    var centre = riverCentre(v, name) * W;
    var half = riverHalfWidth(v, name) * W;
    return Math.abs(x - centre) < half;
  }

  function drawRiver(d, W, H) {
    var name = d.name || '';
    var v, i;

    // The banks first: a strip of shingle along each edge of the channel, a
    // little paler than the grass, so the water has a shore to lie in. A thick
    // stroke down each bank line is a strip that follows the bend.
    ctx.strokeStyle = 'rgba(206,194,156,0.45)';
    ctx.lineWidth = 30;
    ctx.lineCap = 'butt';
    for (var bside = -1; bside <= 1; bside += 2) {
      ctx.beginPath();
      for (v = 0; v <= 1.001; v += 0.02) {
        var cb0 = riverCentre(v, name) * W, hb0 = riverHalfWidth(v, name) * W;
        var bxb = cb0 + bside * (hb0 + 12);
        if (v === 0) ctx.moveTo(bxb, 0); else ctx.lineTo(bxb, v * H);
      }
      ctx.stroke();
    }

    // The water: one band down the page, deep in the middle and pale at the
    // edges, so it reads as a channel and not a painted stripe.
    ctx.beginPath();
    for (v = 0; v <= 1.001; v += 0.02) {
      var c2 = riverCentre(v, name) * W, h2 = riverHalfWidth(v, name) * W;
      if (v === 0) ctx.moveTo(c2 - h2, 0); else ctx.lineTo(c2 - h2, v * H);
    }
    for (v = 1; v >= -0.001; v -= 0.02) {
      var c3 = riverCentre(v, name) * W, h3 = riverHalfWidth(v, name) * W;
      ctx.lineTo(c3 + h3, v * H);
    }
    ctx.closePath();
    var rg = ctx.createLinearGradient(0, 0, W, 0);
    rg.addColorStop(0, '#7FA9A6');
    rg.addColorStop(0.5, '#6B9A9C');
    rg.addColorStop(1, '#5C8A90');
    ctx.fillStyle = rg;
    ctx.fill();

    // The current: short crests drifting down the channel, each one a little
    // out of step with its neighbours.
    ctx.save();
    ctx.beginPath();
    for (v = 0; v <= 1.001; v += 0.02) {
      var c4 = riverCentre(v, name) * W, h4 = riverHalfWidth(v, name) * W;
      if (v === 0) ctx.moveTo(c4 - h4, 0); else ctx.lineTo(c4 - h4, v * H);
    }
    for (v = 1; v >= -0.001; v -= 0.02) {
      var c5 = riverCentre(v, name) * W, h5 = riverHalfWidth(v, name) * W;
      ctx.lineTo(c5 + h5, v * H);
    }
    ctx.closePath();
    ctx.clip();
    ctx.strokeStyle = 'rgba(232,246,244,0.38)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (i = 0; i < 16; i++) {
      var tv = ((i * 0.068 + (clock * 0.045) % 0.068)) % 1;
      var cc = riverCentre(tv, name) * W;
      var hw = riverHalfWidth(tv, name) * W;
      var off = ((i * 37) % 100) / 100 * 2 - 1;
      var cx0 = cc + off * hw * 0.72;
      var len = hw * (0.22 + ((i * 13) % 10) / 30);
      ctx.beginPath();
      ctx.moveTo(cx0 - len, tv * H);
      ctx.quadraticCurveTo(cx0, tv * H - 5, cx0 + len, tv * H);
      ctx.stroke();
    }
    // The glint of the sky on the water: a broken path of dashes down the
    // middle, the way sunlight lies on a moving channel.
    ctx.strokeStyle = 'rgba(255,252,240,0.30)';
    ctx.lineWidth = 3;
    for (i = 0; i < 12; i++) {
      var gv = (i * 0.085 + (clock * 0.03) % 0.085) % 1;
      var gc = riverCentre(gv, name) * W;
      ctx.beginPath();
      ctx.moveTo(gc - 12, gv * H);
      ctx.lineTo(gc - 2, gv * H - 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(gc + 6, gv * H + 4);
      ctx.lineTo(gc + 16, gv * H + 1);
      ctx.stroke();
    }
    ctx.restore();

    // The bank line: a pale wet edge on each side, so the water meets the ground
    // on a drawn line rather than an abrupt colour change.
    ctx.strokeStyle = 'rgba(250,246,236,0.80)';
    ctx.lineWidth = 2.5;
    for (var side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      for (v = 0; v <= 1.001; v += 0.02) {
        var cb = riverCentre(v, name) * W;
        var hb = riverHalfWidth(v, name) * W;
        var bx = cb + side * hb;
        if (v === 0) ctx.moveTo(bx, 0); else ctx.lineTo(bx, v * H);
      }
      ctx.stroke();
    }

    // Stones in the shallows, some breaking the surface.
    var srnd = seeded(90210 + name.length * 7);
    for (i = 0; i < 10; i++) {
      var sv = 0.06 + srnd() * 0.88;
      var sc = riverCentre(sv, name) * W;
      var sh = riverHalfWidth(sv, name) * W;
      var sx = sc + (srnd() * 2 - 1) * sh * 0.82;
      var sy = sv * H;
      var sw = 5 + srnd() * 8;
      ctx.fillStyle = i % 3 ? '#9A9384' : '#ADA695';
      ctx.beginPath();
      ctx.ellipse(sx, sy, sw, sw * 0.55, srnd() * 3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(250,246,236,0.35)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + sw * 0.5, sw * 1.5, sw * 0.28, 0, 0, TAU);
      ctx.fill();
    }

    // Reeds along the near bank, in clumps, leaning with the current.
    var rrnd = seeded(4242 + name.length);
    for (i = 0; i < 14; i++) {
      var rv = 0.08 + rrnd() * 0.84;
      var rc = riverCentre(rv, name) * W;
      var rh = riverHalfWidth(rv, name) * W;
      var rx = rc - rh - 10 - rrnd() * 18;
      if (rx < 12) continue;
      var ry = rv * H;
      ctx.strokeStyle = i % 2 ? '#7E9A5E' : '#8CA868';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      for (var r = -2; r <= 2; r++) {
        ctx.beginPath();
        ctx.moveTo(rx + r * 3, ry);
        ctx.quadraticCurveTo(rx + r * 5 + 5, ry - 20, rx + r * 6 + 9, ry - 38 - Math.abs(r) * -3);
        ctx.stroke();
      }
    }
  }

  /* Is this point part of the water she can splash in, and how deep? 0 for dry
     ground, 1 for the middle of the channel. */
  function waterDepthAt(x, y) {
    var d = sectionDef();
    if (!d) return 0;
    var W = world.w, H = world.h;
    if (d.kind === 'river') {
      var v = clamp(y / H, 0, 1);
      var c = riverCentre(v, d.name) * W;
      var h = riverHalfWidth(v, d.name) * W;
      var out = Math.abs(x - c) - h;
      // In the channel: deeper toward the middle. At its edge: the shallows,
      // which reach a foot's length out onto the bank.
      if (out <= 0) return 1 + out / h * 0.6;
      return out < 44 ? 0.55 * (1 - out / 44) : 0;
    }
    if (d.kind === 'pond' || d.kind === 'stream') {
      var cx = W * 0.5, cy = H * 0.44, rx = W * 0.46, ry = H * 0.20;
      var dx = (x - cx) / rx, dy = (y - cy) / ry;
      var r = Math.sqrt(dx * dx + dy * dy);
      if (r <= 1) return 1 - r * 0.4;
      // The rim: 22 px of shallows beyond the ellipse.
      var rimX = (Math.sqrt(dx * dx + dy * dy) - 1) * rx;
      return rimX < 44 ? 0.45 * (1 - rimX / 44) : 0;
    }
    if (d.kind === 'openwater') {
      // Open water is water all the way to the edges: every step throws a ring.
      return 0.85;
    }
    if (d.kind === 'sea') {
      // The shallow edge of the sea: within a stride of the tide line.
      var sh = seaShore();
      var edge = Math.min(Math.abs(y - sh.top), Math.abs(x - sh.left));
      return edge < 30 ? 1 - edge / 30 : 0;
    }
    if (d.kind === 'beach') {
      // On a shore, the surf is the water: a step at its edge throws a ring.
      return isSurf(x, y, W, H) ? 0.6 : 0;
    }
    if (d.kind === 'lake') return 0;
    return 0;
  }

  /* Lay a step's ring where her foot lands, if there is water there. */
  function stepInto(dt, speed) {
    if (speed < 40) return;
    stepClock -= dt * (speed / 120);
    if (stepClock > 0) return;
    stepClock = 0.34;
    var depth = waterDepthAt(hero.x, hero.y + 28);
    if (depth <= 0.02) return;
    if (window.__ringDebug) window.__ringDebug.push({ x: hero.x, y: hero.y, d: depth });
    stepRing = { age: 0, x: hero.x + (Math.random() - 0.5) * 10, y: hero.y + 28, w: depth };
    // A few drops, higher where the water is deeper.
    for (var i = 0; i < 5; i++) {
      addParticles(stepRing.x, stepRing.y, 'rgba(226,246,246,0.9)', 1, 40 + depth * 60);
    }
  }

  /* Where the sun is, and what that means for the light and the shadows. */
  function dayLight() {
    var u = (day.t - day.sunRise) / (day.sunSet - day.sunRise);
    var up = u > 0 && u < 1 ? Math.sin(u * Math.PI) : 0;
    var angle = clamp(u, 0, 1) * Math.PI;
    // The sun's ground direction: east at dawn, south at noon, west at dusk.
    // A shadow points the opposite way.
    var sx = -Math.cos(angle);
    var sy = -Math.sin(angle);
    // 1 at the horizon, 0 at noon: longer shadows when the sun is low.
    var len = 1 / Math.max(0.26, up);
    // How golden it is: strongest when the sun is near the horizon.
    var warm = up > 0 ? Math.pow(1 - up, 1.5) : 0;
    return { u: u, up: up, angle: angle, sx: sx, sy: sy, len: len, warm: warm, night: up <= 0.03 };
  }

  /* The hour, as a person would say it. */
  function dayClock() {
    var hours = day.t * 24;
    var h = Math.floor(hours);
    var m = Math.floor((hours - h) * 60 / 5) * 5;
    var ampm = h < 12 ? 'am' : 'pm';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    var mm = m < 10 ? '0' + m : '' + m;
    return h12 + ':' + mm + ' ' + ampm;
  }

  /* Put the day at a given hour, for looking at the light. Console: __setDay(0.7)
     is seven tenths of the way through the day. */
  window.__setDay = function (t) { day.t = ((t % 1) + 1) % 1; return dayClock() + ' · ' + dayName(); };
  window.__day = function () { return JSON.stringify({ t: day.t, clock: dayClock(), part: dayName(), light: dayLight() }); };

  /* What part of the day it is, in the island's voice. */
  function dayName() {
    var h = day.t * 24;
    if (h < 4.5) return 'night';
    if (h < 6.5) return 'first light';
    if (h < 10) return 'morning';
    if (h < 13.5) return 'midday';
    if (h < 16.5) return 'afternoon';
    if (h < 19) return 'the golden hour';
    if (h < 21) return 'dusk';
    return 'night';
  }

  /* The shadow this thing lays on the ground, from the one sun. w is how wide the
     thing is drawn; a tree lays a longer, softer shadow than a daisy because the
     shadow is made from the same width the drawing uses. */

  var GROUND_SQUASH = 0.30;

  function castShadow(x, y, w, strength, h) {
    var L = dayLight();
    if (L.night) return;
    var len = clamp(L.len, 0.55, 3.1);
    // The sun's direction, projected onto a ground plane seen at an angle.
    var dirX = L.sx, dirY = L.sy * GROUND_SQUASH;
    var dirLen = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
    dirX /= dirLen; dirY /= dirLen;
    var ang = Math.atan2(dirY, dirX);
    // A shadow is a projection. Its reach along the sun's line is the thing's
    // height divided by tan(elevation); its half-width across that line is half
    // the thing's own width. So a person at dawn lays a long thin band, and at
    // noon a round puddle - the two must not look alike.
    var height = (h === undefined || h === null) ? w : h;
    height = Math.min(height, 220);
    var low = clamp(len, 1, 3.1);
    // Half the length down the sun's line: a share of the thing's height, and it
    // grows steeply as the sun drops - a short puddle at noon, a long band at dawn.
    var rx = Math.min(115, height * (0.16 + 0.55 * (low - 1)));
    // Half the width across it: a share of the thing's own width, so a broad thing
    // lays a broad shadow and a narrow one a thin band.
    var ry = Math.min(26, Math.max(4, w * 0.30));
    // The near edge sits exactly at the feet, so the shadow falls only away from her.
    var offset = rx;
    var cx = x + dirX * offset;
    var cy = y + dirY * offset;
    var a = (strength === undefined || strength === null ? 0.26 : strength)
      * (0.55 + 0.45 * Math.min(1, L.up * 1.6));
    ctx.save();
    // ONE ellipse, and it turns with the sun like everything else. Its near edge
    // already reaches under the feet, so the body is planted by the shadow's own
    // shape.
    ctx.fillStyle = 'rgba(34,42,24,' + Math.min(0.24, a * 0.95).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, ang, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* The pond's own shape, as a share of the page: a wide ellipse in the middle
     of a green bank. Both views use these numbers, so the pond in the island and
     the pond you fish cannot drift apart. */
  function pondShape(W, H) {
    return { cx: W * 0.5, cy: H * 0.46, rx: W * 0.47, ry: H * 0.215 };
  }
  var POND_WATER = '#7FA3A6';

  /* ---------------------------------------------------------------------------
     THE SHORE. Water on the side that leads to the sea, a wet sand band in front
     of it, surf where the two meet, and the tide's own debris along the line.
     --------------------------------------------------------------------------- */
  /* Which edge of this section the sea is on, as a direction: {dx, dy}. The open
     edge with a sea neighbour wins; with none, the sea lies east, inland of the
     strand. */
  function shoreSide() {
    var dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]];
    for (var i = 0; i < dirs.length; i++) {
      var n = SECTIONS[sectionId(section.cx + dirs[i][0], section.cy + dirs[i][1])];
      if (n && n.kind === 'sea') return { dx: dirs[i][0], dy: dirs[i][1] };
    }
    return { dx: 1, dy: 0 };
  }

  /* How far the wet sand reaches in from the seaward edge, per page. */
  function tideLine(W, H) {
    var sd = shoreSide();
    return sd.dx !== 0 ? W * 0.30 : H * 0.26;
  }

  /* Is this point shingle - the sand she may stand on - rather than surf? */
  /* The water's edge, as drawn: the sea occupies the whole band, so anything at
     or beyond it is in the water. */
  function isSurf(x, y, W, H) {
    var sd = shoreSide();
    var band = tideLine(W, H);
    if (sd.dx > 0) return x > W - band;
    if (sd.dx < 0) return x < band;
    if (sd.dy > 0) return y > H - band;
    return y < band;
  }

  /* ---------------------------------------------------------------------------
     THE OPEN WATER. Water to every edge: no sand, no bank, no shore to stand on.
     The island lies low and far behind her, the swell is long and slow, and the
     only way she is here at all is the boat.
     --------------------------------------------------------------------------- */
  function drawOpenWater(d, W, H) {
    var ow = ctx.createLinearGradient(0, 0, 0, H);
    ow.addColorStop(0, '#7FB0BE');
    ow.addColorStop(0.30, '#3D8494');
    ow.addColorStop(0.72, '#2A6E7E');
    ow.addColorStop(1, '#1F5A69');
    ctx.fillStyle = ow;
    ctx.fillRect(0, 0, W, H);

    // Long swells, running the width of the page, widening as they come near.
    for (var ows = 0; ows < 14; ows++) {
      var ot = ows / 13;
      var oy = 24 + ot * ot * (H - 80);
      var oamp = 2 + ot * 10;
      var odrift = Math.sin(clock * 0.55 + ows * 0.8) * (5 + ot * 16);
      ctx.strokeStyle = 'rgba(214,240,238,' + (0.20 - ot * 0.10).toFixed(3) + ')';
      ctx.lineWidth = 1.2 + ot * 2.8;
      ctx.beginPath();
      ctx.moveTo(-20, oy);
      ctx.quadraticCurveTo(W * 0.30 + odrift, oy - oamp, W * 0.55, oy);
      ctx.quadraticCurveTo(W * 0.80 + odrift, oy + oamp, W + 20, oy);
      ctx.stroke();
    }
    // Glints on the near swell.
    for (var owg = 0; owg < 30; owg++) {
      var owx = (owg * 137) % W;
      var owy = 50 + ((owg * 91) % (H - 130));
      var owb = Math.sin(clock * 1.5 + owg * 2.3);
      if (owb < 0.4) continue;
      ctx.fillStyle = 'rgba(232,252,248,' + ((owb - 0.4) * 0.44).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(owx, owy, 10, 2.4, 0, 0, TAU);
      ctx.fill();
    }

    // The island, low and far behind her: two hazy ridges, the far one paler.
    ctx.fillStyle = 'rgba(150,170,150,0.28)';
    ctx.beginPath();
    ctx.moveTo(-10, H * 0.105);
    ctx.quadraticCurveTo(W * 0.30, H * 0.052, W * 0.62, H * 0.105);
    ctx.quadraticCurveTo(W * 0.85, H * 0.125, W + 10, H * 0.10);
    ctx.lineTo(W + 10, H * 0.115);
    ctx.lineTo(-10, H * 0.115);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(96,122,100,0.42)';
    ctx.beginPath();
    ctx.moveTo(-10, H * 0.128);
    ctx.quadraticCurveTo(W * 0.24, H * 0.082, W * 0.50, H * 0.128);
    ctx.quadraticCurveTo(W * 0.32, H * 0.152, -10, H * 0.140);
    ctx.closePath();
    ctx.fill();
    // A pale shore line where the island meets the water.
    ctx.strokeStyle = 'rgba(240,246,238,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, H * 0.140);
    ctx.quadraticCurveTo(W * 0.28, H * 0.118, W * 0.54, H * 0.140);
    ctx.stroke();
  }

  function drawBeach(d, W, H) {
    var sd = shoreSide();
    var band = tideLine(W, H);
    var horizontal = sd.dx !== 0;

    // The water, a band along the seaward edge, deep at the horizon side and
    // lighter as it shallows onto the sand.
    var wet = horizontal
      ? (sd.dx > 0 ? W - band : 0)
      : (sd.dy > 0 ? H - band : 0);
    var seaG = horizontal
      ? ctx.createLinearGradient(sd.dx > 0 ? W : 0, 0, sd.dx > 0 ? W - band : band, 0)
      : ctx.createLinearGradient(0, sd.dy > 0 ? H : 0, 0, sd.dy > 0 ? H - band : band);
    seaG.addColorStop(0, '#5C8A90');
    seaG.addColorStop(0.55, '#79A6A6');
    seaG.addColorStop(1, '#A8C6C0');
    ctx.fillStyle = seaG;
    if (horizontal) ctx.fillRect(sd.dx > 0 ? W - band : 0, 0, band, H);
    else ctx.fillRect(0, sd.dy > 0 ? H - band : 0, W, band);

    // The surf: three broken lines of foam where the water reaches the sand,
    // each a little further in, so the tide has depth.
    ctx.save();
    ctx.beginPath();
    if (horizontal) ctx.rect(sd.dx > 0 ? W - band : 0, 0, band, H);
    else ctx.rect(0, sd.dy > 0 ? H - band : 0, W, band);
    ctx.clip();
    // ---- The swell: wide, soft bands of paler water, gently bowed and lying
    // parallel to the shore. The sea from above is mostly flat; what you see is
    // long low swells, not lines.
    var bandCount = 7;
    for (var b2 = 0; b2 < bandCount; b2++) {
      var alongB = (b2 + 0.5) / bandCount * (horizontal ? H : W);
      var phase = Math.sin(clock * 0.6 + b2 * 1.7) * 7;
      var near = horizontal
        ? (sd.dx > 0 ? W - band * 0.10 : band * 0.10)
        : (sd.dy > 0 ? H - band * 0.10 : band * 0.10);
      var far2 = horizontal
        ? (sd.dx > 0 ? W + 6 : -6)
        : (sd.dy > 0 ? H + 6 : -6);
      var span = Math.abs(far2 - near);

      ctx.save();
      // The band's own body: a wide, very soft stroke.
      ctx.strokeStyle = 'rgba(220,242,236,0.13)';
      ctx.lineWidth = 16 + ((b2 * 13) % 9);
      ctx.lineCap = 'round';
      ctx.beginPath();
      if (horizontal) {
        var yb = alongB + phase;
        ctx.moveTo(near, yb + Math.sin(b2 * 2) * 5);
        ctx.quadraticCurveTo(near + span * 0.45, yb - 9, near + span * 0.8, yb + 3);
        ctx.quadraticCurveTo(far2, yb + Math.cos(b2) * 4, far2, yb);
      } else {
        var xb = alongB + phase;
        ctx.moveTo(xb + Math.sin(b2 * 2) * 5, near);
        ctx.quadraticCurveTo(xb - 9, near + span * 0.45, xb + 3, near + span * 0.8);
        ctx.quadraticCurveTo(xb + Math.cos(b2) * 4, far2, xb, far2);
      }
      ctx.stroke();
      // A paler band just beyond it, so the swell has a far side and a near side.
      ctx.strokeStyle = 'rgba(246,254,250,0.10)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      if (horizontal) {
        var yc = alongB + phase + 9;
        ctx.moveTo(near, yc);
        ctx.quadraticCurveTo(near + span * 0.45, yc - 8, near + span * 0.8, yc + 2);
        ctx.quadraticCurveTo(far2, yc + 2, far2, yc);
      } else {
        var xc = alongB + phase + 9;
        ctx.moveTo(xc, near);
        ctx.quadraticCurveTo(xc - 8, near + span * 0.45, xc + 2, near + span * 0.8);
        ctx.quadraticCurveTo(xc + 2, far2, xc, far2);
      }
      ctx.stroke();
      ctx.restore();
    }

    // ---- The foam: continuous wobbly lines at the waterline, two of them, the
    // outer washing in and out on its own slow beat, with one gap where it has
    // drawn back. Continuous, because foam is; a run of equal dashes reads as
    // rain.
    for (var f = 0; f < 2; f++) {
      var inset = band * (0.055 + f * 0.075 + Math.sin(clock * 0.42 + f * 2.1) * 0.012);
      var edgeF = horizontal
        ? (sd.dx > 0 ? W - inset : inset)
        : (sd.dy > 0 ? H - inset : inset);
      ctx.strokeStyle = 'rgba(255,255,252,' + (0.86 - f * 0.30).toFixed(2) + ')';
      ctx.lineWidth = 4.6 - f * 1.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      var lenF = horizontal ? H : W;
      ctx.beginPath();
      var drawing = false;
      for (var q = 0; q <= lenF; q += 6) {
        // One gap in the foam, where the water has drawn back.
        var gapAt = lenF * (0.34 + f * 0.28);
        var inGap = Math.abs(q - gapAt) < 46;
        if (inGap) { drawing = false; continue; }
        var wob = Math.sin(q * 0.019 + clock * 0.5 + f * 1.1) * (7 - f * 1.5)
          + Math.sin(q * 0.061 + f) * 2.4;
        if (horizontal) {
          if (!drawing) { ctx.moveTo(edgeF + wob, q); drawing = true; }
          else ctx.lineTo(edgeF + wob, q);
        } else {
          if (!drawing) { ctx.moveTo(q, edgeF + wob); drawing = true; }
          else ctx.lineTo(q, edgeF + wob);
        }
      }
      ctx.stroke();
    }

    // The shallows: the water paling as it comes onto the sand.
    var shal = horizontal
      ? ctx.createLinearGradient(sd.dx > 0 ? W - band * 0.34 : 0, 0, sd.dx > 0 ? W : band * 0.34, 0)
      : ctx.createLinearGradient(0, sd.dy > 0 ? H - band * 0.34 : 0, 0, sd.dy > 0 ? H : band * 0.34);
    shal.addColorStop(0, 'rgba(186,214,206,0)');
    shal.addColorStop(1, 'rgba(206,230,220,0.55)');
    ctx.fillStyle = shal;
    if (horizontal) ctx.fillRect(sd.dx > 0 ? W - band * 0.34 : 0, 0, band * 0.34, H);
    else ctx.fillRect(0, sd.dy > 0 ? H - band * 0.34 : 0, W, band * 0.34);
    ctx.restore();

    // The tide line: a pale wet band of sand just inside the surf, then the dark
    // line where the last wave stopped.
    var wetEdge = horizontal
      ? (sd.dx > 0 ? W - band : 0)
      : (sd.dy > 0 ? H - band : 0);
    ctx.save();
    var wetG = horizontal
      ? ctx.createLinearGradient(wetEdge, 0, wetEdge + sd.dx * band * 0.7, 0)
      : ctx.createLinearGradient(0, wetEdge, 0, wetEdge + sd.dy * band * 0.7);
    wetG.addColorStop(0, 'rgba(150,140,110,0.42)');
    wetG.addColorStop(1, 'rgba(150,140,110,0)');
    ctx.fillStyle = wetG;
    if (horizontal) ctx.fillRect(sd.dx > 0 ? W - band * 1.7 : 0, 0, band * 1.7, H);
    else ctx.fillRect(0, sd.dy > 0 ? H - band * 1.7 : 0, W, band * 1.7);
    ctx.restore();

    // The waterline: a pale foam edge that follows a wave, so the sand meets the
    // sea on a drawn line and not on a ruler's.
    ctx.strokeStyle = 'rgba(252,252,246,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    if (horizontal) {
      var ex2 = sd.dx > 0 ? W - band : band;
      for (var yy = 0; yy <= H; yy += 12) {
        var wx2 = ex2 + Math.sin(yy * 0.019 + 0.7) * 9 + Math.sin(yy * 0.052) * 3;
        if (yy === 0) ctx.moveTo(wx2, yy); else ctx.lineTo(wx2, yy);
      }
    } else {
      var ey2 = sd.dy > 0 ? H - band : band;
      for (var xx = 0; xx <= W; xx += 12) {
        var wy2 = ey2 + Math.sin(xx * 0.019 + 0.7) * 9 + Math.sin(xx * 0.052) * 3;
        if (xx === 0) ctx.moveTo(xx, wy2); else ctx.lineTo(xx, wy2);
      }
    }
    ctx.stroke();

    // The tide's debris along the line: shells, weed, a length of rope, a stone
    // worn round by the water. This is what says "shore" and not "sand".
    var drnd = seeded(8821);
    for (var dd = 0; dd < 26; dd++) {
      var along = drnd();
      var out = (drnd() - 0.3) * band * 0.55;
      var dxp = horizontal
        ? (sd.dx > 0 ? W - band + out : band - out)
        : along * W;
      var dyp = horizontal
        ? along * H
        : (sd.dy > 0 ? H - band + out : band - out);
      var kind = dd % 4;
      if (kind === 0) {
        // A shell: a small fan.
        ctx.fillStyle = dd % 8 === 0 ? '#F2E8D4' : '#E0CFB2';
        ctx.beginPath();
        ctx.ellipse(dxp, dyp, 6 + drnd() * 4, 4 + drnd() * 3, drnd() * 3, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(150,130,100,0.45)';
        ctx.lineWidth = 0.9;
        ctx.stroke();
      } else if (kind === 1) {
        // Weed.
        ctx.strokeStyle = 'rgba(96,116,70,0.80)';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(dxp - 8, dyp);
        ctx.quadraticCurveTo(dxp, dyp - 5, dxp + 9, dyp + 2);
        ctx.stroke();
      } else if (kind === 2) {
        // A worn pebble.
        ctx.fillStyle = '#BDB49C';
        ctx.beginPath();
        ctx.ellipse(dxp, dyp, 4 + drnd() * 4, 3 + drnd() * 3, drnd() * 3, 0, TAU);
        ctx.fill();
      } else {
        // A dry line the last wave left.
        ctx.strokeStyle = 'rgba(255,252,244,0.35)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(dxp - 12, dyp);
        ctx.quadraticCurveTo(dxp, dyp + 4, dxp + 12, dyp);
        ctx.stroke();
      }
    }
  }

  /* ---------------------------------------------------------------------------
     THE STREAM. Running water crossing the section, not a still pond: a band with
     two banks, current that travels, stones breaking it, and the can's own spot on
     the bank. The band's centre and width are ONE pair of functions, so the water
     and the walk test agree.
     --------------------------------------------------------------------------- */
  function streamCentre(v) { return 0.46 + Math.sin(v * 2.1) * 0.10; }
  function streamHalf(v) { return 0.17 + Math.sin(v * 1.4 + 1.1) * 0.028; }
  function inStream(x, y, W, H) {
    var v = clamp(y / H, 0, 1);
    var c = streamCentre(v) * W, hw = streamHalf(v) * W;
    return Math.abs(x - c) < hw;
  }

  function drawStream(d, W, H) {
    var v, i;
    // The banks: a wet strip on each side, then the water.
    ctx.strokeStyle = 'rgba(150,142,108,0.50)';
    ctx.lineWidth = 26;
    ctx.lineCap = 'butt';
    for (var bs = -1; bs <= 1; bs += 2) {
      ctx.beginPath();
      for (v = 0; v <= 1.001; v += 0.02) {
        var bxc = streamCentre(v) * W + bs * (streamHalf(v) * W + 10);
        if (v === 0) ctx.moveTo(bxc, 0); else ctx.lineTo(bxc, v * H);
      }
      ctx.stroke();
    }
    // The water.
    ctx.beginPath();
    for (v = 0; v <= 1.001; v += 0.02) {
      var c0 = streamCentre(v) * W, h0 = streamHalf(v) * W;
      if (v === 0) ctx.moveTo(c0 - h0, 0); else ctx.lineTo(c0 - h0, v * H);
    }
    for (v = 1; v >= -0.001; v -= 0.02) {
      var c1 = streamCentre(v) * W, h1 = streamHalf(v) * W;
      ctx.lineTo(c1 + h1, v * H);
    }
    ctx.closePath();
    var wg = ctx.createLinearGradient(W * 0.2, 0, W * 0.8, 0);
    wg.addColorStop(0, '#8FB0B0');
    wg.addColorStop(0.5, POND_WATER);
    wg.addColorStop(1, '#69939A');
    ctx.fillStyle = wg;
    ctx.fill();

    // The current: dashes that travel DOWN the stream, faster than a river's,
    // because a stream is quick water.
    ctx.save();
    ctx.beginPath();
    for (v = 0; v <= 1.001; v += 0.02) {
      var c2 = streamCentre(v) * W, h2 = streamHalf(v) * W;
      if (v === 0) ctx.moveTo(c2 - h2, 0); else ctx.lineTo(c2 - h2, v * H);
    }
    for (v = 1; v >= -0.001; v -= 0.02) {
      var c3 = streamCentre(v) * W, h3 = streamHalf(v) * W;
      ctx.lineTo(c3 + h3, v * H);
    }
    ctx.closePath();
    ctx.clip();
    ctx.strokeStyle = 'rgba(236,250,248,0.55)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (i = 0; i < 20; i++) {
      var tv = ((i * 0.055 + (clock * 0.30) % 0.055)) % 1;
      var cc = streamCentre(tv) * W, hw = streamHalf(tv) * W;
      var off = ((i * 37) % 100) / 100 * 2 - 1;
      var x0 = cc + off * hw * 0.78;
      var len = hw * (0.16 + ((i * 13) % 10) / 40);
      ctx.beginPath();
      ctx.moveTo(x0 - len, tv * H);
      ctx.quadraticCurveTo(x0, tv * H - 4, x0 + len, tv * H);
      ctx.stroke();
    }
    ctx.restore();

    // Stones breaking the surface, each with its ring of water.
    var srnd = seeded(6161);
    for (i = 0; i < 9; i++) {
      var sv = 0.08 + srnd() * 0.84;
      var sc = streamCentre(sv) * W, sh = streamHalf(sv) * W;
      var sx = sc + (srnd() * 2 - 1) * sh * 0.7;
      var sy = sv * H;
      var r = 5 + srnd() * 7;
      ctx.fillStyle = i % 3 ? '#9A9384' : '#ADA695';
      ctx.beginPath();
      ctx.ellipse(sx, sy, r, r * 0.6, srnd() * 3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(250,248,238,0.45)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + r * 0.55, r * 1.6, r * 0.30, 0, 0, TAU);
      ctx.fill();
    }

    // Reeds and grass on the banks, where the water leaves them wet.
    var rrnd = seeded(7070);
    for (i = 0; i < 16; i++) {
      var rv = 0.06 + rrnd() * 0.88;
      var rc = streamCentre(rv) * W, rh = streamHalf(rv) * W;
      for (var side = -1; side <= 1; side += 2) {
        var rx = rc + side * (rh + 14 + rrnd() * 10);
        if (rx < 10 || rx > W - 10) continue;
        ctx.strokeStyle = side < 0 ? '#7E9A5E' : '#8CA868';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        for (var t2 = -1; t2 <= 1; t2++) {
          ctx.beginPath();
          ctx.moveTo(rx + t2 * 3, rv * H);
          ctx.quadraticCurveTo(rx + t2 * 5 + 4, rv * H - 12, rx + t2 * 6 + 7, rv * H - 24);
          ctx.stroke();
        }
      }
    }
  }

  function drawBiomeGround(d) {
    var W = world.w, H = world.h;
    var pal = groundPalette(d.kind);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, pal[0]);
    g.addColorStop(0.5, pal[1]);
    g.addColorStop(1, pal[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (interior === 'house') {
      // A room: a wall along the top, boards to the bottom, a rug on the floor.
      var wallH = H * 0.30;
      ctx.fillStyle = '#F1E7D2';
      ctx.fillRect(0, 0, W, wallH);
      ctx.fillStyle = 'rgba(150,120,84,0.22)';
      ctx.fillRect(0, wallH - 10, W, 10);
      ctx.fillStyle = '#8A6640';
      ctx.fillRect(0, wallH, W, H - wallH);
      for (var b = 0; b * 74 < H - wallH; b++) {
        ctx.fillStyle = 'rgba(60,40,24,0.18)';
        ctx.fillRect(0, wallH + b * 74, W, 2);
        ctx.fillStyle = b % 2 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
        ctx.fillRect(0, wallH + b * 74 + 2, W, 72);
      }
      // The way out: a doorway at the foot of the room, where she came in.
      ctx.fillStyle = '#F1E7D2';
      ctx.fillRect(W * 0.5 - 62, H - 14, 124, 14);
      ctx.fillStyle = '#5E4227';
      ctx.beginPath();
      ctx.moveTo(W * 0.5 - 58, H);
      ctx.lineTo(W * 0.5 - 58, H - 74);
      ctx.quadraticCurveTo(W * 0.5, H - 108, W * 0.5 + 58, H - 74);
      ctx.lineTo(W * 0.5 + 58, H);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,236,190,0.35)';
      ctx.beginPath();
      ctx.moveTo(W * 0.5 - 46, H);
      ctx.lineTo(W * 0.5 - 46, H - 66);
      ctx.quadraticCurveTo(W * 0.5, H - 94, W * 0.5 + 46, H - 66);
      ctx.lineTo(W * 0.5 + 46, H);
      ctx.closePath();
      ctx.fill();
      // The rug.
      ctx.fillStyle = '#B4553F';
      roundRect(W * 0.5 - 150, H * 0.60, 300, 190, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(247,244,238,0.5)';
      ctx.lineWidth = 3;
      roundRect(W * 0.5 - 132, H * 0.615, 264, 154, 10);
      ctx.stroke();
      return;
    }

    // Mown grass: paler, and lying the same way - strokes, not a wash of white.
    // Two patches, each a rounded area of short flat blades.
    var mown = [[W * 0.30, H * 0.34, W * 0.30, H * 0.12, -0.2],
      [W * 0.74, H * 0.68, W * 0.26, H * 0.10, 0.3]];
    for (var mn = 0; mn < mown.length; mn++) {
      var mx = mown[mn][0], my = mown[mn][1];
      var mrx = mown[mn][2], mry = mown[mn][3], ma = mown[mn][4];
      ctx.save();
      ctx.translate(mx, my);
      ctx.rotate(ma);
      // The paler ground, no hard edge: two stops out.
      var mg = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(mrx, 1));
      mg.addColorStop(0, 'rgba(196,214,150,0.20)');
      mg.addColorStop(0.72, 'rgba(196,214,150,0.10)');
      mg.addColorStop(1, 'rgba(196,214,150,0)');
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.ellipse(0, 0, mrx, mry, 0, 0, TAU);
      ctx.fill();
      // The short mown blades, all leaning the same way.
      ctx.strokeStyle = 'rgba(190,208,146,0.45)';
      ctx.lineWidth = 1.3;
      ctx.lineCap = 'round';
      for (var mb = 0; mb < 46; mb++) {
        var ba = (mb * 2.399) % TAU;
        var br = Math.sqrt((mb * 0.618) % 1);
        var bxx = Math.cos(ba) * mrx * br;
        var byy = Math.sin(ba) * mry * br;
        ctx.beginPath();
        ctx.moveTo(bxx, byy);
        ctx.lineTo(bxx + 3.2, byy - 1.2);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (d.kind === 'glass') {
      // The standing bed: a kerbed rectangle of gravel in front of the glass,
      // with grit you can see. Not a pale oval, which reads as a puddle.
      var bedY = H * 0.38, bedH = H * 0.30, bedW = W * 0.56;
      var bedX = W * 0.5 - bedW / 2;
      // The gravel, its edges fading into the grass: a swept area is a change of
      // ground, not a rectangle of paper laid on it.
      var gravG = ctx.createLinearGradient(bedX, 0, bedX + bedW, 0);
      gravG.addColorStop(0, 'rgba(198,191,166,0)');
      gravG.addColorStop(0.06, 'rgba(198,191,166,0.92)');
      gravG.addColorStop(0.94, 'rgba(198,191,166,0.92)');
      gravG.addColorStop(1, 'rgba(198,191,166,0)');
      ctx.fillStyle = gravG;
      var gravV = ctx.createLinearGradient(0, bedY, 0, bedY + bedH);
      gravV.addColorStop(0, 'rgba(198,191,166,0)');
      gravV.addColorStop(0.10, 'rgba(198,191,166,1)');
      gravV.addColorStop(0.90, 'rgba(198,191,166,1)');
      gravV.addColorStop(1, 'rgba(198,191,166,0)');
      ctx.fillStyle = gravG;
      roundRect(bedX, bedY, bedW, bedH, 18);
      ctx.fill();
      ctx.globalCompositeOperation = 'destination-out';
      var fadeT = ctx.createLinearGradient(0, bedY, 0, bedY + bedH);
      fadeT.addColorStop(0, 'rgba(0,0,0,1)');
      fadeT.addColorStop(0.08, 'rgba(0,0,0,0)');
      fadeT.addColorStop(0.92, 'rgba(0,0,0,0)');
      fadeT.addColorStop(1, 'rgba(0,0,0,1)');
      ctx.fillStyle = fadeT;
      ctx.fillRect(bedX, bedY, bedW, bedH);
      ctx.globalCompositeOperation = 'source-over';
      // The grit.
      var grnd = seeded(3141);
      for (var gq = 0; gq < 220; gq++) {
        var gqx = bedX + 6 + grnd() * (bedW - 12);
        var gqy = bedY + 6 + grnd() * (bedH - 12);
        ctx.fillStyle = grnd() > 0.5 ? 'rgba(160,152,130,0.55)' : 'rgba(212,206,190,0.65)';
        ctx.beginPath();
        ctx.ellipse(gqx, gqy, 1.4 + grnd() * 1.8, 1.1 + grnd() * 1.2, grnd() * 3, 0, TAU);
        ctx.fill();
      }
      // Its shadow onto the grass, so the bed sits on the ground.
      ctx.fillStyle = 'rgba(40,48,28,0.10)';
      ctx.fillRect(bedX + 5, bedY + bedH, bedW - 10, 7);

      // The structure: a long low greenhouse, glass panes over a painted frame,
      // with a pitched roof and an open door at its centre.
      var gy = H * 0.30, gw = W * 0.86;
      var gx = W * 0.5 - gw / 2;
      // The frame's shadow on the ground.
      ctx.fillStyle = 'rgba(40,48,28,0.16)';
      ctx.beginPath();
      ctx.ellipse(W * 0.5, gy + 8, gw * 0.52, 20, 0, 0, TAU);
      ctx.fill();
      // Glass, two tones so it reads as panes.
      var gg = ctx.createLinearGradient(0, gy - H * 0.20, 0, gy);
      gg.addColorStop(0, '#DCE8E2');
      gg.addColorStop(0.55, '#E9F1EC');
      gg.addColorStop(1, '#CFE0D8');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx, gy - H * 0.115);
      ctx.lineTo(W * 0.5, gy - H * 0.20);
      ctx.lineTo(gx + gw, gy - H * 0.115);
      ctx.lineTo(gx + gw, gy);
      ctx.closePath();
      ctx.fill();
      // The frame, in the greenhouse's own paint.
      ctx.strokeStyle = '#8CA79C';
      ctx.lineWidth = 3.4;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.strokeStyle = 'rgba(120,150,140,0.55)';
      ctx.lineWidth = 1.6;
      // Uprights and glazing bars.
      for (var gi = 1; gi < 8; gi++) {
        var gpx = gx + gw * (gi / 8);
        var roofY = gy - H * 0.115 - (H * 0.085) * (1 - Math.abs(gi / 8 - 0.5) * 2);
        ctx.beginPath();
        ctx.moveTo(gpx, gy);
        ctx.lineTo(gpx, roofY);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(gx, gy - H * 0.055);
      ctx.lineTo(gx + gw, gy - H * 0.055);
      ctx.stroke();
      // The ridge, and its finial.
      ctx.strokeStyle = '#8CA79C';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W * 0.5, gy - H * 0.20);
      ctx.lineTo(W * 0.5, gy - H * 0.215);
      ctx.stroke();
      // An open doorway at the centre, dark, for depth.
      ctx.fillStyle = 'rgba(70,86,76,0.42)';
      ctx.beginPath();
      ctx.moveTo(W * 0.5 - 22, gy);
      ctx.lineTo(W * 0.5 - 22, gy - H * 0.075);
      ctx.quadraticCurveTo(W * 0.5, gy - H * 0.098, W * 0.5 + 22, gy - H * 0.075);
      ctx.lineTo(W * 0.5 + 22, gy);
      ctx.closePath();
      ctx.fill();
      // Plants showing through the glass: a few green masses behind the panes.
      ctx.fillStyle = 'rgba(126,164,110,0.42)';
      var gprnd = seeded(9901);
      for (var gp = 0; gp < 7; gp++) {
        var gpx2 = gx + gw * (0.10 + gprnd() * 0.80);
        var gpy = gy - H * 0.035 - gprnd() * H * 0.055;
        ctx.beginPath();
        ctx.ellipse(gpx2, gpy, 12 + gprnd() * 10, 9 + gprnd() * 7, 0, 0, TAU);
        ctx.fill();
      }
    };

    if (d.kind === 'sea') {
      // The water first, everywhere, then the shingle laid over it along the two
      // edges she comes in by. Drawn in that order so the shore always wins.
      var sea = ctx.createLinearGradient(0, 0, W * 0.55, H);
      sea.addColorStop(0, '#8FB6B4');
      sea.addColorStop(0.45, '#6E9A9C');
      sea.addColorStop(1, '#547F88');
      ctx.fillStyle = sea;
      ctx.fillRect(0, 0, W, H);

      // The horizon: the far water goes pale and flat toward the south and east,
      // where the island ends.
      var far = ctx.createLinearGradient(W * 0.55, H * 0.45, W, H);
      far.addColorStop(0, 'rgba(174,203,199,0)');
      far.addColorStop(1, 'rgba(196,220,214,0.85)');
      ctx.fillStyle = far;
      ctx.fillRect(0, 0, W, H);

      // Swell: long shallow crests, drifting in time, thinning toward the shore
      // and crowding at the horizon.
      ctx.strokeStyle = 'rgba(226,242,240,0.30)';
      ctx.lineCap = 'round';
      for (var sw = 0; sw < 26; sw++) {
        var t = sw / 25;
        var sy = H * (0.10 + t * t * 0.92);
        var drift = Math.sin(clock * 0.9 + sw * 0.7) * (8 + sw * 0.7);
        ctx.lineWidth = 1.2 + t * 2.2;
        ctx.beginPath();
        ctx.moveTo(-30, sy);
        ctx.quadraticCurveTo(W * 0.25 + drift, sy - 6 - t * 8, W * 0.5 + drift, sy);
        ctx.quadraticCurveTo(W * 0.75 + drift, sy + 6 + t * 8, W + 30, sy);
        ctx.stroke();
      }

      // The shingle: a band across the top and a band down the left. Both edges
      // are the same wave the test uses, so where the sand is drawn and where she
      // may stand are one line.
      var sh = seaShore();
      var sand = ctx.createLinearGradient(0, 0, 0, sh.top);
      sand.addColorStop(0, '#E6D8B2');
      sand.addColorStop(1, '#CDBB92');
      ctx.save();

      // The top band. In the bay it is broken where the river runs through it,
      // because a sand bar across a river mouth is not a sand bar, it is a dam.
      var isBay = d.name === 'the river mouth bay';
      var bch = isBay ? bayChannel(W) : null;
      var spans = isBay
        ? [[0, bch.c - bch.h - 6], [bch.c + bch.h + 6, W]]
        : [[0, W]];
      for (var sp = 0; sp < spans.length; sp++) {
        var x0 = spans[sp][0], x1 = spans[sp][1];
        if (x1 - x0 < 8) continue;
        ctx.beginPath();
        ctx.moveTo(x0, 0);
        ctx.lineTo(x1, 0);
        for (var tx2 = x1; tx2 >= x0; tx2 -= 24) {
          ctx.lineTo(tx2, sh.top + shoreEdge(tx2, W, 0.4));
        }
        ctx.closePath();
        ctx.fillStyle = sand;
        ctx.fill();
      }

      // The left band, from the top edge all the way down.
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (var ty2 = 0; ty2 <= H; ty2 += 24) {
        ctx.lineTo(sh.left + shoreEdge(ty2, H, 1.7), ty2);
      }
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fillStyle = sand;
      ctx.fill();

      // Pebbles, on the sand only.
      var prnd = seeded(4711);
      ctx.fillStyle = 'rgba(150,134,104,0.30)';
      var pb;
      for (pb = 0; pb < 60; pb++) {
        var px = prnd() * W, py = prnd() * sh.top;
        if (!onSeaShore(px, py)) continue;
        ctx.beginPath();
        ctx.ellipse(px, py, 2 + prnd() * 4, 1.5 + prnd() * 3, prnd() * 3, 0, TAU);
        ctx.fill();
      }
      for (pb = 0; pb < 40; pb++) {
        var px2 = prnd() * sh.left, py2 = sh.top + prnd() * (H - sh.top);
        if (!onSeaShore(px2, py2)) continue;
        ctx.beginPath();
        ctx.ellipse(px2, py2, 2 + prnd() * 4, 1.5 + prnd() * 3, prnd() * 3, 0, TAU);
        ctx.fill();
      }

      // The channel the river brings in, drawn over the sand it cuts through.
      var mouthAbove = neighbourOf(0, -1);
      if (mouthAbove && mouthAbove.kind === 'river') {
        var bch2 = bayChannel(W);
        var bcTop = bch2.c, bcH = bch2.h;
        // The channel through the bar: the mouth's own width, held until it is
        // out in open water, then fading into the sea.
        var bcEndY = H * 0.26;
        var bcg = ctx.createLinearGradient(0, 0, 0, bcEndY);
        bcg.addColorStop(0, '#689288');
        bcg.addColorStop(0.72, 'rgba(104,146,140,0.92)');
        bcg.addColorStop(1, 'rgba(104,146,140,0)');
        ctx.fillStyle = bcg;
        ctx.beginPath();
        ctx.moveTo(bcTop - bcH, 0);
        ctx.lineTo(bcTop - bcH, bcEndY);
        ctx.lineTo(bcTop + bcH, bcEndY);
        ctx.lineTo(bcTop + bcH, 0);
        ctx.closePath();
        ctx.fill();
        // Its two banks, where the sand meets the water.
        ctx.strokeStyle = 'rgba(246,240,220,0.90)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bcTop - bcH, 0);
        ctx.lineTo(bcTop - bcH, bcEndY);
        ctx.moveTo(bcTop + bcH, 0);
        ctx.lineTo(bcTop + bcH, bcEndY);
        ctx.stroke();
      }

      // The tide line: a wet pale edge along both shore edges, so the shingle
      // meets the water on a drawn line rather than an abrupt colour change.
      ctx.strokeStyle = 'rgba(250,246,236,0.85)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (var tx3 = 0; tx3 <= W; tx3 += 18) {
        var ey3 = sh.top + shoreEdge(tx3, W, 0.4);
        if (tx3 === 0) ctx.moveTo(tx3, ey3); else ctx.lineTo(tx3, ey3);
      }
      ctx.stroke();
      ctx.beginPath();
      for (var ty3 = 0; ty3 <= H; ty3 += 18) {
        var ex3 = sh.left + shoreEdge(ty3, H, 1.7);
        if (ty3 === 0) ctx.moveTo(ex3, ty3); else ctx.lineTo(ex3, ty3);
      }
      ctx.stroke();
      var mouthAbove = neighbourOf(0, -1);
      if (mouthAbove && mouthAbove.kind === 'river' && mouthAbove.name === 'the river mouth') {
        var topC = riverCentre(1, 'the river mouth') * W;
        var topH = riverHalfWidth(1, 'the river mouth') * W;
        // The channel, widening as it enters the sea.
        var rmg = ctx.createLinearGradient(0, 0, 0, H * 0.52);
        rmg.addColorStop(0, 'rgba(104,146,140,0.90)');
        rmg.addColorStop(0.55, 'rgba(110,152,146,0.55)');
        rmg.addColorStop(1, 'rgba(110,152,146,0)');
        ctx.fillStyle = rmg;
        ctx.beginPath();
        ctx.moveTo(topC - topH, 0);
        ctx.quadraticCurveTo(topC - topH * 1.7, H * 0.28, topC - topH * 2.3, H * 0.52);
        ctx.lineTo(topC + topH * 2.3, H * 0.52);
        ctx.quadraticCurveTo(topC + topH * 1.7, H * 0.28, topC + topH, 0);
        ctx.closePath();
        ctx.fill();
        // Its two banks, running into the shingle and fading.
        ctx.strokeStyle = 'rgba(232,224,196,0.70)';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(topC - topH, 0);
        ctx.quadraticCurveTo(topC - topH * 1.7, H * 0.28, topC - topH * 2.3, H * 0.52);
        ctx.moveTo(topC + topH, 0);
        ctx.quadraticCurveTo(topC + topH * 1.7, H * 0.28, topC + topH * 2.3, H * 0.52);
        ctx.stroke();
        // The river's own current, entering.
        ctx.strokeStyle = 'rgba(236,250,248,0.42)';
        ctx.lineWidth = 2;
        for (var rc = 0; rc < 7; rc++) {
          var rv = 0.05 + rc * 0.065;
          var rcx = topC + Math.sin(clock * 1.1 + rc) * topH * 0.5;
          var rhw = topH * (1 + rv * 2.2);
          ctx.beginPath();
          ctx.moveTo(rcx - rhw * 0.8, H * rv);
          ctx.quadraticCurveTo(rcx, H * rv + 4, rcx + rhw * 0.8, H * rv);
          ctx.stroke();
        }
      }

      ctx.restore();
    } else if (d.kind === 'openwater') {
      drawOpenWater(d, W, H);
    } else if (d.kind === 'beach') {
      drawBeach(d, W, H);
    } else if (d.kind === 'river') {
      drawRiver(d, W, H);
    } else if (d.kind === 'stream') {
      drawStream(d, W, H);
    } else if (d.kind === 'pond') {
      // The pond, from the one description of its shape: a wet edge of mud, the
      // water, then the same ripples in the same colour the fishing page uses.
      var ps = pondShape(W, H);
      ctx.fillStyle = 'rgba(146,140,106,0.55)';
      ctx.beginPath();
      ctx.ellipse(ps.cx, ps.cy, ps.rx + 14, ps.ry + 10, 0, 0, TAU);
      ctx.fill();
      var pg = ctx.createLinearGradient(ps.cx, ps.cy - ps.ry, ps.cx, ps.cy + ps.ry);
      pg.addColorStop(0, '#8FB0B0');
      pg.addColorStop(0.55, POND_WATER);
      pg.addColorStop(1, '#6B9396');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.ellipse(ps.cx, ps.cy, ps.rx, ps.ry, 0, 0, TAU);
      ctx.fill();
      // The same ripples, drawn on the pond's own ellipse so they stay inside it.
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(ps.cx, ps.cy, ps.rx, ps.ry, 0, 0, TAU);
      ctx.clip();
      ctx.strokeStyle = 'rgba(230,246,246,0.50)';
      ctx.lineWidth = 2;
      for (var p = 0; p < 5; p++) {
        var drift2 = Math.sin(clock * 0.7 + p) * 6;
        var ry0 = ps.cy - ps.ry * 0.62 + p * ps.ry * 0.30;
        ctx.beginPath();
        ctx.moveTo(ps.cx - ps.rx * 0.86, ry0);
        ctx.quadraticCurveTo(ps.cx - ps.rx * 0.34 + drift2, ry0 - 8, ps.cx, ry0);
        ctx.quadraticCurveTo(ps.cx + ps.rx * 0.40 + drift2, ry0 + 8, ps.cx + ps.rx * 0.86, ry0 - 3);
        ctx.stroke();
      }
      ctx.restore();
      // A lily pad or two, which is what a still pond has.
      var lrnd = seeded(3311);
      for (var lp = 0; lp < 3; lp++) {
        var lx = ps.cx + (lrnd() - 0.5) * ps.rx * 1.2;
        var ly = ps.cy + (lrnd() - 0.5) * ps.ry * 1.1;
        ctx.fillStyle = 'rgba(120,158,96,0.85)';
        ctx.beginPath();
        ctx.ellipse(lx, ly, 11, 7, lrnd() * 3, 0.5, TAU + 0.5);
        ctx.fill();
      }
    }

    if (d.kind === 'yard') {
      ctx.fillStyle = '#CDB48B';
      roundRect(W * 0.5 - 34, 0, 68, H, 0);
      ctx.fill();
      ctx.fillStyle = 'rgba(150,120,84,0.18)';
      roundRect(W * 0.5 - 7, 0, 14, H, 0);
      ctx.fill();
      ctx.fillStyle = '#CDB48B';
      roundRect(W * 0.30, H * 0.245, W * 0.24, 40, 20);
      ctx.fill();
    } else if (d.kind === 'garden') {
      // The beds draw their own soil: the ground's only job here is the garden's
      // tone and the wheel-ruts of a worked plot.
      ctx.strokeStyle = 'rgba(120,96,60,0.16)';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      for (var wr = 0; wr < 2; wr++) {
        ctx.beginPath();
        ctx.moveTo(W * (0.20 + wr * 0.5), H * 0.10);
        ctx.quadraticCurveTo(W * (0.26 + wr * 0.5), H * 0.5, W * (0.20 + wr * 0.5), H * 0.92);
        ctx.stroke();
      }
    } else if (d.kind === 'desert') {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      for (var du = 0; du < 6; du++) {
        ctx.beginPath();
        ctx.moveTo(0, H * (0.2 + du * 0.13));
        ctx.quadraticCurveTo(W * 0.5, H * (0.16 + du * 0.13), W, H * (0.2 + du * 0.13));
        ctx.stroke();
      }
    } else if (d.kind === 'heights') {
      ctx.fillStyle = 'rgba(247,244,238,0.45)';
      ctx.beginPath();
      ctx.ellipse(W * 0.5, H * 0.06, W * 0.7, H * 0.07, 0, 0, TAU);
      ctx.fill();
    }
  }

  /* ---- What stands in a section ------------------------------------------ */
  /* Built once per section and kept: species, the carved stones, the doors.
     Every prop is walked to, its verb shows in reach, and its one thing is
     done by tapping the chip. */
  var propCache = {};

  /* The garden: five beds, each with its own state. A seed stock lives with it,
     because sowing without something to sow is not a verb. */
  var SEEDS_KEY = 'darya.seeds';
  var garden = {
    beds: [],
    seeds: 4,
    harvested: 0,
    saved: -9
  };
  var GARDEN_ROWS = 5;
  var BED_STEPS = 3;        // sown -> grown -> ready

  function gardenInit() {
    if (!garden.beds.length) {
      for (var i = 0; i < GARDEN_ROWS; i++) {
        garden.beds.push({ step: 0, t: 0, species: null });
      }
    }
    try {
      var raw = window.localStorage.getItem(SEEDS_KEY);
      if (raw) {
        var got = JSON.parse(raw);
        garden.seeds = got.seeds | 0;
        garden.harvested = got.harvested | 0;
        if (got.beds && got.beds.length === GARDEN_ROWS) {
          for (var b = 0; b < GARDEN_ROWS; b++) {
            garden.beds[b].step = got.beds[b].step | 0;
            garden.beds[b].t = +got.beds[b].t || 0;
          }
        }
      }
    } catch (e) { /* nothing saved yet */ }
  }

  function gardenSave() {
    try {
      var beds = [];
      for (var i = 0; i < garden.beds.length; i++) {
        beds.push({ step: garden.beds[i].step, t: garden.beds[i].t });
      }
      window.localStorage.setItem(SEEDS_KEY,
        JSON.stringify({ seeds: garden.seeds, harvested: garden.harvested, beds: beds }));
    } catch (e) { /* nothing */ }
  }

  /* The beds grow on their own clock: a sown bed becomes grown, a grown one
     becomes ready. Nothing is ever lost by waiting. */
  function gardenTick(dt) {
    var changed = false;
    for (var i = 0; i < garden.beds.length; i++) {
      var bed = garden.beds[i];
      if (!bed.step) continue;
      var goal = bed.step >= BED_STEPS ? bed.t : bed.t + dt;
      if (bed.step < BED_STEPS) {
        bed.t = goal;
        if (bed.t > (bed.step === 1 ? 14 : 22)) { bed.step++; bed.t = 0; changed = true; }
      }
    }
    if (changed) gardenSave();
  }

  var islandProps = [];
  var islandVerb = null;

  /* ---- The animals' own behaviour ---------------------------------------- */
  /* Ported from the island's ExplorationSim. An animal does not slide about:
     it stands for a period, then takes one move. The move is the sum of a few
     pulls - away from the keeper when she is inside its ring, toward her when
     she is worth watching, apart from its neighbours, back toward home, and
     toward water when it is dry - and the pull decides the gait: still, a
     walk, a run or a hop. A calm animal puts its head down and grazes. */

  var FAUNA_IDLE = 0.24;       // a wish weaker than this leaves it standing
  var FAUNA_LEAP = 0.25;       // seconds in the air on one hop
  var FAUNA_GROUP = 150;       // how far its own kind still counts as a herd

  /* Which drawings are living things that move. A plant sways but stays put,
     and a person stands where they are and speaks. */
  var ANIMAL_SHAPES = {
    beast: 1, bird: 1, insect: 1, fish: 1, hen: 1,
    cat: 1, dog: 1, frog: 1, seal: 1
  };

  function animalHops(id) { return /rabbit|mouse|hedgehog|dormouse|frog|ant|beetle|bird|sparrow|starling|swallow|magpie|crow|sunbird|bluebird/.test(id); }
  function animalFlies(id) { return /bee|butterfly|hornet|moth|mosquito|wasp/.test(id); }
  function animalSwims(id) { return /fish|seal|frog/.test(id); }
  function animalHunts(id) {
    return /fox|wolf|jackal|hyena|leopard|cheetah|tiger|lion|lynx|pallas|bear|boar|seal|cat/.test(id);
  }
  function animalEatsPlants(e) {
    if (e.sh !== 'beast') return false;
    return !animalHunts(e.id);
  }

  /* One animal's temperament and body, from its own name and its own seed, so
     two deer are not one deer twice. */
  function animalTraits(sp, seed) {
    var flies = animalFlies(sp.id);
    var swims = animalSwims(sp.id);
    var hops = animalHops(sp.id);
    var small = /mouse|hedgehog|dormouse|frog|ant|beetle|butterfly|bee/.test(sp.id);
    var large = /bear|boar|tiger|lion|leopard|maral|onager|deer|horse/.test(sp.id);
    var r = seeded(seed)();
    return {
      flies: flies,
      swims: swims,
      hops: hops,
      eatsPlants: animalEatsPlants(sp),
      wander: (small ? 26 : large ? 34 : 30) + r * 22,
      flee: (small ? 95 : large ? 150 : 120) + r * 60,
      period: (flies ? 0.45 : hops ? 0.7 : large ? 0.95 : 0.8) + r * 0.2,
      bold: 0.25 + r * 0.55,
      curious: 0.2 + seeded(seed + 7)() * 0.7,
      social: 0.3 + seeded(seed + 13)() * 0.5
    };
  }

  function makeAnimal(sp, x, y) {
    var seed = Math.round(x * 31 + y * 17 + sp.id.length * 7);
    var t = animalTraits(sp, seed);
    // Born on ground it may keep, so its first move is not a jump out of a wall.
    y = Math.max(y, animalFloor() + 10);
    return {
      sp: sp,
      x: x, y: y,
      home: { x: x, y: y },
      seed: seed,
      traits: t,
      ring: 70 + 120 * (1 - t.bold),
      interest: 70 + 120 * (1 - t.bold) + 60 + 90 * t.curious,
      homeR: 80 + t.social * 70,
      pulse: 0.4 + seeded(seed + 3)() * t.period,
      gait: 'still',
      facing: seed % 2 ? -1 : 1,
      moving: false,
      grazing: false,
      grazeK: 0,
      lift: 0,
      leap: 0,
      leapFrom: null,
      leapTo: null,
      walk: seeded(seed + 5)() * 6,
      thirst: 14 + seeded(seed + 11)() * 26,
      thirsty: false,
      drinking: 0,
      heading: { x: 0, y: 0 }
    };
  }

  /* A bird hops along the ground instead of scissoring its legs, so its beat is
     shorter and its leap smaller: a hop for a bird, not a leap for a hare. */
  function animalBeat(a, herd) {
    var t = a.traits;
    var dx = hero.x - a.x, dy = hero.y - a.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var towardX = dx / d, towardY = dy / d;
    var panic = d < a.ring ? 1 - d / a.ring : 0;
    var wishX = 0, wishY = 0;

    // Away from the keeper, strongest at her feet and nothing at the ring's edge.
    if (panic > 0) {
      wishX -= towardX * (1 - t.bold) * panic;
      wishY -= towardY * (1 - t.bold) * panic;
    } else if (d < a.interest) {
      // Toward her, from outside the ring only: inside it the animal has
      // already given ground, or a curious one would come to her feet.
      var draw = t.curious * (1 - d / a.interest);
      wishX += towardX * draw;
      wishY += towardY * draw;
    }

    // Its own kind: give a neighbour its body space, then keep with the herd.
    var hx = 0, hy = 0, hn = 0;
    for (var i = 0; i < herd.length; i++) {
      var o = herd[i];
      if (o === a) continue;
      var ox = o.x - a.x, oy = o.y - a.y;
      var gap = Math.sqrt(ox * ox + oy * oy) || 1;
      if (gap < 46) {
        wishX -= (ox / gap) * (1 - gap / 46);
        wishY -= (oy / gap) * (1 - gap / 46);
        continue;
      }
      if (o.sp.id !== a.sp.id || gap > FAUNA_GROUP) continue;
      hx += o.x; hy += o.y; hn++;
    }
    if (hn > 0) {
      var mx = hx / hn - a.x, my = hy / hn - a.y;
      var md = Math.sqrt(mx * mx + my * my) || 1;
      wishX += (mx / md) * t.social;
      wishY += (my / md) * t.social;
    }

    // Thirst takes the home pull's place: it walks to the water instead.
    var water = sectionWater();
    if (a.thirsty && water) {
      var wx = water.x - a.x, wy = water.y - a.y;
      var wd = Math.sqrt(wx * wx + wy * wy) || 1;
      wishX += wx / wd;
      wishY += wy / wd;
      a.heading = { x: wx / wd, y: wy / wd };
    } else {
      var bx = a.home.x - a.x, by = a.home.y - a.y;
      var bd = Math.sqrt(bx * bx + by * by) || 1;
      if (bd > a.homeR) {
        wishX += (bx / bd) * Math.min(1, (bd - a.homeR) / a.homeR);
        wishY += (by / bd) * Math.min(1, (bd - a.homeR) / a.homeR);
      }
    }

    // Its own beat, so two animals with the same temper do not take one line.
    var jitter = a.seed * 0.017 + clock * 0.6;
    wishX += Math.cos(jitter) * 0.26;
    wishY += Math.sin(jitter) * 0.26;

    var len = Math.sqrt(wishX * wishX + wishY * wishY);
    a.pulse = t.period * (panic > 0 ? 0.5 : 1);

    if (len < FAUNA_IDLE) {
      a.gait = 'still';
      a.grazing = t.eatsPlants && seeded(a.seed + Math.floor(clock))() > 0.35;
      return;
    }

    var dirX = wishX / len, dirY = wishY / len;
    var strength = Math.min(1, len);
    a.heading = { x: dirX, y: dirY };
    a.facing = dirX >= 0 ? 1 : -1;
    a.grazing = false;

    var roll = seeded(a.seed + Math.floor(clock * 7))();
    if (t.hops && roll < 0.55) {
      a.gait = 'hop';
      a.leap = FAUNA_LEAP;
      a.leapFrom = { x: a.x, y: a.y };
      var reach = (panic > 0 ? t.flee : t.wander) * t.period * strength;
      if (a.sp.sh === 'bird') reach *= 0.55;
      a.leapTo = { x: a.x + dirX * reach, y: a.y + dirY * reach };
      return;
    }
    a.gait = panic > 0 ? 'run' : 'walk';
    a.speed = (panic > 0 ? t.flee : t.wander) * strength;
  }

  /* Where a section keeps its water, for an animal that is dry. */
  function sectionWater() {
    var d = sectionDef();
    if (!d) return null;
    if (d.kind === 'pond' || d.kind === 'stream' || d.kind === 'sea' || d.kind === 'beach' || d.kind === 'lake') {
      return { x: world.w * 0.5, y: world.h * 0.42 };
    }
    if (d.kind === 'yard') return { x: world.w * 0.13, y: world.h * 0.82 };
    if (d.kind === 'river') return { x: world.w * 0.5, y: world.h * 0.5 };
    return null;
  }

  /* Advance every animal of this section by one frame. */
  function updateFauna(dt) {
    var herd = [];
    var i, p;
    for (i = 0; i < islandProps.length; i++) {
      p = islandProps[i];
      if (p.k === 'species' && p.anim) herd.push(p.anim);
    }
    for (i = 0; i < herd.length; i++) {
      var a = herd[i];
      a.lift = lerp(a.lift, 0, 1 - Math.exp(-dt * 9));

      if (a.drinking > 0) {
        a.drinking -= dt;
        a.grazing = true;
        if (a.drinking <= 0) {
          a.thirsty = false;
          a.thirst = 18 + seeded(a.seed + Math.floor(clock))() * 26;
        }
        continue;
      }

      a.thirst -= dt;
      if (a.thirst <= 0 && !a.thirsty && sectionWater()) a.thirsty = true;

      // The head eases down to the grass and back up, rather than switching.
      a.grazeK = lerp(a.grazeK, a.grazing ? 1 : 0, 1 - Math.exp(-dt * 6));

      if (a.leap > 0) {
        a.leap -= dt;
        var done = 1 - Math.max(0, a.leap) / FAUNA_LEAP;
        a.x = a.leapFrom.x + (a.leapTo.x - a.leapFrom.x) * done;
        a.y = a.leapFrom.y + (a.leapTo.y - a.leapFrom.y) * done;
        a.lift = Math.sin(Math.PI * done) * 14;
        a.moving = true;
        a.walk += dt * 8;
        if (a.leap <= 0) { a.leap = 0; a.gait = 'still'; a.moving = false; }
        clampAnimal(a);
        continue;
      }

      if (a.gait === 'walk' || a.gait === 'run') {
        var pace = a.speed || a.traits.wander;
        a.x += a.heading.x * pace * dt;
        a.y += a.heading.y * pace * dt;

        // running animal does not paddle. One pose per 11 units walked.
        a.walk += (pace * dt) / 11 * 8 * (a.gait === 'run' ? 1.25 : 1);
        a.moving = true;
        clampAnimal(a);
      } else {

      }

      a.pulse -= dt;
      if (a.pulse > 0) continue;

      // At the water with its thirst on it: head down and drink.
      var water = sectionWater();
      if (a.thirsty && water) {
        var wd = dist(a.x, a.y, water.x, water.y);
        if (wd < 70) {

          a.gait = 'still';
          continue;
        }

      animalBeat(a, herd);
    }

    // The prop follows the animal, so the verb and the drawing are one thing.
    for (i = 0; i < islandProps.length; i++) {
      p = islandProps[i];
      if (p.k === 'species' && p.anim) {
        p.x = p.anim.x;
        p.y = p.anim.y;
      }
    }
  }

  /* The ground a walking animal may keep. A building is a wall to it: the yard's
     house, the henhouse coop, the greenhouse and the apiary hives take the top
     of their section, so nothing wanders into a wall. Open water is its own
     case: a fish keeps below the surface, a bird keeps to the air above it. */
  function waterSection() {
    var d = sectionDef();
    return !!d && (d.kind === 'sea' || d.kind === 'openwater' ||
      d.kind === 'pond' || d.kind === 'lake' || d.kind === 'stream');
  }

  /* Is there no land here at all? The open water is the only such place. */
  function isOpenWater() {
    var d = sectionDef();
    return !!d && d.kind === 'openwater' && !interior;
  }

  /* The channel where the river enters the bay: the mouth's own last row, read
     from the other side. One pair of numbers for the drawing and the walk test. */
  function bayChannel(W) {
    return {
      c: riverCentre(1, 'the river mouth') * W,
      h: riverHalfWidth(1, 'the river mouth') * W
    };
  }
  function inBayChannel(x, W) {
    var bc = bayChannel(W);
    return Math.abs(x - bc.c) < bc.h;
  }

  /* A sea section's shingle: a bank along the north and west edges, because that
     is where she comes in from, with open water everywhere else. One function
     answers "may she stand here" for her and for every animal. */
  function seaShore() {
    return { top: world.h * 0.30, left: world.w * 0.24 };
  }

  /* The edge of the shingle, as one wave, used by both the drawing and the test so

  function shoreEdge(at, span, phase) {
    return Math.sin(at / span * Math.PI * 2 + phase) * 7;
  }

  function onSeaShore(x, y) {
    var sh = seaShore();
    // In the bay the river's channel runs through the northern bank: it is water,
    // and she crosses north on one of the banks either side of it.
    if (sectionDef().name === 'the river mouth bay' && y <= sh.top + 24 &&
      inBayChannel(x, world.w)) return false;
    // A little slack, so a wavy edge drawn 7 px out never traps her on water.
    return y <= sh.top + shoreEdge(x, world.w, 0.4) + 8 ||
      x <= sh.left + shoreEdge(y, world.h, 1.7) + 8;

  /* Push a point back onto the shingle, the short way out. */
  function keepOnSeaShore(pt) {
    var sh = seaShore();
    if (onSeaShore(pt.x, pt.y)) return pt;
    if (pt.y - sh.top < pt.x - sh.left) pt.y = sh.top - 6;
    else pt.x = sh.left - 6;
    return pt;
  }

  function animalFloor() {
    var d = sectionDef();
    if (!d) return 90;
    if (d.kind === 'yard') return world.h * 0.30;
    if (d.kind === 'henhouse') return world.h * 0.30;
    if (d.kind === 'glass') return world.h * 0.32;
    if (d.kind === 'apiary') return world.h * 0.30;
    if (waterSection()) return world.h * 0.30;
    return 90;

  function clampAnimal(a) {
    var m = 30;

      // all; nothing else of the ground can stand here.
      if (a.sp && a.sp.sh === 'fish') {
        var sh = seaShore();
        var minX = sh.left + 26, minY = sh.top + 26;
        if (a.x < minX) a.x = minX;
        if (a.y < minY) a.y = minY;
        if (a.x > world.w - 26) a.x = world.w - 26;
        if (a.y > world.h - 30) a.y = world.h - 30;
      }
      return;
    }
    if (d && (d.kind === 'stream' || d.kind === 'pond')) {

      // in it, and a frog or a reed-bird may sit at its edge.
      var cx = world.w * 0.5, cy = world.h * 0.44;
      var rx = world.w * 0.40, ry = world.h * 0.165;

        out.push({ k: 'hivebox', x: W * 0.22, y: H * 0.60, verb: 'open this hive', act: 'enter', to: 'queen', name: '' });
        out.push({ k: 'hivebox', x: W * 0.78, y: H * 0.62, verb: 'open this hive', act: 'enter', to: 'comb', name: '' });

      }
      var rnd = seeded(20261108 + section.cx * 7919 + section.cy * 104729 + d.kind.length * 31);

        var planted = [];
        for (i = 0; i < list.length; i++) if (list[i].sh === 'plant') planted.push(list[i]);
        for (var row = 0; row < GARDEN_ROWS; row++) {

          // Alternating either side of the lane, so the beds are places she walks

          var rp = gardenRowAt(row, W, H);

          if (!bed.step) v = garden.seeds > 0 ? 'sow a seed' : 'nothing left to sow';

          else v = 'harvest the ' + (sp3 ? shortName(sp3) : 'bed');
          out.push({
            k: 'bed', sp: sp3, row: row, bedW: gardenRowAt(row, W, H).w * 0.92,

            bedStep: bed.step,

            // so the bed is never under her feet.

            act: 'bed', name: ''
          });
        }
        // What grows around the beds is still worth looking at, off to the sides.
        for (i = 0; i < Math.min(3, list.length); i++) {

          if (e2.sh !== 'plant') continue;
          out.push({
            k: 'species', sp: e2,

      for (i = 0; i < out.length; i++) {
