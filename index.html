  /* A lane runs down the middle of the yard and the kitchen garden, and nowhere
     else. The dressing asks this instead of assuming one everywhere. */
  function hasLane() {
    var d = typeof sectionDef === 'function' ? sectionDef() : null;
    if (!d) return true;
    return d.kind === 'yard' || d.kind === 'garden';

  /* ---------------------------------------------------------------------------
     THE GROUND HAS A STAGE.

     Spreading dressing over the whole page is what makes a place read as
     haphazard: there is no composition, so nothing is the subject and the eye has
     nowhere to rest. That is true whether the count is 700 or 200.

     A made place is COMPOSED. Three rules do almost all of the work:

       1. THE VERGE. The band round the page's edge is dressed, and the middle is
          kept open. That alone turns a field into a clearing with a stage in it -
          which is where she walks and where the things she walks to stand.
       2. BEDS AT FEATURES. What grows, grows against something: clover at a hive's
          foot, straw at a door, reeds at a bank. The same n reads as deliberate
          when it is placed relative to a thing and as noise when it is not.
       3. A BASE, THIN. The ground underfoot is grass, but sparsely - enough to
          know what ground it is, not enough to be a texture.

     So every design is: a verge, a base, and a handful of feature beds.
     --------------------------------------------------------------------------- */

  /* The verge: a band of rough grass round the page's edge, with a ragged inner
     boundary. Painted once into the quiet ground, so it costs nothing per frame.
     `tone` is the ground's own colour deepened; `along` is how far in it reaches. */
  function drawVerge(W, H, along, depth) {
    var i, steps = 26;
    // The inner boundary: a wobbling line round the page, so it is never a frame.
    function wob(t) {
      return Math.sin(t * 7.1 + 1.3) * 0.34 + Math.sin(t * 13.7 + 4.1) * 0.22 +
        Math.sin(t * 23.3 + 2.7) * 0.14;
    }
    var inset = along;
    ctx.fillStyle = depth;
    ctx.beginPath();
    // Down the left, across the bottom, up the right, across the top - each edge
    // with its own wobble.
    ctx.moveTo(0, 0);
    for (i = 0; i <= steps; i++) {
      var t = i / steps;
      ctx.lineTo(inset + wob(t) * inset * 0.55, t * H);
    }
    ctx.lineTo(0, H);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(W, 0);
    for (i = 0; i <= steps; i++) {
      var t2 = i / steps;
      ctx.lineTo(W - inset - wob(t2 + 0.4) * inset * 0.55, t2 * H);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(W, 0);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (i = 0; i <= steps; i++) {
      var t3 = i / steps;
      ctx.lineTo(t3 * W, inset * 0.7 + wob(t3 + 1.7) * inset * 0.4);
    }
    ctx.lineTo(W, 0);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, H);
    for (i = 0; i <= steps; i++) {
      var t4 = i / steps;
      ctx.lineTo(t4 * W, H - inset * 0.7 - wob(t4 + 2.9) * inset * 0.4);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  /* Which design a section gets. One owner, so a new kind of place is one line. */
  function dressingFor(kind) {
    if (kind === 'yard') return DRESSING.yard;
    if (kind === 'garden') return DRESSING.garden;
    if (kind === 'apiary') return DRESSING.apiary;
    if (kind === 'woods') return DRESSING.woods;
    if (kind === 'steppe') return DRESSING.steppe;
    if (kind === 'desert') return DRESSING.desert;
    if (kind === 'heights') return DRESSING.heights;
    if (kind === 'beach') return DRESSING.beach;
    if (kind === 'pond' || kind === 'stream' || kind === 'river') return DRESSING.wet;
    return null;   // sea, openwater: nothing grows
  }

  function buildScenery() {
    quietGround.dirty = true;
    scenery.pieces = [];
    var d = typeof sectionDef === 'function' ? sectionDef() : null;
    var design = d ? dressingFor(d.kind) : DRESSING.yard;
    if (!design) return;

    // A per-place seed, so the woods at one coordinate differ from the woods at
    // another - but the same place is always the same place.
    var sec = section || { cx: 0, cy: 0 };
    var rnd = seeded(20261106 + (d ? d.kind.length * 977 : 0) + sec.cx * 7919 + sec.cy * 104729);
    var W = world.w, H = world.h;
    var i, x, y;

    function push(kind, x2, y2, extra) {

    }

          sq: 0.5 + rnd() * 0.4, a: rnd() * TAU, tone: rnd()
        });
      } else if (kind === 'thatch') {
        var ts = opts.s || [1, 1.6];
        push('thatch', x2, y2, { s: ts[0] + rnd() * (ts[1] - ts[0]), a: -0.4 + rnd() * 0.8, tone: rnd() });
      } else if (kind === 'clover') {
        push('clover', x2, y2, { s: 0.8 + rnd() * 0.7, a: rnd() * TAU, tone: rnd() });
      } else if (kind === 'daisy') {
        var ds = opts.s || [0.9, 1.3];
        push('daisy', x2, y2, {

    // middle is the stage and stays open, and the dressing frames it.
    function edgePoint() {

      if (rnd() < 0.55) {

        var left = rnd() < 0.5;
        x = left ? 10 + rnd() * W * band : W - 10 - rnd() * W * band;
        y = 96 + rnd() * (H - 130);
      } else {
        // The top and bottom.
        var top = rnd() < 0.5;
        y = top ? 96 + rnd() * H * band : H - 12 - rnd() * H * band;
        x = 10 + rnd() * (W - 20);
      }
    }

    if (design.verge) {
      for (i = 0; i < (design.verge.n || 0); i++) {
        edgePoint();
        place(design.verge.k, x, y, design.verge);
      }
    }
    if (design.vergeKind) {
      for (i = 0; i < (design.vergeN || 0); i++) {
        edgePoint();
        place(design.vergeKind, x, y, {
          t: design.vergeT, s: [0.6, 1.2], r: [3, 9], s2: design.vergeS

    // sparse - enough to name the ground, not enough to be a texture - and kept
    // out of the stage's middle.
    if (design.base) {
      for (i = 0; i < design.base.n; i++) {

        // in the verge, and the stage itself is kept thinnest. This is what makes
        // the page read as a clearing with a centre rather than a field.

        if (u < 0.55) {

            y = 96 + rnd() * (H - 130);

            y = rnd() < 0.5 ? 96 + rnd() * H * 0.14 : H - 12 - rnd() * H * 0.14;
            x = 10 + rnd() * (W - 20);

      // something to stand in.

        place('blade', x, y, { s: [1.1, 2.3], t: 0.42 });

      // And the species itself, denser at the middle.
      for (var j = 0; j < b.n; j++) {
        var ang = rnd() * TAU;
        var rr = Math.sqrt(rnd()) * rad;
        x = clamp(cx + Math.cos(ang) * rr, 14, W - 14);
        y = clamp(cy + Math.sin(ang) * rr * squash, 100, H - 16);

  /* May something stand at (x, y)? One owner for every "not here" area: the

  function groundBlocks(x, y) {

    if (d.kind === 'glass') {

      var bedX0 = W * 0.10, bedX1 = W * 0.90;
      var bedY = H * 0.38, bedH = H * 0.30;
      if (x > bedX0 && x < bedX1 && y > bedY && y < bedY + bedH) return true;
      // The glasshouse's own footprint: the structure stands there, and grass
      // growing over the panes is grass growing on a building.
      if (y < H * 0.30 + 6) return true;
    }
    if (d.kind === 'beach' && isSurf(x, y, W, H)) return true;
    if (d.kind === 'stream' && inStream(x, y, W, H)) return true;
    if (d.kind === 'pond') {
      var psz = pondShape(W, H);
      var dx = (x - psz.cx) / (psz.rx + 12);
      var dy = (y - psz.cy) / (psz.ry + 12);
      if (Math.sqrt(dx * dx + dy * dy) < 1) return true;
    }
    if (d.kind === 'river' && inRiver(x, y, W, H)) return true;
    return false;

  function keepSceneryDry() {
    var d = sectionDef();
    if (!d) return;
    var pieces = scenery.pieces || [];

    function clearOut(test, move) {
      for (var i = 0; i < pieces.length; i++) {

        if (!test(it)) continue;
        move(it);

        it.y = clamp(it.y, 90, world.h - 16);

          else if (sdg.dx < 0) it.x = Math.max(it.x, bg);
          else if (sdg.dy > 0) it.y = Math.min(it.y, world.h - bg);
          else it.y = Math.max(it.y, bg);

        function (it) { return inStream(it.x, it.y, world.w, world.h); },

    }

    if (d.kind === 'pond') {
      var psz = pondShape(world.w, world.h);
      clearOut(
        function (it) {
          var dx = (it.x - psz.cx) / (psz.rx + 16);
          var dy = (it.y - psz.cy) / (psz.ry + 16);
          return Math.sqrt(dx * dx + dy * dy) < 1;
        },
        function (it) {
          var dx = (it.x - psz.cx) / (psz.rx + 16);
          var dy = (it.y - psz.cy) / (psz.ry + 16);
          var r = Math.sqrt(dx * dx + dy * dy) || 0.0001;

    }

    if (d.kind !== 'river') return;
    var W = world.w, H = world.h;
    clearOut(
      function (it) { return inRiver(it.x, it.y, W, H); },
      function (it) {
