      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 16, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#FFF6DA';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3.6, 0, TAU);
      ctx.fill();
    }

    if (sky.nameCard) {
      var nc = sky.stars[sky.nameCard.i];
      var a2 = Math.min(1, sky.nameCard.age * 6);
      ctx.save();
      ctx.globalAlpha = a2;
      ctx.fillStyle = 'rgba(20,28,48,0.9)';
      var tw = 118, tx = clamp(nc.x - tw / 2, 8, 390 - tw - 8);
      roundRect(tx, nc.y + 14, tw, 26, 8);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,246,218,0.92)';
      ctx.font = 'italic 500 12px ' + FONT_SERIF;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(nc.n, tx + tw / 2, nc.y + 28);
      ctx.restore();
      ctx.textAlign = 'left';
    }

    // The figure's name, once every line is drawn.
    if (sky.done) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = sky.glow;
      ctx.fillStyle = '#F7E9C2';
      ctx.font = 'italic 600 24px ' + FONT_SERIF;
      ctx.fillText(SKY_FIGURE.name, 195, 590);
      ctx.fillStyle = 'rgba(247,233,194,0.7)';
      ctx.font = '400 12px ' + FONT_UI;
      ctx.fillText(SKY_FIGURE.en + '  \u00b7  ' + SKY_FIGURE.p, 195, 616);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    } else {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(240,236,224,0.7)';
      ctx.font = '500 12px ' + FONT_UI;
      ctx.fillText('drag from star to star', 195, 640);
      ctx.textAlign = 'left';
    }

    if (sky.done && clock - sky.doneAt > 3.5) {
      drawPaperCard(390, 844, 'The Plough is drawn', 'Dob-e Akbar, the Great Bear, over the island.', [
        'seven stars, seven lines',
        'setare \u00b7 star'
      ], 'Tap to go back', storyPage('sky'));
      storyMark('sky');
      hits = [];
      addHit(0, 0, 390, 844, 'card');
      pageEnd();
      return;
    }

    ctx.textAlign = 'left';
    pageEnd();
  }

  /* ---- The comb: cap each cell in its window ---------------------------- */
  var comb = {
    cells: [], capped: 0, goal: 8, msg: '', msgAge: 9, done: false, doneAt: 0, sting: -9,
    // Honey taken from the comb, and the mites living on it.
    stores: 0, taken: 0, mites: [], mitesCleared: 0, miteSting: -9
  };
  var HONEY_KEY = 'darya.honey';

  function honeyInit() {
    try {
      var raw = window.localStorage.getItem(HONEY_KEY);
      if (raw) { var got = JSON.parse(raw); comb.stores = +got.stores || 0; comb.taken = +got.taken || 0; }
    } catch (e) { /* nothing saved */ }
  }
  function honeySave() {
    try {
      window.localStorage.setItem(HONEY_KEY, JSON.stringify({ stores: comb.stores, taken: comb.taken }));
    } catch (e) { /* nothing */ }
  }

  function enterComb() {
    comb.cells = [];
    comb.capped = 0;
    comb.msg = '';
    comb.msgAge = 9;
    comb.done = false;
    comb.doneAt = 0;
    comb.sting = -9;
    honeyInit();
    comb.mitesCleared = 0;
    var cols = 4, rows = 3, cw = 78, ch = 82;
    var x0 = (390 - cols * cw) / 2 + cw / 2, y0 = 240 + ch / 2;
    var rnd = seeded(31337 + Math.floor(clock * 13));
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        comb.cells.push({
          x: x0 + c * cw + (r % 2 ? cw * 0.16 : 0),
          y: y0 + r * ch,
          t: rnd() * 0.9,
          rate: 0.26 + rnd() * 0.2,
          state: 'filling',     // filling | ready | capped | spoiled
          hold: 0,
          pop: 0
        });
      }
    }
    combSpawnMites();
  }

  /* Mites: a few of them, walking on the comb. Each one tapped is one dealt with;
     one left alone takes a little honey with it, which is what varroa do. */
  function combSpawnMites() {
    comb.mites = [];
    var rnd = seeded(8081 + Math.floor(clock * 7));
    var many = 3 + Math.floor(rnd() * 2);
    for (var i = 0; i < many; i++) {
      var cell = comb.cells[Math.floor(rnd() * comb.cells.length)];
      if (!cell) continue;
      comb.mites.push({
        x: cell.x + (rnd() - 0.5) * 40,
        y: cell.y + (rnd() - 0.5) * 34,
        at: clock + rnd() * 2,
        dead: 0,
        vx: (rnd() - 0.5) * 12,
        vy: (rnd() - 0.5) * 10
      });
    }
  }

  function combWindow() {
    return Math.max(0.95, 2.3 - comb.capped * 0.16);
  }

  function combTap(p) {
    if (chromeTap(p)) return;
    var h = hitAt(p);
    // A mite first: it is the smaller target and the one that costs honey.
    if (h && h.act === 'mite') {
      var m = comb.mites[h.arg];
      if (m && !m.dead) {
        m.dead = clock;
        comb.mitesCleared++;
        addParticles(m.x, m.y, '#9A6B3A', 6, 40);
        sfx.pick();
        if (comb.mitesCleared === 1) teachWord('varroa');
      }
      return;
    }
    if (!h || h.act !== 'cell') return;
    var cell = comb.cells[h.arg];
    // A capped cell is a full store: tapping it takes the honey out.
    if (cell.state === 'capped') {
      cell.state = 'filling';
      cell.t = 0;
      cell.pop = 0;
      comb.stores += 2;
      comb.taken += 2;
      comb.capped = Math.max(0, comb.capped - 1);
      honeySave();
      teachWord('asal');
      addFloater(cell.x, cell.y - 40, '+2 honey', C.saffron);
      sfx.deliver();
      return;
    }
    if (comb.done) return;
    if (cell.state === 'ready') {
      cell.state = 'capped';
      cell.pop = 1;
      comb.capped++;
      sfx.pick();
      if (comb.capped >= comb.goal) {
        comb.done = true;
        comb.doneAt = clock;
        teachWord('shane');
        sfx.win();
      }
    } else {
      comb.msg = 'Not yet: the honey is still thin.';
      comb.msgAge = 0;
      comb.sting = clock;
      sfx.bee();
    }
  }

  function updateComb(dt) {
    if (comb.msgAge < 4) comb.msgAge += dt;
    // The mites walk about the comb, and one that is left takes honey with it.
    for (var mi = 0; mi < comb.mites.length; mi++) {
      var mm = comb.mites[mi];
      if (mm.dead) continue;
      mm.x += mm.vx * dt;
      mm.y += mm.vy * dt;
      mm.vx += (rand(-1, 1)) * 4 * dt;
      mm.vy += (rand(-1, 1)) * 4 * dt;
      mm.vx = clamp(mm.vx, -18, 18);
      mm.vy = clamp(mm.vy, -16, 16);
      if (clock > mm.at + 9 && comb.stores > 0) {
        // It takes a share, and the keeper is told.
        comb.stores = Math.max(0, comb.stores - 1);
        mm.at = clock;
        honeySave();
        comb.msg = 'A mite is taking honey. Tap it.';
        comb.msgAge = 0;
      }
    }
    for (var i = 0; i < comb.cells.length; i++) {
      var c = comb.cells[i];
      if (c.pop > 0) c.pop = Math.max(0, c.pop - dt * 2.2);
      if (c.state === 'filling') {
        c.t += dt * c.rate;
        if (c.t >= 1) { c.t = 1; c.state = 'ready'; c.hold = combWindow(); }
      } else if (c.state === 'ready') {
        c.hold -= dt;
        if (c.hold <= 0) {
          c.state = 'spoiled';
          c.t = 0;
          c.hold = 2.5 + rand(0, 1.5);
          comb.msg = 'The cap set hard. It will fill again.';
          comb.msgAge = 0;
        }
      } else if (c.state === 'spoiled') {
        c.hold -= dt;
        if (c.hold <= 0) { c.state = 'filling'; c.t = 0.08; }
      }
    }
  }

  function autoComb() {
    if (comb.done) {
      if (clock - comb.doneAt > 3.6) backToTitle();
      return;
    }
    for (var i = 0; i < comb.cells.length; i++) {
      if (comb.cells[i].state === 'ready') { combTap({ x: comb.cells[i].x, y: comb.cells[i].y }); return; }
    }
  }

  function drawComb(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);
    drawHiveRoom();

    placeHeader('The comb');
    countChip(comb.capped + ' / ' + comb.goal, 262, 58, 116);

    for (var i = 0; i < comb.cells.length; i++) {
      var c = comb.cells[i];
      var shakeX = clock - comb.sting < 0.25 ? Math.sin((clock - comb.sting) * 70) * 2 : 0;
      ctx.save();
      ctx.translate(c.x + shakeX, c.y);

      var glow = 0;
      if (c.state === 'ready') glow = 0.55 + Math.sin(clock * 9) * 0.2;
      if (c.state === 'capped') glow = 0.25;
      if (glow > 0) {
        var g = ctx.createRadialGradient(0, 0, 4, 0, 0, 42);
        g.addColorStop(0, 'rgba(255,214,120,' + glow.toFixed(2) + ')');
        g.addColorStop(1, 'rgba(255,214,120,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, 42, 0, TAU);
        ctx.fill();
      }

      // The cell: dark when empty, honey when full, wax when capped.
      var fill = c.state === 'capped' ? '#E9DDBE'
        : c.state === 'spoiled' ? '#3A3028'
        : c.state === 'ready' ? '#F2B03F'
        : mixColor('#2A211A', '#C4872A', clamp(c.t, 0, 1));

      hexagon(0, 0, 33);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = c.state === 'ready' ? 'rgba(255,240,200,0.95)'
        : c.state === 'capped' ? 'rgba(150,120,70,0.55)'
        : 'rgba(255,196,110,0.5)';
      ctx.lineWidth = c.state === 'ready' ? 2.4 : 1.4;
      ctx.stroke();

      if (c.state === 'capped') {
        ctx.strokeStyle = 'rgba(150,120,70,0.35)';
        ctx.lineWidth = 1;
        hexagon(0, 0, 20);
        ctx.stroke();
      }

      // A ring shows how far the honey has come, for the filling cells.
      if (c.state === 'filling') {
        ctx.strokeStyle = 'rgba(255,214,120,0.85)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(0, 0, 26, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(c.t, 0, 1));
        ctx.stroke();
      } else if (c.state === 'ready') {
        ctx.strokeStyle = 'rgba(255,246,214,0.9)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(0, 0, 26, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(c.hold / combWindow(), 0, 1));
        ctx.stroke();
      }

      // A bee at work on a capped cell.
      if (c.state === 'capped' && c.pop > 0) {
        ctx.globalAlpha = c.pop;
        drawBee(6, -26 - c.pop * 8, 0.55);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
      addHit(c.x - 33, c.y - 30, 66, 60, 'cell', i);
    }

    // The mites, walking on the comb: a dark oval with legs, so it reads as
    // something alive on the wax rather than a spot of dirt.
    var aliveMites = 0;
    for (var mt = 0; mt < comb.mites.length; mt++) {
      var m2 = comb.mites[mt];
      if (!m2.dead) aliveMites++;
      if (m2.dead && clock - m2.dead > 0.8) continue;
      ctx.save();
      ctx.translate(m2.x, m2.y);
      if (m2.dead) { ctx.globalAlpha = Math.max(0, 1 - (clock - m2.dead) / 0.8); ctx.scale(1, 0.4); }
      ctx.fillStyle = '#5A3A20';
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 5, 0.2, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(40,24,12,0.85)';
      ctx.lineWidth = 1.2;
      for (var lg = -1; lg <= 1; lg++) {
        ctx.beginPath();
        ctx.moveTo(lg * 3, 2);
        ctx.lineTo(lg * 4.5, 6);
        ctx.stroke();
      }
      ctx.restore();
      addHit(m2.x - 14, m2.y - 14, 28, 28, 'mite', mt);
    }

    // What the comb holds, and how many mites are still on it.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(247,244,238,0.92)';
    roundRect(24, 118, 150, 34, 17);
    ctx.fill();
    ctx.fillStyle = C.ink;
    ctx.font = '600 12px ' + FONT_UI;
    ctx.fillText('honey  ' + comb.stores, 40, 135);
    ctx.fillStyle = 'rgba(247,244,238,0.92)';
    roundRect(216, 118, 150, 34, 17);
    ctx.fill();
    ctx.fillStyle = aliveMites ? C.terracotta : C.turquoiseDeep;
    ctx.font = '600 12px ' + FONT_UI;
    ctx.fillText(aliveMites ? 'mites  ' + aliveMites : 'no mites', 232, 135);
    ctx.textAlign = 'center';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (comb.msgAge < 3 && comb.msg) {
      ctx.fillStyle = C.terracotta;
      ctx.font = '500 12px ' + FONT_UI;
      ctx.fillText(comb.msg, 195, 748);
    } else if (!comb.done) {
      ctx.fillStyle = 'rgba(247,244,238,0.75)';
      ctx.font = '400 12px ' + FONT_UI;
      ctx.fillText('tap a cell when it glows', 195, 748);
    }
    ctx.textAlign = 'left';

    if (comb.done && clock - comb.doneAt > 3.6) {
      placeDoneCard('The comb is capped', 'Eight cells sealed with wax, and not a bee disturbed.', [
        'shane \u00b7 comb'
      ]);
      pageEnd();
      return;
    }
    pageEnd();
  }

  /* The inside of the hive, behind the comb and the queen. */
  function drawHiveRoom() {
    var bg = ctx.createLinearGradient(0, 0, 0, 844);
    bg.addColorStop(0, '#3B2A20');
    bg.addColorStop(0.5, '#4A3524');
    bg.addColorStop(1, '#33241B');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 390, 844);

    var glow = ctx.createRadialGradient(195, 300, 30, 195, 300, 330);
    glow.addColorStop(0, 'rgba(232,163,61,0.22)');
    glow.addColorStop(1, 'rgba(232,163,61,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, 390, 700);

    // Comb walls behind.
    ctx.strokeStyle = 'rgba(232,163,61,0.10)';
    ctx.lineWidth = 1.2;
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 5; c++) {
        hexagon(28 + c * 86 + (r % 2 ? 43 : 0), 96 + r * 78, 30);
        ctx.stroke();
      }
    }
  }

  /* ---- The queen: find her by how near each cell is ---------------------- */
  var queen = {
    at: 0, guess: 0, found: false, foundAt: 0,
    cells: [], notes: [], msg: '', msgAge: 9, done: false
  };

  function enterQueen() {
    queen.cells = [];
    queen.notes = [];
    queen.at = Math.floor(rand(0, 12));
    queen.found = false;
    queen.foundAt = 0;
    queen.msg = '';
    queen.msgAge = 9;
    queen.done = false;
    var cols = 4, cw = 82, ch = 88;
    var x0 = (390 - cols * cw) / 2 + cw / 2, y0 = 250 + ch / 2;
    for (var i = 0; i < 12; i++) {
      var r = Math.floor(i / cols), c = i % cols;
      queen.cells.push({ x: x0 + c * cw, y: y0 + r * ch, r: r, c: c, tapped: false });
      queen.notes.push(-1);
    }
  }

  function queenTap(p) {
    if (chromeTap(p)) return;
    if (queen.done) return;
    var h = hitAt(p);
    if (!h || h.act !== 'qcell') return;
    var i = h.arg;
    if (queen.notes[i] >= 0) return;
    if (i === queen.at) {
      queen.notes[i] = 0;
      queen.found = true;
      queen.foundAt = clock;
      sfx.deliver();
      teachWord('malake');
      return;
    }
    var dr = Math.abs(queen.cells[i].r - queen.cells[queen.at].r);
    var dc = Math.abs(queen.cells[i].c - queen.cells[queen.at].c);
    queen.notes[i] = Math.max(1, dr + dc);
    sfx.pick();
  }

  function updateQueen(dt) {
    if (queen.msgAge < 4) queen.msgAge += dt;
    if (queen.found && !queen.done && clock - queen.foundAt > 2.4) queen.done = true;
  }

  function autoQueen() {
    if (queen.done) { if (clock - queen.foundAt > 5.4) backToTitle(); return; }
    if (queen.found) return;
    for (var i = 0; i < 12; i++) {
      if (queen.notes[i] >= 0) continue;
      var c = queen.cells[i];
      queenTap({ x: c.x, y: c.y });
      return;
    }
  }

  function drawQueen(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);
    drawHiveRoom();
    placeHeader('The queen');
    countChip(queen.found ? 'found' : '12 cells', 262, 58, 116);

    for (var i = 0; i < 12; i++) {
      var c = queen.cells[i];
      var note = queen.notes[i];
      var isHer = queen.found && i === queen.at;
      ctx.save();
      ctx.translate(c.x, c.y);

      if (isHer) {
        var g = ctx.createRadialGradient(0, 0, 4, 0, 0, 46);
        g.addColorStop(0, 'rgba(255,226,150,0.6)');
        g.addColorStop(1, 'rgba(255,226,150,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, 46, 0, TAU);
        ctx.fill();
      }

      hexagon(0, 0, 34);
      ctx.fillStyle = isHer ? '#E8A33D' : note >= 0 ? '#5A4630' : '#463527';
      ctx.fill();
      ctx.strokeStyle = isHer ? 'rgba(255,240,200,0.95)' : 'rgba(255,196,110,0.5)';
      ctx.lineWidth = isHer ? 2.2 : 1.4;
      ctx.stroke();

      if (isHer) {
        drawQueenBee(0, 2, 0.85);
      } else if (note > 0) {
        ctx.fillStyle = 'rgba(255,236,200,0.85)';
        ctx.font = '600 15px ' + FONT_UI;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(note), 0, 1);
      }
      ctx.restore();
      addHit(c.x - 34, c.y - 31, 68, 62, 'qcell', i);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (!queen.found) {
      ctx.fillStyle = 'rgba(247,244,238,0.8)';
      ctx.font = '400 12px ' + FONT_UI;
      ctx.fillText('a number says how many cells away she is', 195, 700);
      ctx.fillStyle = 'rgba(247,244,238,0.55)';
      ctx.font = '400 11.5px ' + FONT_UI;
      ctx.fillText('tap a cell', 195, 724);
    }
    ctx.textAlign = 'left';

    if (queen.done && clock - queen.foundAt > 5.4) {
      placeDoneCard('The queen is found', 'She was carried gently to the middle frames.', [
        'malake \u00b7 queen'
      ]);
      pageEnd();
      return;
    }
    pageEnd();
  }

  /* A queen: longer than a worker, with a crown of gold. */
  function drawQueenBee(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.ellipse(-6, -10, 8, 5, -0.5, 0, TAU);
    ctx.ellipse(6, -10, 8, 5, 0.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#2A1F1A';
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 8, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = C.saffron;
    ctx.beginPath();
    ctx.ellipse(-4, 0, 2.4, 7, 0, 0, TAU);
    ctx.ellipse(3, 0, 2.4, 7, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = C.saffron;
    ctx.beginPath();
    ctx.moveTo(-8, -12); ctx.lineTo(-8, -20); ctx.lineTo(-3, -15); ctx.lineTo(2, -21); ctx.lineTo(7, -12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ---- The greenhouse: cross two blooms that carry a colour -------------- */
  var glass = {
    blooms: [], picked: [], target: 'coral', done: false, doneAt: 0,
    msg: '', msgAge: 9, child: null, childAt: -9, round: 0, rounds: 2
  };
  var BLOOM_COLOURS = {
    white: { petal: '#F5F0E2', centre: '#E0A32A', ink: '#7A6A50' },
    coral: { petal: '#E08A6A', centre: '#E0A32A', ink: '#8A4A32' },
    rose: { petal: '#D98AA2', centre: '#E0A32A', ink: '#7A3A4A' }
  };

  /* The petal colour of a bloom by its name, so the ring that marks a carrier is
     the colour it hides. */
  /* A hex colour at an alpha, so a wash can fade out. */
  function hexAlpha(hex, a) {
    var n2 = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n2 >> 16) & 255) + ',' + ((n2 >> 8) & 255) + ',' + (n2 & 255) + ',' + a + ')';
  }

  function bloomColour(name) {
    var c = BLOOM_COLOURS[name] || BLOOM_COLOURS.white;
    return c.petal;
  }

  function enterGlass() {
    glass.picked = [];
    glass.done = false;
    glass.doneAt = 0;
    glass.msg = '';
    glass.msgAge = 9;
    glass.child = null;
    glass.childAt = -9;
    glass.round = 0;
    glass.rounds = 2;
    glassRound();
  }

  function glassRound() {
    glass.picked = [];
    glass.child = null;
    glass.target = glass.round === 0 ? 'coral' : 'rose';
    // Four blooms: two show a colour and hide another, one is a plain
    // throwback, one is true to its colour. Only one pair gives the target.
    var bank = [
      // Four blooms, and exactly TWO of them hide the target. The one that displays
      // the target hides white, and the last is plain - so "cross two that hide it"
      // has exactly one answer, and the displayed colour is the decoy.
      { show: glass.target, carry: 'white', spent: false },
      { show: 'white', carry: glass.target, spent: false },
      { show: 'white', carry: glass.target, spent: false },
      { show: 'white', carry: 'white', spent: false }
    ];
    // Shuffle, seeded by the round so the answer is not in one place.
    var rnd = seeded(9001 + glass.round * 77);
    for (var i = bank.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = bank[i]; bank[i] = bank[j]; bank[j] = tmp;
    }
    glass.blooms = bank;
  }

  function glassTap(p) {
    if (chromeTap(p)) return;
    if (glass.done) return;
    var h = hitAt(p);
    if (!h) return;
    if (h.act === 'bloom' && !glass.child) {
      var i = h.arg;
      if (glass.blooms[i].spent) return;

      if (at >= 0) { glass.picked.splice(at, 1); return; }
      if (glass.picked.length >= 2) return;
      glass.picked.push(i);

      return;

        glass.msgAge = 0;
        return;
      }
      var a = glass.blooms[glass.picked[0]], b = glass.blooms[glass.picked[1]];

      glass.child = { colour: childColour, at: clock, a: a.show, b: b.show };
      glass.childAt = clock;
      if (childColour === glass.target) sfx.deliver(); else sfx.bee();
      return;
    }
    if (h.act === 'keep' && glass.child) {
      if (glass.child.colour === glass.target) {
        glass.round++;
        if (glass.round >= glass.rounds) {
          glass.done = true;
          glass.doneAt = clock;
          teachWord('tokhm');
          sfx.win();
        } else {
          glass.child = null;
          glassRound();
        }
      } else {
        glass.child = null;
        glass.blooms[glass.picked[0]].spent = true;
        glass.blooms[glass.picked[1]].spent = true;

        glass.msgAge = 0;

        for (var k = 0; k < glass.blooms.length; k++) if (!glass.blooms[k].spent) left++;

        glassTap({ x: bloomX(0), y: bloomY(0) });

    } catch (e) { /* nothing */ }

  /* Collecting: the eggs go in the bag, and the nest starts filling again. */
  function collectEggs() {
    if (nest.eggs <= 0) {
      hens.msg = 'The nest is bare. They are still laying.';
      hens.msgAge = 0;
      return;
    }
    var got = nest.eggs;
    nest.eggs = 0;

    nest.timer = 0;
    nestSave();
    bagInit();
    bagAdd({ f: 'tokhm', e: 'egg', p: '\u062a\u062e\u0645' });
    for (var i = 1; i < got; i++) bagAdd({ f: 'tokhm', e: 'egg', p: '\u062a\u062e\u0645' });
    teachWord('tokhm');
    hens.msg = got === 1 ? 'One egg, warm from the straw.' : got + ' eggs, warm from the straw.';
    hens.msgAge = 0;
    sfx.deliver();
  }

  function henBestTwo(aim) {
    var order = hens.birds.slice().sort(function (a, b) { return b[aim] - a[aim]; });
    return [hens.birds.indexOf(order[0]), hens.birds.indexOf(order[1])];
  }

  function henTap(p) {
    if (chromeTap(p)) return;
    if (hens.done) return;
    var h = hitAt(p);
    if (!h) return;
    if (h.act === 'eggs') { collectEggs(); return; }
    if (h.act === 'hen') {
      var i = h.arg;
      var at = hens.picked.indexOf(i);
      if (at >= 0) { hens.picked.splice(at, 1); return; }
      if (hens.picked.length >= 2) hens.picked.shift();
      hens.picked.push(i);
      sfx.pick();
      return;
    }
    if (h.act === 'pair') {
      if (hens.picked.length < 2) {
        hens.msg = 'Two hens, one from each side of the clutch.';
        hens.msgAge = 0;
        return;
      }
      var best = henBestTwo(hens.aim);
      var ok = (hens.picked[0] === best[0] && hens.picked[1] === best[1]) ||
               (hens.picked[0] === best[1] && hens.picked[1] === best[0]);
      if (ok) {
        hens.chick++;
        hens.round++;
        hens.picked = [];
        sfx.deliver();
        if (hens.round >= hens.rounds) {

          hens.doneAt = clock;

  /* ---- The kitchen: find a dish's exact ratio --------------------------- */
  var POT_ITEMS = ['rice', 'beans', 'greens', 'tomato', 'saffron'];
  var POT_DISHES = [
    {
      name: 'ash',
      riddle: 'rice twice the beans, and greens to match the beans',
      want: { rice: 2, beans: 1, greens: 1 }
    },
    {
      name: 'summer stew',
      riddle: 'tomato twice the beans, and one pinch of saffron',
      want: { tomato: 2, beans: 1, saffron: 1 }
    }
  ];
  var kitchen = {
    pot: {}, dish: 0, done: false, doneAt: 0, msg: '', msgAge: 9, stew: 0, cooked: null
  };

  function enterKitchen() {
    kitchen.pot = {};
    kitchen.dish = 0;
    kitchen.done = false;
    kitchen.doneAt = 0;
    kitchen.msg = '';
    kitchen.msgAge = 9;
    kitchen.stew = 0;
    kitchen.cooked = null;
  }

  function potTotal() {
    var t = 0;
    for (var k in kitchen.pot) t += kitchen.pot[k];
    return t;
  }

  function kitchenTap(p) {
    if (chromeTap(p)) return;
    if (kitchen.done) return;
    var h = hitAt(p);
    if (!h) return;
    if (h.act === 'item') {
      var name = POT_ITEMS[h.arg];
      var n = kitchen.pot[name] || 0;
      if (n >= 4) {
        kitchen.msg = 'Enough of the ' + name + '.';
        kitchen.msgAge = 0;
        return;
      }
      kitchen.pot[name] = n + 1;
      kitchen.cooked = null;
      sfx.pick();
      return;
    }
    if (h.act === 'clear') {
      kitchen.pot = {};
      kitchen.cooked = null;
      return;
    }
    if (h.act === 'cook') {
      if (potTotal() === 0) {
        kitchen.msg = 'The pot is empty.';
        kitchen.msgAge = 0;
        return;
      }
      var want = POT_DISHES[kitchen.dish].want;
      var ok = true, k;
      for (k in want) if ((kitchen.pot[k] || 0) !== want[k]) ok = false;
      for (k in kitchen.pot) if (!want[k] && kitchen.pot[k]) ok = false;
      if (ok) {
        kitchen.cooked = POT_DISHES[kitchen.dish].name;
        kitchen.dish++;
        sfx.deliver();
        if (kitchen.dish >= POT_DISHES.length) {
          kitchen.done = true;
          kitchen.doneAt = clock;
          teachWord('ash');
          sfx.win();
        }
      } else {
        kitchen.stew++;
        kitchen.cooked = 'a strange stew';
        kitchen.msg = 'Not the dish. Read the note again.';
        kitchen.msgAge = 0;
        kitchen.pot = {};
        sfx.bee();
      }
    }
  }

  function updateKitchen(dt) {
    if (kitchen.msgAge < 4) kitchen.msgAge += dt;
  }

  function autoKitchen() {
    if (kitchen.done) { if (clock - kitchen.doneAt > 3.6) backToTitle(); return; }
    var want = POT_DISHES[kitchen.dish];
    for (var i = 0; i < POT_ITEMS.length; i++) {
      var name = POT_ITEMS[i];
      var need = want.want[name] || 0;
      if ((kitchen.pot[name] || 0) < need) {
        kitchenTap({ x: itemX(i) + 40, y: itemY(i) + 30 });
        return;
      }
    }
    kitchenTap({ x: 195, y: 700 });
  }

  function itemX(i) { return 18 + (i % 3) * 120; }
  function itemY(i) { return 520 + Math.floor(i / 3) * 84; }

  function drawKitchen(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);

    var bg = ctx.createLinearGradient(0, 0, 0, 844);
    bg.addColorStop(0, '#EADFC8');
    bg.addColorStop(1, '#D6C6A6');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 390, 844);
    ctx.fillStyle = 'rgba(160,140,110,0.18)';
    for (var t = 0; t < 9; t++) ctx.fillRect(0, 300 + t * 60, 390, 30);

    placeHeader('The kitchen');

    // The note, pinned to the shelf.
    var dish = POT_DISHES[Math.min(kitchen.dish, POT_DISHES.length - 1)];
    ctx.fillStyle = '#FBF7EC';
    roundRect(24, 64, 342, 86, 8);
    ctx.fill();
    ctx.fillStyle = 'rgba(42,35,32,0.08)';
    roundRect(24, 66, 342, 4, 2);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.font = 'italic 600 19px ' + FONT_SERIF;
    ctx.fillText(dish.name, 195, 92);
    ctx.fillStyle = C.inkSoft;
    ctx.font = '400 11.5px ' + FONT_UI;
    var noteLines = wrapText(dish.riddle, 300, '400 11.5px ' + FONT_UI);
    ctx.font = '400 11.5px ' + FONT_UI;
    for (var nl = 0; nl < noteLines.length; nl++) ctx.fillText(noteLines[nl], 195, 114 + nl * 15);

    // The pot.
    ctx.fillStyle = '#3E4441';
    ctx.beginPath();
    ctx.ellipse(195, 300, 74, 22, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#565E5A';
    ctx.beginPath();
    ctx.moveTo(122, 300);
    ctx.quadraticCurveTo(126, 388, 195, 388);
    ctx.quadraticCurveTo(264, 388, 268, 300);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#6E7773';
    ctx.beginPath();
    ctx.ellipse(195, 300, 68, 18, 0, 0, TAU);
    ctx.fill();
    var stewLevel = clamp(potTotal() / 4, 0, 1);
    if (stewLevel > 0) {
      ctx.fillStyle = 'rgba(200,140,60,0.85)';
      ctx.beginPath();
      ctx.ellipse(195, 300 + 6 - stewLevel * 3, 62, 15, 0, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = '#3E4441';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(195, 322, 84, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();

    // What is in it.
    ctx.textAlign = 'center';
    ctx.fillStyle = C.inkSoft;
    ctx.font = '400 11px ' + FONT_UI;
    var parts = [];
    for (var pi = 0; pi < POT_ITEMS.length; pi++) {
      var nm = POT_ITEMS[pi];
      if (kitchen.pot[nm]) parts.push(kitchen.pot[nm] + ' ' + nm);
    }
    ctx.fillText(parts.length ? parts.join('  \u00b7  ') : 'nothing yet', 195, 424);
    if (kitchen.cooked) {
      ctx.fillStyle = kitchen.cooked === 'a strange stew' ? C.terracotta : C.turquoiseDeep;
      ctx.font = 'italic 600 14px ' + FONT_SERIF;
      ctx.fillText(kitchen.cooked, 195, 452);
    }

    // The shelf of things.
    for (var i = 0; i < POT_ITEMS.length; i++) {
      var x = itemX(i), y = itemY(i);
      var n2 = kitchen.pot[POT_ITEMS[i]] || 0;
      ctx.fillStyle = 'rgba(251,247,236,0.94)';
      roundRect(x, y, 108, 68, 9);
      ctx.fill();
      ctx.strokeStyle = n2 > 0 ? C.turquoise : 'rgba(160,140,110,0.5)';
      ctx.lineWidth = n2 > 0 ? 2 : 1;
      ctx.stroke();
      drawFood(x + 54, y + 30, POT_ITEMS[i]);
      ctx.fillStyle = C.inkSoft;
      ctx.font = '500 10.5px ' + FONT_UI;
      ctx.fillText(POT_ITEMS[i] + (n2 ? ' ' + n2 : ''), x + 54, y + 58);
      addHit(x, y, 108, 68, 'item', i);
    }

    // Cook, and empty the pot.
    ctx.fillStyle = potTotal() ? C.terracotta : 'rgba(140,120,90,0.35)';
    roundRect(195 - 74, 682, 148, 46, 23);
    ctx.fill();
    ctx.fillStyle = '#F7F4EE';
    ctx.font = '600 15px ' + FONT_UI;
    ctx.fillText('Cook', 195, 706);
    addHit(195 - 74, 682, 148, 46, 'cook');

    ctx.fillStyle = 'rgba(42,35,32,0.4)';
    roundRect(195 - 42, 740, 84, 30, 15);
    ctx.fill();
    ctx.fillStyle = 'rgba(251,247,236,0.9)';
    ctx.font = '500 11px ' + FONT_UI;
    ctx.fillText('empty it', 195, 756);
    addHit(195 - 42, 740, 84, 30, 'clear');

    if (kitchen.msgAge < 3 && kitchen.msg) {
      ctx.fillStyle = C.terracotta;
      ctx.font = '500 11.5px ' + FONT_UI;
      ctx.fillText(kitchen.msg, 195, 790);
    }
    ctx.textAlign = 'left';

    if (kitchen.done && clock - kitchen.doneAt > 3.6) {
      placeDoneCard('The pot knows', 'Two dishes by their ratios, and a strange stew on the way.', [
        'ash \u00b7 a herb stew'
      ]);
      pageEnd();
      return;
    }
    pageEnd();
  }

  function drawFood(x, y, name) {
    ctx.save();
    ctx.translate(x, y);
    if (name === 'rice') {
      ctx.fillStyle = '#F3EEDF';
      for (var i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.ellipse(-9 + (i % 4) * 6, -4 + Math.floor(i / 4) * 7, 3.2, 1.9, 0.4, 0, TAU);
        ctx.fill();
      }
    } else if (name === 'beans') {
      for (var j = 0; j < 3; j++) {
        ctx.fillStyle = ['#8E5A3A', '#A0673F', '#7C4E32'][j];
        ctx.beginPath();
        ctx.ellipse(-8 + j * 8, 2 - (j % 2) * 5, 5, 3.6, 0.3, 0, TAU);
        ctx.fill();
      }
    } else if (name === 'greens') {
      ctx.fillStyle = '#6E9A52';
      for (var k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.ellipse(-7 + k * 7, 0, 6, 3.4, -0.5 + k * 0.4, 0, TAU);
        ctx.fill();
      }
    } else if (name === 'tomato') {
      ctx.fillStyle = '#C8452F';

      ctx.arc(0, 1, 8, 0, TAU);

      }

  /* ---- The wagon: find the two parts in the yard, then fit them ---------- */
  var wagon = {
    spots: [], parts: [], found: 0, fitted: [], msg: '', msgAge: 9,
    done: false, doneAt: 0, lift: -9, liftSpot: -1
  };
  var WAGON_PARTS = ['wheel', 'handle'];

  function enterWagon() {
    wagon.parts = [];
    wagon.fitted = [];
    wagon.found = 0;
    wagon.msg = '';
    wagon.msgAge = 9;
    wagon.done = false;
    wagon.doneAt = 0;
    wagon.lift = -9;
    wagon.liftSpot = -1;
    // Seven places to look, and two of them hold a part.
    var rnd = seeded(4242);
    wagon.spots = [];
    var kinds = ['hay', 'crate', 'hay', 'barrel', 'bush', 'hay', 'crate'];
    var xs = [56, 160, 268, 330, 96, 210, 300];
    var ys = [300, 268, 300, 420, 452, 470, 568];
    for (var i = 0; i < kinds.length; i++) {
      wagon.spots.push({ x: xs[i], y: ys[i], kind: kinds[i], part: null, open: false });
    }
    var holes = [0, 1, 2, 3, 4, 5, 6];
    for (var h = holes.length - 1; h > 0; h--) {
      var j = Math.floor(rnd() * (h + 1));
      var t = holes[h]; holes[h] = holes[j]; holes[j] = t;
    }
    wagon.spots[holes[0]].part = 'wheel';
    wagon.spots[holes[1]].part = 'handle';
  }

  function wagonTap(p) {
    if (chromeTap(p)) return;
    if (wagon.done) return;
    var h = hitAt(p);
    if (!h) return;
    if (h.act === 'spot') {
      var s = wagon.spots[h.arg];
      if (s.open) return;
      s.open = true;
      wagon.lift = clock;
      wagon.liftSpot = h.arg;
      sfx.pick();
      if (s.part) {
        wagon.parts.push(s.part);
        wagon.found++;
        sfx.deliver();
        wagon.msg = s.part === 'wheel' ? 'The cart wheel, under the hay.' : 'The handle, behind the crate.';
        wagon.msgAge = 0;
      }
      return;
    }
    if (h.act === 'fit') {
      var want = h.arg;                 // 'wheel' then 'handle'
      if (wagon.parts.indexOf(want) < 0) {
        wagon.msg = want === 'wheel' ? 'The cart needs its wheel first.' : 'The handle bolts to the wheel.';
        wagon.msgAge = 0;
        sfx.bee();
        return;
      }
      if (wagon.fitted.indexOf(want) >= 0) return;
      wagon.fitted.push(want);
      wagon.parts.splice(wagon.parts.indexOf(want), 1);
      sfx.pick();
      if (wagon.fitted.length === 2) {
        wagon.done = true;
        wagon.doneAt = clock;
        teachWord('charkh');
        sfx.win();
      }
    }
  }

  function updateWagon(dt) {
    if (wagon.msgAge < 4) wagon.msgAge += dt;
  }

  function autoWagon() {
    if (wagon.done) { if (clock - wagon.doneAt > 3.6) backToTitle(); return; }
    if (wagon.found < 2) {
      for (var i = 0; i < wagon.spots.length; i++) {
        if (wagon.spots[i].open) continue;
        wagonTap({ x: wagon.spots[i].x, y: wagon.spots[i].y });
        return;
      }
      return;
    }
    if (wagon.fitted.indexOf('wheel') < 0) { wagonTap({ x: 120, y: 700 }); return; }
    if (wagon.fitted.indexOf('handle') < 0) { wagonTap({ x: 240, y: 700 }); return; }
  }

  function drawWagon(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);

    // A yard at golden hour.
    var sky = ctx.createLinearGradient(0, 0, 0, 260);
    sky.addColorStop(0, '#F6DCA8');
    sky.addColorStop(1, '#E9BE84');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 390, 250);
    var ground = ctx.createLinearGradient(0, 250, 0, 844);
    ground.addColorStop(0, '#A9B47C');
    ground.addColorStop(1, '#8C9A66');
    ctx.fillStyle = ground;
    ctx.fillRect(0, 250, 390, 594);
    ctx.fillStyle = 'rgba(120,96,60,0.25)';
    ctx.beginPath();
    ctx.ellipse(300, 232, 90, 26, 0, 0, TAU);
    ctx.fill();

    placeHeader('The wagon');

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.font = '600 12.5px ' + FONT_UI;
    ctx.fillText(wagon.found < 2 ? 'a wheel and a handle, somewhere here' : 'fit the parts to the cart', 195, 120);

    for (var i = 0; i < wagon.spots.length; i++) {
      var s = wagon.spots[i];
      var lifted = clock - wagon.lift < 0.4 && wagon.liftSpot === i;
      ctx.save();
      ctx.translate(s.x, s.y - (s.open ? 6 : 0) + (lifted ? -4 : 0));
      if (s.kind === 'hay') drawHaystack(s.open);
      else if (s.kind === 'crate') drawCrate(s.open);
      else if (s.kind === 'barrel') drawBarrel(s.open);
      else drawBush(s.open);
      ctx.restore();
      addHit(s.x - 40, s.y - 46, 80, 84, 'spot', i);
    }

    // The cart frame, and its two empty sockets.
    var cx = 195, cy = 690;
    ctx.strokeStyle = '#6B4A2F';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - 70, cy - 30);
    ctx.lineTo(cx + 60, cy - 30);
    ctx.lineTo(cx + 60, cy + 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 70, cy - 30);
    ctx.lineTo(cx - 96, cy + 2);
    ctx.stroke();

    drawSocket(cx - 70, cy + 18, 'wheel');
    drawSocket(cx + 40, cy + 12, 'handle');

    ctx.fillStyle = C.inkSoft;
    ctx.font = '500 10px ' + FONT_UI;
    ctx.fillText('wheel', cx - 70, cy + 62);
    ctx.fillText('handle', cx + 44, cy + 56);

    if (wagon.msgAge < 3.2 && wagon.msg) {
      ctx.fillStyle = C.terracotta;
      ctx.font = '500 11.5px ' + FONT_UI;
      ctx.fillText(wagon.msg, 195, 790);
    }
    ctx.textAlign = 'left';

    if (wagon.done && clock - wagon.doneAt > 3.6) {
      placeDoneCard('The cart rolls again', 'A wheel and a handle, found in the yard.', [
        'charkh \u00b7 wheel'
      ]);
      pageEnd();
      return;
    }
    pageEnd();
  }

  function drawSocket(x, y, which) {
    var fitted = wagon.fitted.indexOf(which) >= 0;
    var has = wagon.parts.indexOf(which) >= 0;
    if (fitted) {
      if (which === 'wheel') {
        ctx.strokeStyle = '#2A2320';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, TAU);
        ctx.stroke();
        ctx.lineWidth = 2;
        for (var i = 0; i < 6; i++) {
          var a = i * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(a) * 21, y + Math.sin(a) * 21);
          ctx.stroke();
        }
      } else {
        ctx.strokeStyle = '#2A2320';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, y + 16);
        ctx.lineTo(x, y - 12);
        ctx.lineTo(x + 14, y - 20);
        ctx.stroke();
        ctx.fillStyle = '#2A2320';
        ctx.beginPath();
        ctx.arc(x + 15, y - 22, 5, 0, TAU);
        ctx.fill();
      }
      return;
    }
    ctx.strokeStyle = has ? 'rgba(47,167,155,0.9)' : 'rgba(107,74,47,0.4)';
    ctx.lineWidth = 2;
    if (has) {
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(47,167,155,0.18)';
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, TAU);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, TAU);
      ctx.stroke();
    }
    addHit(x - 26, y - 26, 52, 52, 'fit', which);
  }

  function drawBarrel(open) {
    ctx.fillStyle = 'rgba(60,42,26,0.18)';

  /* ---- The lantern walk: keep the next lamp lit before she reaches it ---- */

  function pathLength() {
    var total = 0;
    for (var i = 1; i < LANTERN_PATH.length; i++) {
      total += dist(LANTERN_PATH[i - 1][0], LANTERN_PATH[i - 1][1], LANTERN_PATH[i][0], LANTERN_PATH[i][1]);

  function pathPoint(t) {
    var total = pathLength();
    var want = clamp(t, 0, 1) * total;

      var seg = dist(a[0], a[1], b[0], b[1]);
      if (run + seg >= want) {
        var k = (want - run) / seg;
        return { x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k };

  /* ---- The bee-line: average three bearings, then pick the tree --------- */
  var BEARINGS = [41, 58, 47];

    removal.face = -1;
    removal.tapped = 0;
    removal.scattered = false;
    removal.done = false;
    removal.doneAt = 0;
    removal.msg = '';
    removal.msgAge = 9;
    removal.sting = -9;
    removal.queenFace = 2;
    removal.follow = 0;
  }

  function removalWrong(text) {
    removal.agitation = Math.min(100, removal.agitation + 8);
    removal.msg = text;
    removal.msgAge = 0;
    removal.sting = clock;
    sfx.bee();
  }

  function removalAdvance() {
    removal.step++;
    removal.puffs = 0;
    removal.cuts = 0;
    removal.tapped = 0;
    sfx.deliver();
    if (removal.step >= REMOVAL_STEPS.length) {
      removal.done = true;
      removal.doneAt = clock;
      teachWord('duud');
      sfx.win();
    }
  }

  function removalTap(p) {
    if (chromeTap(p)) return;
    if (removal.done || removal.scattered) return;
    var h = hitAt(p);
    if (!h) return;

    if (h.act === 'hollow') {
      if (removal.step !== 0) { removalWrong('The entrance is already surveyed.'); return; }
      removalAdvance();
      return;
    }
    if (h.act === 'smoker') {
      if (removal.step !== 1) { removalWrong('Smoke later, or not at all.'); return; }
      removal.puffs++;
      removal.agitation = Math.min(100, removal.agitation + 4);
      removal.msg = removal.puffs === 1 ? 'A soft puff. They settle.' : 'Enough smoke. Too much buries her deeper.';
      removal.msgAge = 0;
      sfx.pick();
      if (removal.puffs >= 2) removalAdvance();
      return;
    }
    if (h.act === 'track') {
      if (removal.step !== 2) { removalWrong('The knife waits.'); return; }
      var inZone = removal.knife > 0.38 && removal.knife < 0.62;
      if (inZone) {
        removal.cuts++;
        sfx.pick();
        if (removal.cuts >= 4) removalAdvance();
      } else {
        removalWrong('A ragged cut. The cells spoil.');
      }
      return;
    }
    if (h.act === 'face') {
      if (removal.step === 3) {
        if (h.arg === removal.queenFace) {
          removal.face = h.arg;
          removalAdvance();
        } else {
          removalWrong('Only comb and brood. She is deeper.');
        }
        return;
      }
      if (removal.step === 4) {
        if (h.arg !== removal.face) { removalWrong('That is not the face she is on.'); return; }
        removalAdvance();
        return;
      }
      removalWrong('Now is not the time for the combs.');
      return;
    }
    if (h.act === 'queen') {
      if (removal.step !== 4) { removalWrong('Cage her before you move her.'); return; }
      removalAdvance();
      return;
    }
    if (h.act === 'cluster') {
      if (removal.step !== 5) { removalWrong('Free the faces first.'); return; }
      removal.tapped++;
      removal.follow = Math.min(100, removal.tapped * 18);
      sfx.pick();
      if (removal.follow >= 70) removalAdvance();
      return;
    }
    if (h.act === 'verb') {
      var v = REMOVAL_STEPS[h.arg];
      if (v !== REMOVAL_STEPS[removal.step]) removalWrong('Not yet: ' + v + ' comes later.');
    }
  }

  function updateRemoval(dt) {
    if (removal.msgAge < 4) removal.msgAge += dt;
    if (removal.done || removal.scattered) return;
    if (removal.step === 2) {
      removal.knife += removal.knifeDir * dt * 0.85;
      if (removal.knife >= 1) { removal.knife = 1; removal.knifeDir = -1; }
      if (removal.knife <= 0) { removal.knife = 0; removal.knifeDir = 1; }
    }
    if (removal.step > 0) removal.agitation = Math.min(100, removal.agitation + dt * 1.5);
    if (removal.agitation >= 100) {
      removal.scattered = true;
      removal.msg = 'The colony scatters into the trees.';
      removal.msgAge = 0;
      sfx.lose();
    }
  }

  function autoRemoval() {
    if (removal.scattered) { if (clock - removal.sting > 2.6) backToTitle(); return; }
    if (removal.done) { if (clock - removal.doneAt > 3.8) backToTitle(); return; }
    var step = REMOVAL_STEPS[removal.step];
    if (step === 'survey') removalTap({ x: 195, y: 300 });
    else if (step === 'smoke') removalTap({ x: 84, y: 640 });
    else if (step === 'cut') {
      if (removal.knife > 0.44 && removal.knife < 0.56) removalTap({ x: 195, y: 560 });
    } else if (step === 'queen') {
      removalTap({ x: faceX(removal.queenFace), y: faceMid(removal.queenFace) });
    } else if (step === 'cage') {
      removalTap({ x: faceX(removal.queenFace), y: faceMid(removal.queenFace) });
    } else if (step === 'evacuate') {
      removalTap({ x: 195, y: 470 });
    }
  }

    if (removal.step === 0) {

      ctx.lineWidth = 2;

  var regionState = {};

  function regionOf(id) {
    for (var i = 0; i < REGIONS.length; i++) if (REGIONS[i].id === id) return REGIONS[i];
    return null;
  }

  function enterRegion(id) {
    var r = regionOf(id);
    regionState[id] = {
      found: {}, rowed: !r.boat, rowing: 0, done: false, doneAt: 0, hint: r.verb
    };
  }

  function regionFound(st) {
    var n = 0;
    for (var k in st.found) if (st.found[k]) n++;
    return n;
  }

  /* Taking a thing is one act, whether a finger or the autopilot does it. */
  function takeFind(r, st, i) {
    if (st.found[i] || st.done) return false;
    st.found[i] = true;
    var f = r.finds[i];
    st.hint = storyWord(f.f).e;
    teachWord(f.f);
    sfx.pop ? sfx.pop() : null;
    if (regionFound(st) >= r.finds.length) {
      st.done = true;
      st.doneAt = clock;
      teachWord(r.word);
      sfx.win();
      storyMark(r.id);
    }
    return true;
  }

  function regionDownIn(id, p) {
    if (chromeTap(p)) return;
    var r = regionOf(id), st = regionState[id];
    if (st.done) return;
    var h = hitAt(p);
    if (!h) return;
    if (h.act === 'boat') {
      if (!st.rowed && st.rowing <= 0) { st.rowing = 1.4; st.hint = 'the oars take you out'; }
      return;
    }
    if (h.act === 'find') takeFind(r, st, h.arg);

  function updateRegion(id, dt) {
    var st = regionState[id];
    if (!st) return;
    if (st.rowing > 0) {
      st.rowing -= dt;
      if (st.rowing <= 0) { st.rowing = 0; st.rowed = true; st.hint = 'tap what the water brings up'; }
    }
  }

    var r = regionOf(id), st = regionState[id];
    if (st.done) { if (clock - st.doneAt > 3.4) backToTitle(); return; }
    if (!st.rowed) { if (st.rowing <= 0) st.rowing = 1.4; return; }
    for (var i = 0; i < r.finds.length; i++) if (!st.found[i]) { takeFind(r, st, i); return; }

  /* What the ground holds: one small drawing per kind of find. */
  function drawFindIcon(x, y, f, s) {
    s = s || 1;
    ctx.save();
    ctx.translate(x, y);
    if (f === 'qarch') {
      ctx.fillStyle = '#E8DCC0';
      ctx.fillRect(-2 * s, 0, 4 * s, 9 * s);
      ctx.fillStyle = '#B4553F';
      ctx.beginPath();
      ctx.ellipse(0, -2 * s, 9 * s, 6 * s, 0, 0, TAU);
      ctx.fill();
    } else if (f === 'par') {
      ctx.strokeStyle = '#EDE4D2';
      ctx.lineWidth = 1.6 * s;
      ctx.beginPath();
      ctx.moveTo(-8 * s, 6 * s);
      ctx.quadraticCurveTo(2 * s, -6 * s, 9 * s, -4 * s);
      ctx.stroke();
      ctx.fillStyle = 'rgba(237,228,210,0.9)';
      ctx.beginPath();
      ctx.ellipse(2 * s, 0, 5 * s, 2.4 * s, -0.5, 0, TAU);
      ctx.fill();
    } else if (f === 'sang') {
      ctx.fillStyle = '#9B978C';
      ctx.beginPath();
      ctx.ellipse(0, 0, 9 * s, 6.5 * s, 0.2, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.ellipse(-2 * s, -2 * s, 3.4 * s, 2 * s, 0.2, 0, TAU);
      ctx.fill();
    } else if (f === 'balut') {
      ctx.fillStyle = '#8B5A2B';
      ctx.beginPath();
      ctx.ellipse(0, 1 * s, 5 * s, 7 * s, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#5E3C1C';
      ctx.beginPath();
      ctx.ellipse(0, -5 * s, 6 * s, 3 * s, 0, 0, TAU);
      ctx.fill();
    } else if (f === 'giah') {
      ctx.strokeStyle = '#6E8447';
      ctx.lineWidth = 2 * s;
      for (var gi = -1; gi <= 1; gi++) {
        ctx.beginPath();
        ctx.moveTo(0, 7 * s);
        ctx.quadraticCurveTo(gi * 6 * s, 0, gi * 9 * s, -8 * s);
        ctx.stroke();
      }
    } else if (f === 'gol') {
      ctx.fillStyle = '#D06A8A';
      for (var pi = 0; pi < 5; pi++) {
        var a = pi * TAU / 5;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * 5 * s, Math.sin(a) * 5 * s, 3.6 * s, 3 * s, a, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = '#E3B23C';
      ctx.beginPath();
      ctx.arc(0, 0, 2.6 * s, 0, TAU);
      ctx.fill();
    } else if (f === 'tokhm') {
      ctx.fillStyle = '#C9A159';
      for (var ti = 0; ti < 4; ti++) {
        ctx.beginPath();
        ctx.ellipse((ti - 1.5) * 5 * s, (ti % 2) * 3 * s, 2.4 * s, 3.4 * s, 0.4, 0, TAU);
        ctx.fill();
      }
    } else if (f === 'fosil') {
      ctx.strokeStyle = '#8D7B5E';
      ctx.lineWidth = 2 * s;
      ctx.beginPath();
      for (var fi = 0; fi < 26; fi++) {
        var fa = fi * 0.5, fr = 1.6 * s + fa * 0.55 * s;
        var fxp = Math.cos(fa) * fr, fyp = Math.sin(fa) * fr * 0.8;
        if (fi === 0) ctx.moveTo(fxp, fyp); else ctx.lineTo(fxp, fyp);
      }
      ctx.stroke();
    } else if (f === 'namak') {
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath();
      ctx.moveTo(0, -9 * s);
      ctx.lineTo(7 * s, 0);
      ctx.lineTo(0, 9 * s);
      ctx.lineTo(-7 * s, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(180,200,210,0.9)';
      ctx.lineWidth = 1 * s;
      ctx.stroke();
    } else if (f === 'sadaf') {
      ctx.fillStyle = '#F0DCD2';
      ctx.beginPath();
      ctx.moveTo(0, 6 * s);
      ctx.quadraticCurveTo(-11 * s, -2 * s, -7 * s, -7 * s);
      ctx.quadraticCurveTo(0, -10 * s, 7 * s, -7 * s);
      ctx.quadraticCurveTo(11 * s, -2 * s, 0, 6 * s);
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,150,140,0.8)';
      ctx.lineWidth = 1 * s;
      for (var si2 = -2; si2 <= 2; si2++) {
        ctx.beginPath();
        ctx.moveTo(0, 5 * s);
        ctx.lineTo(si2 * 3.6 * s, -7 * s);
        ctx.stroke();
      }
    } else if (f === 'chub') {
      ctx.strokeStyle = '#9A7248';
      ctx.lineWidth = 4 * s;
      ctx.beginPath();
      ctx.moveTo(-10 * s, 4 * s);
      ctx.quadraticCurveTo(0, -3 * s, 11 * s, -2 * s);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRegion(id, cssW, cssH) {
    var r = regionOf(id), st = regionState[id];
    hits = [];
    pageBegin(cssW, cssH);
    drawRegionScene(r, st);

    var i;
    for (i = 0; i < r.finds.length; i++) {
      var f = r.finds[i];
      if (st.found[i]) continue;
      if (r.boat && !st.rowed) continue;
      drawFindIcon(f.x, f.y, f.f, 1.6);
      addHit(f.x - 26, f.y - 26, 52, 52, 'find', i);
    }

    if (r.boat && !st.rowed && st.rowing <= 0) {
      ctx.fillStyle = 'rgba(247,244,238,0.9)';
      roundRect(135, 736, 120, 40, 20);
      ctx.fill();
      ctx.strokeStyle = 'rgba(216,204,184,0.95)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = C.ink;
      ctx.font = '600 13px ' + FONT_UI;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('row out', 195, 756);
      ctx.textAlign = 'left';
      addHit(135, 736, 120, 40, 'boat');
    }

    placeHeader(r.label);
    countChip(regionFound(st) + ' / ' + r.finds.length, 262, 58, 116);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(247,244,238,0.92)';
    ctx.font = 'italic 400 12px ' + FONT_SERIF;
    var hintW = ctx.measureText(st.hint).width + 28;
    roundRect(195 - hintW / 2, 780, hintW, 30, 15);
    ctx.fill();
    ctx.fillStyle = C.inkSoft;
    ctx.fillText(st.hint, 195, 796);
    ctx.textAlign = 'left';

    if (st.done && clock - st.doneAt > 1.6) {
      var page = storyPage(r.id);
      drawPaperCard(390, 844, r.label + ', kept', 'What the ground gave.', [
        r.finds.length + ' finds, and ' + r.finds.length + ' words',
        wordsLine()
      ], 'Tap to go back', page);
      hits = [];
      addHit(0, 0, 390, 844, 'card');
    }
    pageEnd();
  }

  function enterYard() {}

  function yardDown(p) {
    if (chromeTap(p)) return;

  function drawYard(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);
    ctx.fillStyle = C.plaster;
    ctx.fillRect(0, 0, 390, 844);
    ctx.strokeStyle = 'rgba(42,35,32,0.16)';
    ctx.lineWidth = 1;
    ctx.strokeRect(18, 18, 354, 808);

    placeHeader('the yard');
    var gy = 96;
    for (var g = 0; g < PLACE_GROUPS.length; g++) {
      var group = PLACE_GROUPS[g];
      ctx.textAlign = 'left';
      ctx.fillStyle = C.inkFaint;
      ctx.font = '600 9px ' + FONT_UI;
      var labelW = 0;
      for (var lc = 0; lc < group.label.length; lc++) labelW += ctx.measureText(group.label[lc]).width + 1.6;
      spacedText(group.label.toUpperCase(), 26 + labelW / 2, gy, 1.6);

      var tw = 82, gapT = 7;
      for (var t = 0; t < group.ids.length; t++) {
        var id = group.ids[t];
        var def = placeDef(id);
        if (!def) continue;
        var tx = 26 + t * (tw + gapT);
        drawTile(tx, gy + 12, tw, 66, id, def);
        addHit(tx, gy + 12, tw, 66, 'place', id);
      }
      gy += 92;
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = C.inkFaint;
    ctx.font = '400 11px ' + FONT_UI;
    ctx.fillText('the wild is on the chart', 195, 802);
    ctx.textAlign = 'left';
    pageEnd();
  }

  /* One dispatcher, one entry per shape. Colour is read from the species' own
     name, so a fig and a beech are never the same green. Everything sways,
     bobs or breathes: the island is alive even when she stands still. */
  function hueOf(id) {
    var h = 0, i;
    for (i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 9973;
    return h;

  /* How much she displaces something standing at (x, y): a lean away from her,
     strongest at her feet and nothing beyond a stride's length. */
  function pushFrom(x, y, reach) {
    var r = reach || 56;
    var dx = x - hero.x, dy = y - hero.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > r || d < 0.001) return null;
    var k = 1 - d / r;
    return { lean: (dx / d) * k, drop: k };

  /* ---- The animals: traced outlines --------------------------------------- */
  /* Each species below is an explicit OUTLINE, traced point by point in a box
     one unit tall and one unit from rump to nose, with the ground at y = 0. No
     control points are computed from measurements: the shape you see is the
     shape in the list. The points are rounded through their midpoints
     (roundPath), which is how a silhouette is drawn by hand.

     The proportions are still the published ones - wild boar: shoulder 75-80 cm,
     head-body 150 cm, head a third of the animal, shoulders the highest point,
     hindquarters underdeveloped, legs short, mane along the spine, tusks
     curving up; grey wolf: shoulder 80-85, head-body 105-160, head 27; red fox:
     shoulder 35-50, head-body 45-90, tail as long as the body; goitered
     gazelle: shoulder 60-80, head-body 90-115, head 21 - and they are what the
     outline points describe. */

  /* Her drawn height in pixels: the measure every other living thing is a
     fraction of. Her markup is 160 units tall at scale 1 and she is drawn at
     R.heroSize / 158, so this is the standing height she shows. */
  var KEEPER_PX = R.heroSize * 160 / 158;

  /* How tall each kind stands on the island, as a share of her height. These are
     the only numbers a person should have to choose. How tall the drawing itself
     is at scale 1 is measured at boot, not guessed, because a guess was wrong
     every time (a daisy drew 21 px against a target of 38). */
  var SPECIES_HEIGHT = {
    tree: 3.0,      // a plane tree: three times her
    tall: 4.0,      // a cypress, taller still
    droop: 2.7,     // a willow, wide and lower
    round: 3.0,
    tuft: 0.11,     // grass at her ankle
    stem: 0.34,     // a flower at her knee
    vine: 0.16,
    reed: 0.75,
    plant: 0.34,
    fungus: 0.13,
    bird: 0.17,
    fish: 0.19,
    hen: 0.34,
    cat: 0.24,
    dog: 0.46,
    being: 1.02,    // her own height, or near it
    find: 0.10,
    insect: 0.07,   // a bee drawn at many times life, or invisible
    frog: 0.08,
    seal: 0.42
  };

  /* A representative of each kind, so the measurement has a species row to draw. */
  var SPECIES_SAMPLE = {
    tree: 'plant-chenar', tall: 'plant-cypress', droop: 'plant-willow',
    round: 'plant-chenar', tuft: 'plant-grass', stem: 'plant-daisy',
    vine: 'plant-melon', reed: 'plant-reed', plant: 'plant-daisy',
    fungus: 'fungus-capstem', bird: 'bird-sunbird', fish: 'fish-kapor',
    hen: 'chicken-red', cat: 'pet-blackcat', dog: 'pet-shepherd',
    being: 'being-shepherd', find: 'pickup-shell', insect: 'creature-honeybee',
    frog: 'creature-frog', seal: 'creature-caspianseal'
  };

  /* How tall each drawing really is at scale 1, measured from the drawings
     themselves. A boot-time measurement refines these, but these are the values
     that hold if the measurement cannot run. */
  var SPECIES_NATURAL = {
    tree: 103, tall: 121, droop: 93, round: 103,
    tuft: 41, stem: 54, vine: 47, reed: 41, plant: 54,
    fungus: 41, bird: 26, fish: 17, hen: 46,
    cat: 40, dog: 38, being: 55, find: 16, insect: 19,
    frog: 24, seal: 30
  };

  /* How tall each drawing is at 1x, measured once by drawing it and scanning the
     ink. Cached, because it costs a scratch canvas per kind and never changes. */
  function drawHeights() { return SPECIES_NATURAL; }

  /* Re-take the table: draw one of each kind raw, at scale 1, on a scratch canvas
     and report the ink's height. Console: __probeNaturals(). */
  window.__probeNaturals = function () {
    var box = 700;
    var probe = document.createElement('canvas');
    probe.width = box; probe.height = box;
    var g = probe.getContext('2d');
    var prev = ctx;
    var out = {};
    for (var key in SPECIES_HEIGHT) {
      if (!Object.prototype.hasOwnProperty.call(SPECIES_HEIGHT, key)) continue;
      var sp = findSpecies(SPECIES_SAMPLE[key]);
      if (!sp) { out[key] = null; continue; }
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, box, box);
      ctx = g;
      g.save();
      g.translate(box / 2, box - 60);
      try { drawSpeciesRaw(sp, 0, 0, 0, 1); } catch (e) { out[key] = 'threw'; ctx = prev; continue; }
      g.restore();
      ctx = prev;
      var d = g.getImageData(0, 0, box, box).data;
      var top = -1, bot = -1;
      for (var y = 0; y < box; y++) {
        for (var x = 0; x < box; x++) {
          if (d[(y * box + x) * 4 + 3] > 24) { if (top < 0) top = y; bot = y; }
        }
      }
      out[key] = bot > top ? (bot - top) : 0;
    }
    return out;
  };

    // animal's own nose-up height, not guessed from a drawing:
    //   maral 180 cm, onager 165, bear 140, lion 130, tiger 120, fallow deer 120,
    //   ibex 120, urial 115, bezoar 115, mouflon 105, sheep 110, goat 105,
    //   boar 100, gazelle 98, cheetah 95, wolf 95, hyena 90, leopard 85, pig 80,
    //   jackal 60, seal 60, fox 48, hare 45, rabbit 30, hedgehog 20, dormouse 11.
    maral: 1.15, onager: 1.05, gurkhar: 1.05, horse: 1.05,
    bear: 0.89, lion: 0.83, tiger: 0.76, deer: 0.76, ibex: 0.76,
    urial: 0.73, bezoar: 0.73, ahu: 0.64, sheep: 0.70, mouflon: 0.67, goat: 0.67,
    boar: 0.64, gazelle: 0.62, cheetah: 0.61, wolf: 0.61, hyena: 0.57,
    leopard: 0.54, pig: 0.51, jackal: 0.38, seal: 0.38, fox: 0.31,
    hare: 0.29, rabbit: 0.19, hedgehog: 0.13, dormouse: 0.07, mouse: 0.06,
    shepherd: 0.94, retriever: 0.44, terrier: 0.30,
    tabby: 0.21, ginger: 0.21, blackcat: 0.21

  /* The scale for one living thing: its own target height in pixels over how
     tall its drawing is at scale 1. */
  /* A drawing fills about seven tenths of the height it is given: the ink sits
     inside its box. Measured across every kind with __measure (tiger 0.74, tree
     0.72, grass 0.70, gaze 0.70), so one correction covers them all. */
  var INK_FILL = 0.83;

  function speciesScale(e) {
    if (!e) return 1;
    var key = e.sh === 'plant' ? (e.ps || 'stem') : e.sh;
    var of = SPECIES_HEIGHT[key];
    if (of === undefined) of = SPECIES_HEIGHT[e.sh];
    if (of === undefined) return 1;
    var nat = drawHeights()[key] || 40;
    return (KEEPER_PX * of) / (nat * INK_FILL);

  /* How tall an animal stands, in pixels: its share of her height. */
  /* Could she net it? A hare, a bird, a beetle yes; a deer, a boar, a bear no.
     The line is her own height: anything standing taller than her knees is
     watched, not caught. */
  function tooLargeToNet(e) {
    if (!e) return false;
    if (e.sh === 'bird' || e.sh === 'insect' || e.sh === 'frog') return false;
    if (e.sh === 'fish' || e.sh === 'seal') return true;
    if (e.sh === 'beast') return beastHeight(e) > KEEPER_PX * 0.55;
    return false;
  }

  function beastHeight(e) {
    var keys = Object.keys(BEAST_SIZE);
    var id = e.id || '';
    for (var i = 0; i < keys.length; i++) {
      if (id.indexOf(keys[i]) >= 0) return KEEPER_PX * BEAST_SIZE[keys[i]] / INK_FILL;
    }
    return KEEPER_PX * 0.5 / INK_FILL;
  }
