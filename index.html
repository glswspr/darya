        if (wetP) {
          if (qr > 0.86) {
            wq.x = psp.cx + (qr ? qdx / qr : 0.4) * psp.rx * 0.62;
            wq.y = psp.cy + (qr ? qdy / qr : 0.2) * psp.ry * 0.62;
          }
        } else if (qr < 1.06) {
          if (qr < 0.02) {
            // Dead centre: there is no radius to walk out along, so it goes to
            // the near bank directly.
            wq.x = psp.cx;
            wq.y = psp.cy + psp.ry * 1.12;
          } else {
            // Push it out to just beyond the water, in the radii's own units.
            var kk = 1.06 / qr;
            wq.x = psp.cx + (qdx * psp.rx) * kk;
            wq.y = psp.cy + (qdy * psp.ry) * kk;
          }
        }
      }
    }

    // In a river section nothing stands in the water: the channel is a place to
    // look at, and everything she can reach is on a bank.
    if (d.kind === 'river') {
      for (i = 0; i < out.length; i++) {
        var rp = out[i];
        if (rp.y > H * 0.94) continue;
        var wet = rp.k === 'species' &&
          (rp.sp.sh === 'fish' || rp.sp.sh === 'frog' || rp.sp.sh === 'seal');
        var vv = clamp(rp.y / H, 0, 1);
        var cc = riverCentre(vv, d.name) * W;
        var hh = riverHalfWidth(vv, d.name) * W;
        if (wet) {
          // A fish is in the water, near its middle, where it can swim.
          rp.x = cc + (rp.x < cc ? -1 : 1) * hh * 0.42;
          rp.y = clamp(rp.y, H * 0.10, H * 0.92);
        } else if (inRiver(rp.x, rp.y, W, H)) {
          // Everything else stands on the nearer bank.
          rp.x = rp.x < cc ? cc - hh - 30 : cc + hh + 30;
          rp.x = clamp(rp.x, W * 0.09, W * 0.91);
        }
      }
    }

    // Nothing stands where the ground refuses it - swept gravel, surf, water.
    // Walked out of the blocked area, so a plant in the pond comes to its edge.
    for (var bi2 = 0; bi2 < out.length; bi2++) {
      var bp2 = out[bi2];
      if (bp2.k === 'bed' || bp2.k === 'carved' || bp2.k === 'water' || bp2.k === 'bench') continue;
      var guard3 = 0;
      while (groundBlocks(bp2.x, bp2.y) && guard3 < 14) {
        bp2.x = clamp(bp2.x + (bp2.x < W * 0.5 ? -26 : 26), 30, W - 30);
        guard3++;
      }
    }

    // Nothing stands cut in half by a seam. The margin is each thing's own size,
    // so a tree keeps well clear and a stone may stand nearer the edge.
    for (var ci = 0; ci < out.length; ci++) {
      var cp = out[ci];
      if (cp.k === 'boarded') continue;
      var halfW = 26, halfH = 20;
      if (cp.k === 'species' && cp.sp) {
        var hpx = cp.sp.sh === 'beast' ? beastHeight(cp.sp) : 60 * speciesScale(cp.sp);
        halfW = Math.max(18, hpx * 0.55);
        halfH = Math.max(14, hpx * 0.16);
      } else if (cp.k === 'house' || cp.k === 'door') {
        halfW = 110; halfH = 70;
      }
      cp.x = clamp(cp.x, halfW + 12, W - halfW - 12);
      cp.y = clamp(cp.y, halfH + 96, H - halfH - 24);
    }

    // A finding she has already taken is no longer on the ground: the bag is the
    // record, so a rebuilt prop list cannot grow it back.
    if (!interior) {
      var keep = [];
      for (var tk = 0; tk < out.length; tk++) {
        var tp = out[tk];
        if (tp.k === 'species' && tp.sp && tp.sp.sh === 'find') {
          var tkey = sectionId(section.cx, section.cy) + ':' +
            Math.round(tp.x) + ':' + Math.round(tp.y);
          if (takenHere[tkey]) continue;
        }
        keep.push(tp);
      }
      out = keep;
    }
    // Cache the FINISHED list, or the cache hands back what was filtered out.
    for (i = 0; i < out.length; i++) { out[i].i = i; }
    propCache[key] = out;
    return out;
  }

  /* What you do with a thing, in one place: a finding is taken, a bird is watched,
     an animal is watched, a person is met, a plant is looked at. Every species prop
     asks this, so no caller invents its own verb. */
  function propVerbFor(e) {
    if (!e) return 'look';
    if (e.sh === 'find') return 'take the ' + shortName(e);
    if (e.sh === 'fish' || e.sh === 'seal') {
      // Water: she can see it, she cannot chase it.
      return 'watch the ' + shortName(e);
    }
    if (e.sh === 'bird' || e.sh === 'insect' || e.sh === 'frog' ||
      e.sh === 'beast' || e.sh === 'cat' || e.sh === 'dog' || e.sh === 'hen') {
      return tooLargeToNet(e) ? 'watch the ' + shortName(e) + ' from afar'
        : 'net the ' + shortName(e);
    }
    if (e.sh === 'being') return 'hear ' + shortName(e) + ' out';
    if (e.sh === 'fungus') return 'look at the ' + shortName(e);
    return 'look at the ' + shortName(e);
  }

  function shortName(e) {
    var n = (e.e || e.f || '').split(',')[0].trim();
    if (!n) return e.f;
    // A verb reads "tend the pumpkin", not "tend the Pumpkin": every caller puts
    // this inside a sentence, and a species row stores a proper name.
    return n.charAt(0).toLowerCase() + n.slice(1);
  }

  /* Some biomes carry few species of their own (the apiary has four bees, the
     shore has a shell). A ground with three things on it reads empty, so each
     thin biome borrows the plants that grow there in the original game. */
  var FILLER = {
    apiary: ['plant-clover', 'plant-daisy', 'plant-rose', 'plant-lavender', 'plant-grass', 'plant-mint'],
    sea: ['fish-mahi', 'fish-kapor', 'bird-starling', 'bird-housesparrow', 'fish-ghezelala', 'bird-magpie'],
    beach: ['plant-reed', 'plant-grass', 'bird-hoodedcrow', 'pickup-shell', 'plant-saltbush', 'pickup-feather'],
    river: ['plant-reed', 'plant-grass', 'plant-clover', 'bird-starling'],
    henhouse: ['plant-clover', 'plant-grass', 'plant-daisy', 'creature-ant'],
    pond: ['plant-reed', 'plant-waterlily', 'plant-grass', 'bird-barnswallow'],
    heights: ['plant-grass', 'plant-tulip', 'plant-thymebush'],
    glass: ['plant-tomato', 'plant-basil', 'plant-mint', 'plant-rose', 'plant-beans', 'plant-strawberry', 'plant-jasmine', 'plant-geranium'],
    desert: ['plant-saltbush', 'plant-wildrue', 'plant-grass'],
    steppe: ['plant-grass', 'plant-thymebush', 'plant-milkvetch'],
    yard: ['plant-geranium', 'plant-grass', 'plant-rose', 'plant-clover']
  };

  /* A section is a room, not a zoo. Four living things at most: the island has
     thirty-two sections, so the whole bestiary is spread thin rather than each
     ground carrying half of it. Two sections of the same ground get different
     slices, rotated by where they sit, so no two woods read alike. */
  /* What lives on the open water. There is no SPECIES row for it because it is
     not a biome with a ground: only what swims and what flies. */
  function openWaterSpecies(cx, cy) {
    // The sea's own swimmers and fliers, from the island's own tables.
    var wanted = ['fish-mahi', 'fish-kapor', 'fish-ghezelala', 'bird-starling',
      'bird-magpie', 'bird-housesparrow'];
    var out = [];
    for (var i = 0; i < wanted.length; i++) {
      var found = findSpecies(wanted[i]);
      if (found) out.push(found);
    }
    if (!out.length) {
      // Fall back to whatever the sea's own list holds, fish and birds only.
      var sea = SPECIES.sea || [];
      for (var j = 0; j < sea.length; j++) {
        if (sea[j].sh === 'fish' || sea[j].sh === 'bird') out.push(sea[j]);
      }
    }
    return out;
  }

  function speciesIn(kind, cx, cy) {
    if (kind === 'openwater') return openWaterSpecies(cx, cy);
    var own = (SPECIES[kind] || []).slice();
    var extra = FILLER[kind] || [];
    var i;
    for (i = 0; i < extra.length; i++) {
      var found = findSpecies(extra[i]);
      if (found) own.push(found);
    }
    if (!own.length) return own;

    var animals = [], plants = [];
    for (i = 0; i < own.length; i++) {
      if (own[i].sh === 'plant' || own[i].sh === 'fungus') plants.push(own[i]);
      else animals.push(own[i]);
    }

    var turn = Math.abs((cx || 0) * 3 + (cy || 0) * 7) % Math.max(1, own.length);
    var pick = function (pool, n) {
      var out = [];
      for (var k = 0; k < pool.length && out.length < n; k++) out.push(pool[(k + turn) % pool.length]);
      return out;
    };
    // The people of this section stand here whatever the rotation says: an errand
    // that sends her to the shepherd cannot be met by a section he is not in.
    var people = [], beasts = [];
    for (i = 0; i < animals.length; i++) {
      if (animals[i].sh === 'being') people.push(animals[i]); else beasts.push(animals[i]);
    }
    // Then three wild beasts and three plants: enough to read as a place, few
    // enough that walking in gives the eye somewhere to rest.
    return people.concat(pick(beasts, Math.max(1, 3 - people.length))).concat(pick(plants, 3));
  }

  function findSpecies(id) {
    for (var k in SPECIES) {
      if (!SPECIES.hasOwnProperty(k)) continue;
      for (var n = 0; n < SPECIES[k].length; n++) {
        if (SPECIES[k][n].id === id) return SPECIES[k][n];
      }
    }
    return null;
  }

  /* The words she knows, saved by their Finglish spelling: that is the only
     stable identity a word row has, because the English gloss can change. */
  function saveLearned() {
    try {
      var ids = [];
      for (var i = 0; i < learned.length; i++) ids.push(learned[i].f);
      window.localStorage.setItem(WORDS_KEY, ids.join('|'));
    } catch (e) { /* private mode: the words simply do not persist */ }
  }

  function restoreLearned() {
    var saved = [];
    try { saved = (window.localStorage.getItem(WORDS_KEY) || '').split('|'); } catch (e) { saved = []; }
    for (var i = 0; i < saved.length; i++) {
      var f = saved[i];
      if (!f) continue;
      var w = wordRowBy(f);
      if (w && !wordKnown(w.f)) learned.push(w);
    }
  }

  /* One word row by its Finglish spelling, from the table or a person's row. */
  function wordRowBy(f) {
    var want = plainFinglish(f), i;
    for (i = 0; i < words.length; i++) {
      if (plainFinglish(words[i].f) === want) return words[i];
    }
    for (var kk in SPECIES) {
      if (!SPECIES.hasOwnProperty(kk)) continue;
      var pool = SPECIES[kk];
      for (i = 0; i < pool.length; i++) {
        if (plainFinglish(pool[i].f) === want) {
          return { f: pool[i].f, e: pool[i].e, p: pool[i].p };
        }
      }
    }
    return null;
  }

  function wordKnown(f) {
    var want = plainFinglish(f);
    for (var i = 0; i < learned.length; i++) {
      if (plainFinglish(learned[i].f) === want) return true;
    }
    return false;
  }

  function propReach(p) {
    var reach = 104;
    if (p.k === 'house' || p.k === 'door') reach = 150;
    else if (p.k === 'boarded') reach = 70;
    else if (p.k === 'species') reach = p.sp.sh === 'being' ? 130 : 96;
    else if (p.k === 'carved') reach = 92;
    return dist(hero.x, hero.y, p.x, p.y) < reach;
  }

  function updateIslandVerb() {
    islandProps = buildProps();
    islandVerb = null;
    var best = 1e9;
    for (var i = 0; i < islandProps.length; i++) {
      var p = islandProps[i];
      var d = dist(hero.x, hero.y, p.x, p.y);
      if (d < best && propReach(p)) { best = d; islandVerb = p; }
    }
  }

  function useProp(p) {
    if (!p) return;
    if (p.act === 'inside') {
      interior = p.to;
      hero.x = world.w * 0.5;
      hero.y = world.h * 0.60;
      walkTarget = null;
      islandVerb = null;
      return;
    }
    if (p.act === 'out') {
      interior = null;
      hero.y = world.h * 0.34;
      hero.x = world.w * 0.5;
      walkTarget = null;
      islandVerb = null;
      return;
    }
    if (p.act === 'outfit') {
      outfit = (outfit + 1) % OUTFITS.length;
      addFloater(hero.x, hero.y - 54, OUTFITS[outfit].name, C.turquoiseDeep);
      sfx.pick();
      return;
    }
    if (p.act === 'sister') {
      donyaLine = clock;
      donyaMet = true;
      teachWord('khahar');
      addFloater(p.x, p.y - 60, 'Donya, my sister', C.inkSoft);
      addParticles(p.x, p.y - 20, '#FFF3D0', 10, 70);
      checkErrand();
      return;
    }
    if (p.act === 'board') {
      // She gets into the boat and sits down in it, and the boat is pushed off
      // the shingle into the water - she is not perched on the sand.
      boatRide.riding = true;
      var shb = seaShore();
      hero.x = clamp(p.x, 60, world.w - 60);
      hero.y = Math.min(world.h - 80, shb.top + 96);
      boatRide.bob = 0;
      boatRide.oar = 0;
      boatRide.wake.length = 0;
      hero.vx = 0; hero.vy = 0;
      walkTarget = null;
      addFloater(p.x, p.y - 50, 'she steps in', C.inkSoft);
      addParticles(p.x, p.y + 6, '#E6F4F2', 8, 60);
      sfx.pick();
      return;
    }
    if (p.act === 'unboard') {
      boatRide.riding = false;
      boatRide.wake.length = 0;
      // Onto the sand, BESIDE the boat and not in it.
      hero.x = clamp(world.w * 0.26 + 104, 40, world.w - 40);
      hero.y = world.h * 0.155 + 30;
      hero.vx = 0; hero.vy = 0;
      walkTarget = null;
      addFloater(hero.x, hero.y - 40, 'she steps ashore', C.inkSoft);
      addParticles(hero.x, hero.y + 6, '#F0E6C8', 6, 50);
      sfx.pick();
      return;
    }
    if (p.act === 'enter') {
      // Which water she is standing at, so the fishing page can name it and draw
      // its own bank.
      if (p.to === 'lake') lakeFrom = p.from || 'pond';
      enterPlace(p.to);
      return;
    }
    if (p.act === 'bed') {
      // One bed, worked: sow, tend, tend, harvest. The verb that shows is the
      // step it is on, so there is nothing to choose and nothing to mis-tap.
      gardenInit();
      var bb = garden.beds[p.row];
      if (!bb) return;
      if (!bb.step) {
        if (garden.seeds <= 0) {
          addFloater(p.x, p.y - 40, 'no seeds left', C.inkSoft);
          return;
        }
        garden.seeds--;
        bb.step = 1; bb.t = 0;
        addFloater(p.x, p.y - 40, 'sown', C.turquoiseDeep);
        addParticles(p.x, p.y, '#8FA36A', 6, 40);
        showNotice('A seed in the ground', 'tend it, and it grows');
        sfx.pick();
        gardenSave();
        propCache = {};
        return;
      }
      if (bb.step < BED_STEPS) {
        bb.t = 0;
        bb.step++;
        addFloater(p.x, p.y - 40, bb.step === 2 ? 'it comes up' : 'it flowers', C.turquoiseDeep);
        addParticles(p.x, p.y, '#FFF3D0', 7, 52);
        sfx.pick();
        gardenSave();
        propCache = {};
        return;
      }
      // Ready: it gives what it grew, and a seed to sow again.
      var got = bb.species || { f: 'gol', e: 'flower' };
      bb.step = 0; bb.t = 0;
      garden.seeds++;
      garden.harvested++;
      addFloater(p.x, p.y - 44, 'harvested', C.saffron);
      addParticles(p.x, p.y, '#E8B73C', 9, 60);
      if (got.f) teachWord(got.f);
      showNotice('She gathers ' + (got.e || 'it'), 'and keeps a seed back');
      sfx.pick();
      gardenSave();
      propCache = {};
      return;
    }
    if (p.act === 'species') {
      if (p.sp.sh === 'beast' || p.sp.sh === 'cat' || p.sp.sh === 'dog' ||
        p.sp.sh === 'insect' || p.sp.sh === 'bird' || p.sp.sh === 'frog' ||
        p.sp.sh === 'hen') {
        if (tooLargeToNet(p.sp)) {
          // Watched from where she stands: the look page, and nothing taken.
          teachWord(p.sp.f);
          addFloater(p.x, p.y - 52, 'too big to net', C.inkSoft);
          lookMemory = { sp: p.sp, where: sectionDef().name };
          enterLook(p.sp, lookKindOf(p.sp), sectionDef().name);
          return;
        }
        // Netted gently: met, learned, and remembered in the bag.
        bagInit();
        bagAdd({ f: p.sp.f, e: p.sp.e, p: p.sp.p });
        teachWord(p.sp.f);
        addFloater(p.x, p.y - 52, 'netted, and let go', C.turquoiseDeep);
        addParticles(p.x, p.y - 12, '#FFF3D0', 8, 62);
        showNotice('She meets the ' + shortName(p.sp), bagCount() + ' in the bag');
        sfx.pick();
        // An animal that has been met moves off a little, as one would.
        for (var ai = 0; ai < islandProps.length; ai++) {
          if (islandProps[ai] === p && p.anim) {
            p.anim.x += (hero.x > p.anim.x ? -34 : 34);
            p.anim.x = clamp(p.anim.x, 30, world.w - 30);
            break;
          }
        }
        return;
      }
      if (p.sp.sh === 'find') {
        // Something the island left: it goes in the bag and off the ground.
        pickUpFinding(p.sp, p);
        return;
      }
      teachWord(p.sp.f);
      if (p.sp.sh === 'being') {
        // A person answers in their own words on a slip, and that is the whole
        // of the meeting.
        sibLine = clock;
        metBeing[p.sp.id] = 1;
        beingSaid = { at: clock, who: shortName(p.sp), line: beingLineFor(p.sp.id) };
        addParticles(p.x, p.y - 16, '#FFF3D0', 8, 70);
        checkErrand();
        return;
      }
      // Everything else she can look at properly: its own page, drawn large.
      lookMemory = { sp: p.sp, where: sectionDef().name };
      enterLook(p.sp, lookKindOf(p.sp), sectionDef().name);
      return;
    }
    if (p.act === 'stone') {
      teachWord(p.w.f);
      addFloater(p.x, p.y - 44, p.w.e, C.inkSoft);
      addParticles(p.x, p.y - 10, '#E8E2D2', 8, 60);
      return;
    }
    if (p.word) {
      teachWord(p.word);
      addFloater(p.x, p.y - 40, p.word, C.inkSoft);
      addParticles(p.x, p.y - 20, '#FFF3D0', 8, 70);
    }
  }

  /* Walk off one edge, arrive at the opposite side of the next section. */
  function sectionCross() {
    var W = world.w, H = world.h;
    if (interior) {
      if (hero.y > H - 22) {
        interior = null;
        hero.y = H * 0.34;
        hero.x = W * 0.5;
        walkTarget = null;
        islandVerb = null;
      }
      return;
    }

    // A closed edge is a wall as well as a drawing: she stops at it. Only the
    // cliff, the hedge and the bank keep her in, so the island has an outline
    // she can feel and not only see.
    var m = 26, keep = 30;
    if (!neighbourOf(-1, 0) && hero.x < keep) { hero.x = keep; hero.vx = Math.max(0, hero.vx); }
    if (!neighbourOf(1, 0) && hero.x > W - keep) { hero.x = W - keep; hero.vx = Math.min(0, hero.vx); }
    if (!neighbourOf(0, -1) && hero.y < 74) { hero.y = 74; hero.vy = Math.max(0, hero.vy); }
    if (!neighbourOf(0, 1) && hero.y > H - keep) { hero.y = H - keep; hero.vy = Math.min(0, hero.vy); }

    var nx = section.cx, ny = section.cy, hx = hero.x, hy = hero.y, moved = false;
    if (hero.x < m) { nx -= 1; hx = W - m - 40; moved = true; }
    else if (hero.x > W - m) { nx += 1; hx = m + 40; moved = true; }
    if (hero.y < 110) { ny -= 1; hy = H - 120; moved = true; }
    else if (hero.y > H - m) { ny += 1; hy = 190; moved = true; }
    if (!moved) return;
    var nextDef = SECTIONS[sectionId(nx, ny)];
    if (!nextDef) { walkTarget = null; return; }
    // The open water is reachable only by boat. Walking across a seam into it, or
    // out of it, is not possible - she is in a boat, on water, a long way out.
    var hereOpen = sectionDef().kind === 'openwater';
    var thereOpen = nextDef.kind === 'openwater';
    if ((hereOpen || thereOpen) && !boatRide.riding) {
      // Pushed back to the seam she was trying to cross.
      if (hero.x < m) hero.x = m + 6;
      else if (hero.x > W - m) hero.x = W - m - 6;
      if (hero.y < 110) hero.y = 118;
      else if (hero.y > H - m) hero.y = H - m - 6;
      walkTarget = null;
      return;
    }
    section.cx = nx;
    section.cy = ny;
    hero.x = hx;
    hero.y = hy;
    hero.vx = 0;
    hero.vy = 0;
    walkTarget = null;
    islandVerb = null;
    visitSection(nx, ny);
  }

  /* ---- Drawing the section ----------------------------------------------- */
  /* A crop in a bed, in three shapes: a sprout, a leafy bush, and the bush in
     fruit. Its own drawing, because a field plant scaled down is not a crop. */
  function drawCrop(x, y, step, sp) {
    var leaf = '#5F8B3E', leafDark = '#3F6228';
    var fruit = '#C4432F';
    // The fruit takes the colour of whatever was sown, from its own row.
    if (sp && sp.fruit) fruit = sp.fruit;
    ctx.save();
    ctx.lineCap = 'round';
    var sway = Math.sin(clock * 1.4 + x * 0.05) * 0.05;

    if (step === 1) {
      // A sprout: a short stem and two seed leaves.
      ctx.strokeStyle = leafDark;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(x, y + 14);
      ctx.lineTo(x + sway * 10, y + 1);
      ctx.stroke();
      ctx.fillStyle = leaf;
      ctx.beginPath();
      ctx.ellipse(x - 5, y, 5.4, 3, -0.5, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + 5.4, y - 1, 5.4, 3, 0.5, 0, TAU);
      ctx.fill();
    } else {
      // A bush: a stem, three pairs of leaves, and a little height.
      var h = step === 2 ? 26 : 32;
      ctx.strokeStyle = leafDark;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(x, y + 16);
      ctx.quadraticCurveTo(x + sway * 12, y + 2, x + sway * 20, y - h + 16);
      ctx.stroke();
      for (var i = 0; i < 3; i++) {
        var ly = y + 6 - i * 9;
        var lw = 9 - i * 1.4;
        ctx.fillStyle = i === 2 ? leafDark : leaf;
        ctx.beginPath();

        ctx.beginPath();
        ctx.ellipse(x + (pl % 2 ? 8 : -8), y - 40 - pl * 5, 8, 5, (pl % 2 ? 0.5 : -0.5), 0, TAU);

      }
    } else if (p.k === 'pot') {
      ctx.fillStyle = '#B4762E';
      ctx.beginPath();
      ctx.moveTo(x - 16, y + 16);
      ctx.lineTo(x + 16, y + 16);
      ctx.lineTo(x + 12, y - 10);
      ctx.lineTo(x - 12, y - 10);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#5C7F42';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(x, y - 10);
      ctx.lineTo(x, y - 34);
      ctx.stroke();
      ctx.fillStyle = '#7FA35C';
      ctx.beginPath();
      ctx.ellipse(x - 6, y - 30, 6, 4, -0.5, 0, TAU);
      ctx.ellipse(x + 6, y - 26, 6, 4, 0.5, 0, TAU);
      ctx.fill();
    } else if (p.k === 'bench') {
      // The trestle, from the front: a board on two legs, with a lower shelf, its
      // pots standing on the top.
      var bw = 152;
      // Its shadow.
      ctx.fillStyle = 'rgba(40,48,28,0.16)';
      ctx.beginPath();
      ctx.ellipse(x, y + 4, bw * 1.02, 12, 0, 0, TAU);
      ctx.fill();
      // The legs.
      ctx.fillStyle = '#8E7A56';
      ctx.fillRect(x - bw + 14, y - 44, 12, 46);
      ctx.fillRect(x + bw - 26, y - 44, 12, 46);
      // The lower shelf.
      ctx.fillStyle = '#A8926A';
      roundRect(x - bw + 8, y - 22, bw * 2 - 16, 8, 2);
      ctx.fill();
      // The top.
      ctx.fillStyle = '#C9B48F';
      roundRect(x - bw, y - 56, bw * 2, 14, 3);
      ctx.fill();
      ctx.fillStyle = 'rgba(120,98,64,0.45)';
      ctx.fillRect(x - bw, y - 44, bw * 2, 3);
      // Pots on the top, each with a shoot.
      var prnd2 = seeded(4402);
      for (i = 0; i < 5; i++) {
        var px3 = x - bw + 28 + i * (bw * 2 - 56) / 4;
        var py3 = y - 60;
        ctx.fillStyle = i % 2 ? '#C0703F' : '#B46238';
        ctx.beginPath();
        ctx.moveTo(px3 - 11, py3);
        ctx.lineTo(px3 + 11, py3);
        ctx.lineTo(px3 + 8, py3 + 13);
        ctx.lineTo(px3 - 8, py3 + 13);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,70,40,0.5)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // Its shoot.
        ctx.strokeStyle = '#6F9450';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px3, py3);
        ctx.quadraticCurveTo(px3 - 2, py3 - 10, px3 + 1, py3 - 18 - prnd2() * 5);
        ctx.stroke();
        ctx.fillStyle = '#7FA35C';
        for (var lf = 0; lf < 2; lf++) {
          ctx.beginPath();
          ctx.ellipse(px3 + (lf ? 5 : -5), py3 - 13 - lf * 4, 5, 3.4, lf ? 0.5 : -0.5, 0, TAU);
          ctx.fill();
        }
      }
    } else if (p.k === 'lamp') {
      ctx.strokeStyle = '#8A6A44';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y + 40);
      ctx.lineTo(x, y - 30);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,236,170,0.85)';
      ctx.beginPath();
      ctx.moveTo(x - 20, y - 30);
      ctx.lineTo(x + 20, y - 30);
      ctx.lineTo(x + 12, y - 62);
      ctx.lineTo(x - 12, y - 62);
      ctx.closePath();
      ctx.fill();
    } else if (p.k === 'cat') {
      drawCat({ id: 'pet-tabby' }, x, y, clock);
    } else if (p.k === 'stone') {
      castShadow(x, y + 14, 52, 0.22, 24);
      ctx.fillStyle = '#CFC9B8';
      ctx.beginPath();
      ctx.ellipse(x, y + 6, 26, 17, 0.1, 0, TAU);
      ctx.fill();
    }
    if (p.k === 'house' || p.k === 'glassdoor' || p.k === 'coopdoor') {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(42,35,32,0.45)';
      ctx.font = 'italic 600 13px ' + FONT_SERIF;
      ctx.fillText(p.k === 'house' ? 'the house' : 'the henhouse', x, y + (p.k === 'house' ? 96 : 116));
      ctx.textAlign = 'left';
    }
  }

  /* The hour laid over the whole page: a warm or cold veil, plus the sun's own
     light falling from its side of the sky. */
  /* The sun itself, in the open sections. It sits on an arc across the page: at
     its rise it enters at the east edge, crosses the middle at noon, and leaves
     at the west edge, sinking behind the horizon line as it does. */
  function drawSun(W, H, arcTop, arcBottom, scale) {
    var L = dayLight();
    if (L.night) return;
    var u = clamp(L.u, 0, 1);
    // It enters at the east edge, crosses the page and leaves at the west. The arc
    // is given by the page that draws it: the sky's own band, not the ground's.
    var top = H * (arcTop == null ? 0.088 : arcTop);
    var bottom = H * (arcBottom == null ? 0.132 : arcBottom);
    var x = W * (0.90 - u * 0.80);
    var y = bottom - (bottom - top) * Math.sin(u * Math.PI);
    var r = (17 + 6 * L.warm) * (scale || 1);
    // Its halo: a wide soft glow, warmest when it is low.
    var g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 4.2);
    g.addColorStop(0, 'rgba(255,250,226,' + (0.46 + 0.24 * L.warm).toFixed(3) + ')');
    g.addColorStop(0.5, 'rgba(255,236,186,' + (0.16 + 0.16 * L.warm).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,236,186,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r * 4.2, 0, TAU);
    ctx.fill();
    // The disc: a warm ring first, so its edge is drawn against a pale sky.
    ctx.fillStyle = 'rgba(226,166,72,0.55)';
    ctx.beginPath();
    ctx.arc(x, y, r + 1.6, 0, TAU);
    ctx.fill();
    ctx.fillStyle = L.warm > 0.25 ? '#FFCF86' : '#FFF6DC';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  function drawDayWash(W, H) {
    var L = dayLight();
    if (L.night) {
      ctx.fillStyle = 'rgba(28,42,72,0.46)';
      ctx.fillRect(0, 0, W, H);
      return;
    }
    // The sun's colour at this height: strong gold when it is low, a faint cool
    // wash at noon, so the two ends of the day do not look alike.
    var warm = L.warm;
    var gold = 'rgba(255,150,64,' + (0.46 * warm).toFixed(3) + ')';
    var cool = 'rgba(120,160,192,' + (0.18 * (1 - warm)).toFixed(3) + ')';
    // The veil falls from the sun's side of the sky, so the far side is cooler.
    var g = ctx.createLinearGradient(L.sx > 0 ? W : 0, 0, L.sx > 0 ? 0 : W, H);
    g.addColorStop(0, gold);
    g.addColorStop(0.45, 'rgba(255,222,168,' + (0.12 * warm).toFixed(3) + ')');
    g.addColorStop(1, cool);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // The far end of the day also DARKENS, so dusk is not merely more yellow
    // than noon but later than it.
    if (L.warm > 0.12) {
      ctx.fillStyle = 'rgba(84,58,32,' + (0.17 * L.warm).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // The sun's side of the page is a little brighter, so the light has a
    // direction and not only a colour.
    var sx = (L.sx > 0 ? W : 0);
    var sy = (L.sy > 0 ? H : 0);
    var lg = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.95);
    lg.addColorStop(0, 'rgba(255,248,222,' + (0.20 * Math.min(1, L.up * 1.5)).toFixed(3) + ')');
    lg.addColorStop(1, 'rgba(255,248,222,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);
  }

  function renderIsland() {
    // What can be tapped is rebuilt every frame; a page's draw clears its own list,
    // and the island's does too, or the chips pile up.
    hits = [];
    var d = sectionDef();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#6E7F56';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.setTransform(dpr * fitScale, 0, 0, dpr * fitScale, dpr * ox, dpr * oy);
    drawBiomeGround(d);
    // No sun on the ground: the island is seen from above, so the light reaches
    // it but the disc does not. The sun is drawn on the sky page instead.
    if (!interior) drawSectionEdges(d);
    if (!interior) drawStepRing();
    if (!interior && d.kind !== 'sea') {
      keepSceneryDry();
      drawScenery();
    }
    islandProps = buildProps();
    if (!interior && d.kind !== 'sea') drawGroundShade();

    // Painter's order: what stands behind her, her, then what stands before.
    var i;
    for (i = 0; i < islandProps.length; i++) {
      if (islandProps[i].y <= hero.y) drawProp(islandProps[i]);
    }
    drawHero();
    for (i = 0; i < islandProps.length; i++) {
      if (islandProps[i].y > hero.y) drawProp(islandProps[i]);
    }
    if (!interior) drawMotes();
    drawParticles();
    drawDayWash(world.w, world.h);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawErrand();
    drawIslandVerb();
    drawWordCard();
    drawBeingNote();
    // The menu is a sheet over the island, so it is drawn last.
    if (menu.open) drawMenu(canvas.width / dpr, canvas.height / dpr);
    if (d.kind !== 'yard' || interior) return;
    drawSisterNote();
  }

  var chipHit = null;
  var donyaLine = -99;
  var donyaMet = false;
  var sibLine = -99;
  /* The last thing a person said to her, and when. */
  var beingSaid = { at: -99, who: '', line: '' };

  /* A slip of paper with what a person just said, so a conversation reads as a
     conversation and not as a word card. */
  function drawBeingNote() {
    if (clock - beingSaid.at > 5.5) return;
    var cssW = canvas.width / dpr, cssH = canvas.height / dpr;
    var s = clamp(Math.min(cssW, cssH) / 520, 0.82, 1.4);
    var w = Math.min(cssW - 48 * s, 320 * s);
    var h = 76 * s;
    var x = cssW / 2 - w / 2, y = cssH * 0.115;
    ctx.save();
    ctx.fillStyle = C.paper;
    roundRect(x, y, w, h, 10 * s);
    ctx.fill();
    ctx.strokeStyle = C.rule;
    ctx.lineWidth = Math.max(1, s);
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = C.inkFaint;
    ctx.font = '600 ' + Math.round(9.5 * s) + 'px ' + FONT_UI;
    ctx.fillText(beingSaid.who.toUpperCase(), x + 14 * s, y + 20 * s);
    ctx.fillStyle = C.inkSoft;
    ctx.font = 'italic ' + Math.round(13.5 * s) + 'px ' + FONT_SERIF;
    // The line, wrapped to the slip.
    var words = beingSaid.line.split(' ');
    var line = '', ly = y + 44 * s;
    for (var i = 0; i < words.length; i++) {
      var tryLine = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(tryLine).width > w - 28 * s && line) {
        ctx.fillText(line, x + 14 * s, ly);
        ly += 18 * s;
        line = words[i];
      } else {
        line = tryLine;
      }
    }
    if (line) ctx.fillText(line, x + 14 * s, ly);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function drawSisterNote() {
    if (clock - donyaLine > 4) return;
    var cssW = canvas.width / dpr, cssH = canvas.height / dpr;
    var s = clamp(Math.min(cssW, cssH) / 520, 0.82, 1.4);
    var w = Math.min(cssW - 60 * s, 300 * s);
    var h = 84 * s;
    var x = cssW / 2 - w / 2, y = cssH * 0.10;
    ctx.save();
    ctx.fillStyle = C.paper;
    roundRect(x, y, w, h, 12 * s);
    ctx.fill();
    ctx.strokeStyle = C.rule;
    ctx.lineWidth = Math.max(1, s);
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = C.inkFaint;
    ctx.font = '600 ' + Math.round(10 * s) + 'px ' + FONT_UI;
    ctx.fillText('DONYA, MY SISTER', x + 16 * s, y + 22 * s);
    ctx.fillStyle = C.inkSoft;
    ctx.font = 'italic ' + Math.round(15 * s) + 'px ' + FONT_SERIF;
    ctx.fillText('"I found the low path. Come and see."', x + 16 * s, y + 52 * s);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  /* The verb of the thing she stands at, at the foot of the page. */
  function drawIslandVerb() {
    var cssW = canvas.width / dpr, cssH = canvas.height / dpr;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    chipHit = null;
    if (islandVerb) {
      ctx.font = '600 14px ' + FONT_UI;
      var label = islandVerb.verb;
      var tw = ctx.measureText(label).width + 44;
      var th = 40;

      // THE CHIP STANDS AT THE THING IT NAMES. It used to sit at the foot of the
      // page, which said nothing about what would be touched when three things
      // stood within reach of each other. It is centred on the prop and lifted
      // clear of the prop's own height, so it reads as a label on that thing.
      var sx = islandVerb.x * fitScale + ox;
      var sy = islandVerb.y * fitScale + oy;
      var rise = propRise(islandVerb) * fitScale;
      var gap = 12;
      var bx = sx - tw / 2;
      var above = sy - rise - gap - th;
      // The strip the errand card and the clock occupy, and the page's own foot.
      var topLimit = 76, footLimit = cssH - 92;

      // Above the thing by default. When there is no room above it - a house
      // high on the page - the label goes BELOW THE FOOT of the thing, never on
      // top of it; and if neither side has room it stays as high as the page
      // allows rather than over the thing's face.
      var drop = propDrop(islandVerb) * fitScale;
      var by;
      if (above >= topLimit) {
        by = above;
      } else {
        var below = sy + drop + gap;
        by = (below + th <= footLimit) ? below : Math.max(topLimit, Math.min(above, footLimit - th));
      }

      bx = clamp(bx, 8, Math.max(8, cssW - tw - 8));
      by = clamp(by, topLimit, Math.max(topLimit, footLimit - th));

      ctx.fillStyle = C.terracotta;
      roundRect(bx, by, tw, th, th / 2);
      ctx.fill();
      ctx.fillStyle = C.paper;
      ctx.fillText(label, bx + tw / 2, by + th / 2 + 0.5);
      chipHit = { x: bx, y: by, w: tw, h: th };
    } else {
      ctx.font = 'italic 400 12px ' + FONT_SERIF;
      ctx.fillStyle = 'rgba(42,35,32,0.45)';
      // The place's name sits at the foot's left, because the foot's middle
      // belongs to the south edge and what lies beyond it.
      ctx.textAlign = 'left';
      ctx.fillText(sectionDef().name, 22, cssH - 26);
    }
    ctx.textAlign = 'left';
    ctx.restore();
  }

  function propAt(p) {
    for (var i = islandProps.length - 1; i >= 0; i--) {
      var q = islandProps[i];
      var rx = q.k === 'species' && q.sp.ps === 'tree' ? 90 : 70;
      if (Math.abs(p.x - q.x) < rx && Math.abs(p.y - q.y) < 84) return q;
    }
    return null;
  }

  function chipTapped(p) {
    return !!chipHit && p.x >= chipHit.x && p.x <= chipHit.x + chipHit.w &&
      p.y >= chipHit.y && p.y <= chipHit.y + chipHit.h;
  }
  var walkState = { dist: 0, walking: false, arrived: false, t: 0 };
  /* On the sea's shore the walk is two legs: to the inner corner, then on to the
     spot. Empty everywhere else. */
  var seaRoute = [];
  var inJourney = false;

  /* The next place is the first page still blank: the island, in its own order. */
  function journeyNext() {
    for (var i = 0; i < STORY.length; i++) if (!storyDone[STORY[i].id]) return STORY[i];
    return null;
  }

  function startJourney() {
    inJourney = true;
    startGame('island');
  }

  function enterWalk() {
    walkState.dist = 0;
    walkState.walking = false;
    walkState.arrived = false;
    walkState.t = 0;
  }

  function walkDown(p) {
    var h = hitAt(p);
    if (h && h.act === 'notebook') { enterPlace('notebook'); return; }
    var next = journeyNext();
    if (!next) { enterPlace('notebook'); return; }
    if (walkState.arrived) { enterPlace(next.id); return; }
    walkState.walking = true;
  }

  function updateWalk(dt) {
    walkState.t += dt;
    if (walkState.walking && !walkState.arrived) {
      walkState.dist = Math.min(1, walkState.dist + dt * 0.33);
      if (walkState.dist >= 1) { walkState.arrived = true; walkState.walking = false; }
    }
  }

  function autoWalk() {
    var next = journeyNext();
    if (!next) { enterPlace('notebook'); return; }
    if (walkState.arrived) { enterPlace(next.id); return; }
    walkState.walking = true;
  }

  function drawWalk(cssW, cssH) {
    hits = [];
    pageBegin(cssW, cssH);
    var t = walkState.t, d = walkState.dist;
    var next = journeyNext();
    var target = next ? next.id : null;
    var reg = target ? regionOf(target) : null;

    // Morning sky over the island.
    var sky = ctx.createLinearGradient(0, 0, 0, 420);
    sky.addColorStop(0, '#F0E7D4');
    sky.addColorStop(1, '#DCE4D2');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 390, 844);

    ctx.fillStyle = 'rgba(150,170,140,0.45)';
    ctx.beginPath();
    ctx.moveTo(0, 330);
    ctx.quadraticCurveTo(90, 300, 186, 322);
    ctx.quadraticCurveTo(300, 344, 390, 318);
    ctx.lineTo(390, 420);
    ctx.lineTo(0, 420);
    ctx.closePath();
    ctx.fill();

    // The meadow either side of the road, in the colour of where she is going.
    ctx.fillStyle = reg ? reg.ground : '#8FA671';
    ctx.fillRect(0, 366, 390, 478);
    ctx.fillStyle = reg ? reg.deep : '#84A066';
    for (var i = 0; i < 26; i++) {
      var gx = (i * 53) % 390;
      var gy = 380 + ((i * 97) % 440);
      ctx.beginPath();
      ctx.ellipse(gx, gy, 17, 6, 0, 0, TAU);
      ctx.fill();
    }
    if (reg) {
      ctx.fillStyle = reg.deep;
      for (var b = 0; b < 6; b++) {
        var bx = (b % 2 ? 46 : 344) + (b % 3) * 8;
        var by = 460 + Math.floor(b / 2) * 150;
        if (reg.feature === 'canopy') {
          ctx.fillRect(bx - 4, by, 8, 74);
          ctx.beginPath();
          ctx.ellipse(bx, by - 6, 40, 30, 0, 0, TAU);
          ctx.fill();
        } else if (reg.feature === 'dune') {
          ctx.beginPath();
          ctx.ellipse(bx, by + 20, 52, 18, 0, 0, TAU);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.ellipse(bx, by, 26, 12, 0, 0, TAU);
          ctx.fill();
        }
      }
    }

    // The road, from the keeper's feet to the far place.
    ctx.fillStyle = '#C9AE84';
    ctx.beginPath();
    ctx.moveTo(150, 844);
    ctx.lineTo(240, 844);
    ctx.lineTo(206, 330);
    ctx.lineTo(184, 330);
    ctx.closePath();
    ctx.fill();

    // Its ruts, scrolling with the walk, so the ground moves under her.
    ctx.strokeStyle = 'rgba(120,96,64,0.35)';
    ctx.lineWidth = 2;
    for (var r = 0; r < 9; r++) {
      var k = ((r / 9) + d * 1.4) % 1;
      var ry = 844 - k * 500;
      var half = lerp(34, 8, (844 - ry) / 500);
      ctx.beginPath();
      ctx.moveTo(195 - half * 0.55, ry);
      ctx.lineTo(195 - half * 0.2, ry - 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(195 + half * 0.2, ry - 4);
      ctx.lineTo(195 + half * 0.55, ry);
      ctx.stroke();
    }

    // The place she is walking to, at the end of the road.
    if (next) {
      var doorY = 300;
      ctx.fillStyle = 'rgba(247,244,238,0.95)';
      roundRect(195 - 44, doorY - 46, 88, 74, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(216,204,184,0.95)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.save();
      ctx.translate(195, doorY - 22);
      ctx.scale(0.9, 0.9);
      if (REGION_IDS.indexOf(target) >= 0) drawRegionGlyph(target); else drawGlyph(target);
      ctx.restore();
      ctx.fillStyle = C.paper;
      ctx.fillRect(195 - 9, doorY - 2, 18, 30);
      ctx.fillStyle = 'rgba(42,35,32,0.5)';
      roundRect(195 - 2.5, doorY + 12, 5, 5, 2.5);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = C.paper;
      ctx.font = 'italic 600 15px ' + FONT_SERIF;
      var label = placeDef(target) ? placeDef(target).label : next.label;
      var lw = ctx.measureText(label).width + 26;
      roundRect(195 - lw / 2, doorY - 78, lw, 26, 13);
      ctx.fill();
      ctx.fillStyle = C.ink;
      ctx.fillText(label, 195, doorY - 65);
      ctx.textAlign = 'left';
    }

    // Darya herself, walking the road.
    var bob = walkState.walking ? Math.abs(Math.sin(t * 7)) * 3 : Math.sin(t * 2) * 1.2;
    ctx.save();
    ctx.translate(195, 700 - d * 300 + bob);
    ctx.fillStyle = 'rgba(40,50,30,0.20)';
    ctx.beginPath();
    ctx.ellipse(0, 30, 22, 7, 0, 0, TAU);
    ctx.fill();
    ctx.scale(1.1, 1.1);
    drawCharacter(ctx, 'hero', 78);
    ctx.restore();

    // The one thing to do here.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(247,244,238,0.94)';
    var hint = !next ? 'the book is full' : (walkState.arrived ? 'go in' : 'tap to walk');
    var hw = ctx.measureText(hint).width + 34;
    roundRect(195 - hw / 2, 786, hw, 34, 17);
    ctx.fill();
    ctx.strokeStyle = 'rgba(216,204,184,0.9)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = C.inkSoft;
    ctx.font = '600 12px ' + FONT_UI;
    ctx.fillText(hint, 195, 803);

  /* What she has already taken, by section and species: the ground remembers, so a
     rebuilt prop list does not grow the shell back. */
  var takenHere = {};

  function bagInit() {
    try {
      var raw = window.localStorage.getItem(BAG_KEY);
      if (!raw) return;
      var got = JSON.parse(raw);
      if (got && got.items && got.items.length) bag.items = got.items;
      if (got && got.taken) takenHere = got.taken;
    } catch (e) { /* nothing saved */ }
  }

  function bagSave() {
    try {
      window.localStorage.setItem(BAG_KEY, JSON.stringify({ items: bag.items, taken: takenHere }));
    } catch (e) { /* nothing */ }
  }

  /* One more of a thing, counted rather than duplicated. */
  function bagAdd(sp) {
    if (!sp) return;
    for (var i = 0; i < bag.items.length; i++) {
      if (bag.items[i].f === sp.f) { bag.items[i].n = (bag.items[i].n || 1) + 1; bagSave(); return; }
    }
    bag.items.push({ f: sp.f, e: sp.e, p: sp.p, n: 1 });
    bagSave();
  }

  function bagCount() {
    var n2 = 0;
    for (var i = 0; i < bag.items.length; i++) n2 += bag.items[i].n || 1;
    return n2;
  }

     the ground. This is what the island's own verb was already calling. */

    bagInit();
    bagAdd(sp);
    teachWord(sp.f);

    var key = sectionId(section.cx, section.cy) + ':' +
      Math.round((prop ? prop.x : hero.x)) + ':' + Math.round((prop ? prop.y : hero.y));

    addFloater(hero.x, hero.y - 50, 'into the bag', C.turquoiseDeep);
    addParticles(hero.x, hero.y - 10, '#F2E7C8', 8, 58);
    showNotice('She keeps ' + (sp.e || sp.f), bagCount() + ' in the bag');

  /* One species row by its Finglish spelling, from any biome's list. */
  function findSpeciesByName(f) {
    var want = plainFinglish(f);
    for (var k in SPECIES) {
      if (!SPECIES.hasOwnProperty(k)) continue;
      for (var i = 0; i < SPECIES[k].length; i++) {

  /* ---- The word book: the whole table, the ones she knows first ---------- */
  var book = { page: 0, tab: 'known', scroll: 0, touched: -9 };

  var WORD_PAGE = 11;   // rows on a page: the page fits eleven at this size

  /* The rows for the current tab, in the order they are read. */
  function bookRows() {
    var known = [], rest = [], seen = {};
    var i;
    for (i = 0; i < learned.length; i++) {
      var f = learned[i].f;
      if (seen[plainFinglish(f)]) continue;
      seen[plainFinglish(f)] = 1;
      known.push(learned[i]);
    }
    for (i = 0; i < words.length; i++) {
      if (seen[plainFinglish(words[i].f)]) continue;
      rest.push(words[i]);
    }
    return book.tab === 'known' ? known : rest;
  }

  function bookPageCount() {
    return Math.max(1, Math.ceil(bookRows().length / WORD_PAGE));
  }

  function enterWords() {
    book.touched = clock;
    var rows = bookRows();
    if (!rows.length && book.tab === 'known') { book.tab = 'rest'; }
    book.page = 0;

  function wordBookTap(p) {
    var h = hitAt(p);

      book.page = 0;
      return;
    }
    if (h.act === 'bookpage') {
      book.page = clamp(book.page + h.arg, 0, bookPageCount() - 1);
      return;
    }

  function drawWordBook(cssW, cssH) {

    ];
    var tx = 34;
    for (var t = 0; t < tabs.length; t++) {

        ctx.fillStyle = C.inkSoft;

        ctx.font = '600 13px ' + FONT_UI;
        ctx.fillText('\u2039 back', 76, 796);
      }
      if (book.page < pages - 1) {
        ctx.fillStyle = C.turquoiseDeep;
        ctx.font = '600 13px ' + FONT_UI;
        ctx.fillText('on \u203a', 314, 796);

    pageEnd();
  }

  /* 13. RESIZE / BOOT */
  function resize() {
    var cssW = window.innerWidth || canvas.clientWidth || 390;
    var cssH = window.innerHeight || canvas.clientHeight || 844;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    var oldW = world.w, oldH = world.h;
    var landscape = cssW >= cssH;
    if (landscape) {
      world.w = 1280;
      world.h = 720;
    } else {
      world.w = 640;
      world.h = Math.round(clamp(640 * cssH / cssW, 1040, 1600));
    }

    if (world.w !== oldW || world.h !== oldH) {
      layout();
      keepInBounds();
      buildBackground();
    }

    fitScale = Math.min(cssW / world.w, cssH / world.h);
    ox = (cssW - world.w * fitScale) / 2;
    oy = (cssH - world.h * fitScale) / 2;
  }

  function keepInBounds() {
    hero.x = clamp(hero.x, 72, world.w - 72);
    hero.y = clamp(hero.y, 200, world.h - 64);
    for (var i = 0; i < enemies.length; i++) {
      enemies[i].x = clamp(enemies[i].x, -R.enemySize, world.w + R.enemySize);
      enemies[i].y = clamp(enemies[i].y, -R.enemySize, world.h + R.enemySize);
    }
    for (var j = 0; j < pickups.length; j++) {
      pickups[j].x = clamp(pickups[j].x, 78, world.w - 78);
      pickups[j].y = clamp(pickups[j].y, 215, world.h - 90);
    }
  }

  /* Pointer: tap to walk, drag to lead her there. */
  function pointerWorld(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left - ox) / fitScale,
      y: (e.clientY - rect.top - oy) / fitScale
    };
  }
  var pointerId = null;
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    if (canvas.focus) canvas.focus();

    if (scene !== 'island') {
      // The sheet first: while it is open it owns every tap, here as on the island.
      if (menu.open) { menuDown(cssPoint(e)); e.preventDefault(); return; }
      // The header's arrow and its menu chip are drawn by every place, so they
      // must answer in every place. A place that supplies its own `down` used to
      // swallow them: the word book, the notebook, the bag and the map all had a
      // dead "‹ island" and no way back to the menu at all.
      var hp = pagePoint(e);
      var hh = hitAt(hp);
      if (hh && hh.act === 'back') { openMenu(); e.preventDefault(); return; }
      if (chromeTap(hp)) { e.preventDefault(); return; }
      var pl = placeDef(scene);
      if (pl && pl.down) { pl.down(hp); e.preventDefault(); }
      return;
    }

    if (phase === 'title') {
      var th = hitAt(pagePoint(e));
      if (th && th.act === 'titlelang') {
        LANG = LANG === 'en' ? 'fa' : 'en';
        try { localStorage.setItem('darya.lang', LANG); } catch (err) { /* private */ }
        return;
      }
      if (th && th.act === 'notebook') { enterPlace('notebook'); return; }
      if (th && th.act === 'menu') {
        enterPlace(th.arg);
        return;
      }
      startJourney();
      return;
    }
    if (phase === 'won' || phase === 'lost') { if (restartGuard <= 0) backToTitle(); return; }
    if (paused) { paused = false; return; }
    if (phase !== 'playing') return;
    var pt = pointerWorld(e);
    pointerId = e.pointerId;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }

    // The menu, when it is open, takes every tap: it is a sheet over the page.
    if (menu.open) {
      menuDown(cssPoint(e));
      e.preventDefault();
      return;
    }

    if (stage === 'fireflies') {
      tryCatch(pt.x, pt.y);
      e.preventDefault();
      return;
    }
    if (stage === 'island') {
      var pp0 = cssPoint(e);
      var bh0 = hitAt(pp0);
      if (bh0 && bh0.act === 'back') { openMenu(); e.preventDefault(); return; }
      var pp = cssPoint(e);
      if (chipTapped(pp)) {
        useProp(islandVerb);
        e.preventDefault();
        return;
      }
      // Tapping a thing walks to it; the verb appears when she is in reach.
      var touched = propAt(pointerWorld(e));
      if (touched) { setWalkTarget({ x: touched.x, y: touched.y + 34 }); e.preventDefault(); return; }
      setWalkTarget(pointerWorld(e));
      e.preventDefault();
      return;
    }
    if (stage === 'water') {
      var near = sproutAt(pt.x, pt.y, 92);
      if (near && dist(hero.x, hero.y, near.x, near.y) < 175) {
        pour = near;
        pourHeld = true;
        ripple = { x: near.x, y: near.y + 6, age: 0 };
        e.preventDefault();
        return;
      }
    }
    setWalkTarget(pt);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (scene !== 'island') {
      var pm = placeDef(scene);
      if (pm && pm.move) pm.move(pagePoint(e));
      return;
    }
    if (pointerId === null || e.pointerId !== pointerId) return;
    if (stage === 'fireflies' || pourHeld) return;
    setWalkTarget(pointerWorld(e));
    e.preventDefault();
  });
  function releasePointer(e) {
    if (pointerId !== null && e.pointerId === pointerId) pointerId = null;
    pourHeld = false;
  }
  canvas.addEventListener('pointerup', function (e) {
    if (scene !== 'island') {
      var pu = placeDef(scene);
      if (pu && pu.up) pu.up(pagePoint(e));
    }
    releasePointer(e);
  });
  canvas.addEventListener('pointercancel', releasePointer);

  /* Where a tap sends her. The safe band keeps her away from a seam when she is
     reaching for a thing - but a tap NEAR an edge is a request to leave, so the
     target is placed past the seam and she walks through it. Clamping every tap
     into the band is what made the mouse unable to leave a section: the walk had
     nowhere to finish. */
  function setWalkTarget(p) {
    var band = 96;
    if (stage !== 'island') {
      walkTarget = {
        x: clamp(p.x, 72, world.w - 72),
        y: clamp(p.y, 200, world.h - 64)
      };
    } else if (interior) {
      walkTarget = { x: clamp(p.x, 24, world.w - 24), y: clamp(p.y, 150, world.h - 40) };
    } else {
      var W = world.w, H = world.h;
      var reach = 80;          // a tap this close to a seam means "go on"
      var x = clamp(p.x, band, W - band);
      var y = clamp(p.y, band + 40, H - band);
      // The seam tests in sectionCross: x < 26, x > W - 26, y < 110, y > H - 26.
      if (p.x < reach && neighbourOf(-1, 0)) x = -60;
      else if (p.x > W - reach && neighbourOf(1, 0)) x = W + 60;
      if (p.y < reach + 40 && neighbourOf(0, -1)) y = 30;
      else if (p.y > H - reach && neighbourOf(0, 1)) y = H + 40;
      walkTarget = { x: x, y: y };
      // On the shore, a tap on the other arm of the L must go round the corner:
      // a straight line between the two cuts the water, and she would stick.
      if (sectionDef().kind === 'sea' && !seaLineIsClear(hero, walkTarget)) {
        seaRoute = [seaCorner()];
      }
    }
    ripple = { x: clamp(walkTarget.x, 30, world.w - 30), y: clamp(walkTarget.y, 60, world.h - 30), age: 0 };
  }

  /* Do these two points see each other across the shore, or does the straight
     line between them cross the water? Only the inner corner of the L matters. */
  function seaLineIsClear(a, b) {
    if (!a || !b) return true;
    var d = sectionDef();
    if (!d || d.kind !== 'sea' || interior) return true;
    var sh = seaShore();
    var ax = a.x <= sh.left, ay = a.y <= sh.top;
    var bx = b.x <= sh.left, by = b.y <= sh.top;
    // On the same arm of the L: the line stays on the shore.
    return (ax && bx) || (ay && by);
  }

  /* The corner of the L, where both bands meet: the one waypoint a tapped walk
     needs on the shore. */
  function seaCorner() {
    var sh = seaShore();
    return { x: Math.max(24, sh.left - 26), y: Math.max(40, sh.top - 26) };
  }

  window.addEventListener('blur', function () {
    keys = Object.create(null);
    pointerId = null;
    if (phase === 'playing' && scene === 'island') paused = true;
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      keys = Object.create(null);
      pointerId = null;
      if (phase === 'playing' && scene === 'island') paused = true;
    }
  });

  // Boot.
  // What outlives a run comes back here, once every table and key exists.
  restoreLearned();
  bagInit();
  // The build checks itself, and says so on the console.
  window.__auditAndReport();
  loadImage('hero', ASSETS.hero);
  loadImage('enemy', ASSETS.enemy);
  loadImage('pickup', ASSETS.pickup);
  loadImage('background', ASSETS.background);
  loadImage('hive', ASSETS.hive);
  imageSettled();
  resize();
  window.addEventListener('resize', resize);
  layout();
  hero.x = world.w / 2;
  hero.y = world.h * 0.64;
  requestAnimationFrame(frame);
})();
</script>
